*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:1.25rem;margin:0}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
nav.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
nav.tabs button{border:0;border-radius:0}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.on,button.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{max-width:1500px;margin:auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
h2{font-size:1.2rem;margin:.1em 0 .4em}
h3{font-size:1.02rem;margin:0 0 .25em}
p{margin:.45em 0}
.muted{color:var(--muted);font-size:.92rem}
.note{background:var(--note);border-radius:9px;padding:9px 13px;margin:.7em 0;font-size:.95rem}
.warn{background:var(--warn);border-radius:9px;padding:9px 13px;margin:.7em 0;font-size:.95rem}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
/* level strip */
.levels{display:grid;gap:10px;margin-bottom:16px}
.level{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.level .lname{font-weight:600;min-width:11em}
.level .lname small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.qbtn{font-size:.92rem;padding:4px 11px}
/* question layout */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:1000px){.qgrid{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
@media (max-width:1000px){header{position:static}.sticky{top:0;z-index:3}.sticky .card{padding:6px 8px;box-shadow:0 4px 10px rgba(0,0,0,.12)}.sticky .hint{display:none}svg.ckt{max-height:36vh}}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--note);color:var(--acc);letter-spacing:.02em;text-transform:uppercase}
.qtext{margin:.6em 0 .8em}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.8em 0}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:st}
ol.steps>li{border-left:3px solid var(--line);padding:6px 0 8px 14px;margin:0 0 10px;counter-increment:st}
ol.steps>li h3::before{content:"Step " counter(st) " · ";color:var(--muted);font-weight:600}
ol.steps>li.new{border-left-color:var(--acc)}
.line{margin:.45em 0}
.how{font-size:.86rem;color:var(--muted)}
.eq{font-size:1.07rem;padding:3px 10px;border-left:3px solid var(--line);margin-top:2px;font-variant-numeric:tabular-nums;overflow-x:auto}
.eq:empty{display:none}
details{margin:.6em 0}summary{cursor:pointer;color:var(--muted)}
.answer{border:2px solid var(--acc);border-radius:10px;padding:8px 14px;margin:12px 0}
.try{background:var(--note);border-radius:9px;padding:8px 13px}
.try label{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0}
.try input{width:7.5em;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
/* help modes and one-number-at-a-time checking */
.modes{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:.6em 0 .8em}
.modes button{font-size:.9rem;padding:3px 12px}
ol.steps>li.pend{border-left-style:dashed;border-left-color:var(--acc)}
ol.steps>li.pend h3::after{content:" · your turn";color:var(--acc);font-size:.85rem}
ol.steps>li.pend .eq,ol.steps>li.pend .note,ol.steps>li.pend details{display:none}
ol.steps.own>li.pend>:not(h3){display:none}
ol.steps>li.won h3::after{content:" ✓";color:var(--ok)}
ol.steps>li.helped h3::after{content:" · with help";color:var(--muted);font-weight:400;font-size:.85rem}
.stage{background:var(--note);border:2px solid var(--acc);border-radius:10px;padding:10px 14px;margin:12px 0}
.stage .sq{font-weight:600;margin-bottom:6px}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srow label{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.srow input{width:8em;font:inherit;padding:4px 8px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.stage .warn{margin:.6em 0 .3em}
.stage ul{margin:.4em 0;padding-left:1.3em}
/* terms and variables */
.term{border-radius:4px;padding:0 2px;transition:background .12s;cursor:default}
.term.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.var{font-weight:600;font-style:italic;border-radius:4px}
.var.hl{background:var(--hl)}
.k0{color:var(--k0)}.k1{color:var(--k1)}.k2{color:var(--k2)}.k3{color:var(--k3)}.k4{color:var(--k4)}.kx{color:var(--kx)}
/* circuit */
svg.ckt{display:block;width:100%;height:auto;max-height:70vh;touch-action:manipulation}
svg.ckt text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:var(--ink)}
.wire{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.src{fill:var(--card)}
.arrowhead{fill:var(--ink)}
.sign{stroke:var(--ink);stroke-width:2.5;fill:none}
.dot{fill:var(--ink)}
.ul{stroke-width:14;stroke-linecap:round;opacity:0;transition:opacity .15s}
svg.colour .ul{opacity:.35}
svg.colour .ul.hl{opacity:.8}
.ul.k0{stroke:var(--k0)}.ul.k1{stroke:var(--k1)}.ul.k2{stroke:var(--k2)}.ul.k3{stroke:var(--k3)}.ul.k4{stroke:var(--k4)}
.lab{font-size:23px}
.lab.nm{font-weight:600}
.lab.val{fill:var(--muted)}
svg.ckt text.lab.dep{fill:var(--kx);font-weight:600}
svg.ckt text.lab.muted{fill:var(--muted);font-size:19px}
svg.ckt text.lab.nl{font-weight:700;font-size:25px}
svg.ckt text.k1{fill:var(--k1)}svg.ckt text.k2{fill:var(--k2)}svg.ckt text.k3{fill:var(--k3)}svg.ckt text.k4{fill:var(--k4)}
.ndot.k1{fill:var(--k1)}.ndot.k2{fill:var(--k2)}.ndot.k3{fill:var(--k3)}.ndot.k4{fill:var(--k4)}
.nlab.hl .ndot{r:11}
.halo{fill:var(--hl);opacity:0;transition:opacity .12s}
g.el{cursor:pointer}
g.el.hl .halo{opacity:1}
.ctrl .cline{stroke:var(--kx);stroke-width:2.5}
.ctrl .chead{fill:var(--kx)}
.ctrl .csign{stroke:var(--kx);stroke-width:2.5;fill:none}
svg.ckt text.lab.cx{fill:var(--kx);font-weight:700}
.ctrl.hl .cline,.ctrl.hl .csign{stroke-width:5}
.loop .lp{fill:none;stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round}
.loop.k1 .lp{stroke:var(--k1)}.loop.k2 .lp{stroke:var(--k2)}.loop.k3 .lp{stroke:var(--k3)}
.loop.k1 .lph{fill:var(--k1)}.loop.k2 .lph{fill:var(--k2)}.loop.k3 .lph{fill:var(--k3)}
svg.ckt .loop.k1 text{fill:var(--k1)}svg.ckt .loop.k2 text{fill:var(--k2)}svg.ckt .loop.k3 text{fill:var(--k3)}
.lab.ml{font-size:30px;font-weight:700;font-style:italic}
.loop.hl .lp{stroke-width:5;stroke-dasharray:none}
.loop{cursor:pointer}
.bubble{fill:var(--sup);fill-opacity:.06;stroke:var(--sup);stroke-width:2.5;stroke-dasharray:8 6;display:none}
svg.ckt text.lab.sup{fill:var(--sup);font-weight:600;display:none}
svg.over .bubble,svg.over text.lab.sup{display:inline}
/* method page */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.mgrid .card ol,.mgrid .card ul{padding-left:1.3em;margin:.4em 0}
.recipe{counter-reset:r}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.6em 0}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--note)}
.gen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.gen .code{font-family:Consolas,monospace;font-size:.9rem;color:var(--muted)}
.gen input{width:9em;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.hint{font-size:.88rem;color:var(--muted);margin:.4em 0 0}
@media (max-width:600px){body{font-size:16px}main{padding:12px 12px 50px}header{padding:10px 12px}.card{padding:12px}.level .lname{min-width:100%}}

/* Laplace pages: stacked fractions, the t <-> s pair card, the s-plane, graphs and the method widgets */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.2}

  let lo = Math.min(0, ...pts.map(p => p[1])), hi = Math.max(0, ...pts.map(p => p[1]));

  if (pl.marks) for (const v of [pl.marks.f0, pl.marks.finf]) if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-9) hi = lo + 1;
  const pad = 0.1 * (hi - lo); lo -= lo < 0 ? pad : 0; hi += pad;
  const X = t => L + (t - t0) / (T - t0) * (W - L - R), Y = y => Tm + (hi - y) / (hi - lo) * (H - Tm - B);
  let s = `<svg class="plot" viewBox="0 0 ${W} ${H}" data-w="${W}" data-l="${L}" data-r="${R}" data-span="${T}" data-tmin="${t0}" role="img" aria-label="graph of ${pl.name || 'f'}(t)">`;
  const xs = niceStep(T), ys = niceStep(hi - lo);
  for (let x = 0; x <= T + 1e-9; x += xs) s += `<line class="grid" x1="${X(x)}" x2="${X(x)}" y1="${Tm}" y2="${H - B}"/><text class="tick" x="${X(x)}" y="${H - B + 18}" text-anchor="middle">${tk(x)}</text>`;
  for (let y = Math.ceil(lo / ys) * ys; y <= hi + 1e-9; y += ys) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text class="tick" x="${L - 6}" y="${Y(y) + 5}" text-anchor="end">${tk(y)}</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${Tm}" y2="${H - B}"/>`;
  s += `<text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">t (s)</text><text class="tick" x="${L + 4}" y="${Tm + 12}">${pl.name || 'f'}(t)</text>`;
  if (pl.marks && Number.isFinite(pl.marks.finf)) s += `<line class="final" x1="${L}" x2="${W - R}" y1="${Y(pl.marks.finf)}" y2="${Y(pl.marks.finf)}"/><text class="finalt" x="${W - R - 4}" y="${Y(pl.marks.finf) - 6}" text-anchor="end">${pl.name || 'f'}(∞) = ${Nt(pl.marks.finf)}</text>`;
  const path = arr => arr.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(Math.max(lo, Math.min(hi, p[1]))).toFixed(1)).join('');
  if (pl.ghost) { const gh = t => pl.ghost.reduce((a, f) => a + fval(f, t), 0); s += `<path class="ghost" d="${path(pts.map(p => [p[0], gh(p[0])]))}"/>`; }
  s += `<path class="curve" d="${path(pts)}"/>`;
  for (const f of imps) {
    const x = X(f.d), y1 = Y(0), y2 = Y(f.c), up = f.c > 0 ? 1 : -1;
    s += `<line class="imp" x1="${x}" x2="${x}" y1="${y1}" y2="${y2 + up * 9}"/><path class="imph" d="M${x - 7},${y2 + up * 12} L${x},${y2} L${x + 7},${y2 + up * 12} z"/><text class="impt" x="${x + 9}" y="${y2 + (up > 0 ? 14 : -4)}">${Nt(f.c)}δ</text>`;
  }
  if (pl.marks && Number.isFinite(pl.marks.f0)) s += `<circle class="p0" cx="${X(0)}" cy="${Y(pl.marks.f0)}" r="6"/><text class="p0t" x="${X(0) + 10}" y="${Y(pl.marks.f0) - 8}">${pl.name || 'f'}(0⁺) = ${Nt(pl.marks.f0)}</text>`;
  if (tCur !== null) {
    const v = g(tCur), x = X(tCur);
    s += `<line class="cur" x1="${x}" x2="${x}" y1="${Tm}" y2="${H - B}"/><circle class="curd" cx="${x}" cy="${Y(v)}" r="5"/><text class="curt" x="${Math.min(x + 8, W - 150)}" y="${Tm + 16}">t = ${sf(tCur, 3)} s: ${pl.name || 'f'} = ${sf(v, 3)}</text>`;
  }
  return s + '</svg>';
}
function pzSVG(pz) {
  const W = 330, H = 250, poles = pz.poles || [];
  const ext = Math.max(2, ...poles.map(p => Math.abs(p.re)), ...poles.map(p => Math.abs(p.im)));
  const st = ext > 12 ? 5 : ext > 6 ? 2 : 1, Rg = Math.ceil(ext * 1.25 / st) * st;
  const xmin = -Rg, xmax = Math.max(st * 2, Math.ceil((Math.max(0, ...poles.map(p => p.re)) + st) / st) * st), ymax = Rg;
  const L = 14, R = 14, Tm = 14, B = 26;
  const X = x => L + (x - xmin) / (xmax - xmin) * (W - L - R), Y = y => Tm + (ymax - y) / (2 * ymax) * (H - Tm - B);
  let s = `<svg class="pz" viewBox="0 0 ${W} ${H}" role="img" aria-label="pole map on the s-plane">`;
  s += `<rect class="lhp" x="${X(xmin)}" y="${Tm}" width="${X(0) - X(xmin)}" height="${H - Tm - B}"/><rect class="rhp" x="${X(0)}" y="${Tm}" width="${X(xmax) - X(0)}" height="${H - Tm - B}"/>`;
  s += `<text class="zone" x="${X(xmin) + 6}" y="${H - B - 8}">left half: dies away</text><text class="zone r" x="${X(xmax) - 6}" y="${H - B - 8}" text-anchor="end">grows</text>`;
  for (let x = xmin; x <= xmax + 1e-9; x += st) if (Math.abs(x) > 1e-9) s += `<line class="tk" x1="${X(x)}" x2="${X(x)}" y1="${Y(0) - 4}" y2="${Y(0) + 4}"/><text class="tick" x="${X(x)}" y="${Y(0) + 17}" text-anchor="middle">${tk(x)}</text>`;
  for (let y = -ymax; y <= ymax + 1e-9; y += st) if (Math.abs(y) > 1e-9) s += `<line class="tk" x1="${X(0) - 4}" x2="${X(0) + 4}" y1="${Y(y)}" y2="${Y(y)}"/><text class="tick" x="${X(0) + 7}" y="${Y(y) + 4}">${y > 0 ? 'j' + tk(y) : MI + 'j' + tk(-y)}</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="${Tm}" y2="${H - B}"/>`;
  s += `<text class="axl" x="${W - R}" y="${Y(0) - 7}" text-anchor="end">σ</text><text class="axl" x="${X(0) - 7}" y="${Tm + 12}" text-anchor="end">jω</text>`;
  poles.forEach(p => {
    const x = X(p.re), y = Y(p.im), r = 8;
    s += `<g class="pole${p.cls ? ' ' + p.cls : ''}"><path d="M${x - r},${y - r} L${x + r},${y + r} M${x - r},${y + r} L${x + r},${y - r}"/>${p.m > 1 ? `<text class="mult" x="${x + 9}" y="${y - 8}">×${p.m}</text>` : ''}${p.lab ? `<text class="plab" x="${x}" y="${y + (p.im < 0 ? 24 : -14)}" text-anchor="middle">${p.lab}</text>` : ''}</g>`;
  });
  if (pz.note) s += `<text class="tick" x="${W / 2}" y="${Tm + 14}" text-anchor="middle">${pz.note}</text>`;
  else if (!poles.length) s += `<text class="tick" x="${W / 2}" y="${Tm + 30}" text-anchor="middle">no poles (F(s) is a constant${pz.delay ? ' × delay' : ''})</text>`;
  return s + '</svg>';
}

// ---------------------------------------------------------------- stages and steps
const stage = (html, val, step, wrong = [], unit = '', o = {}) => ({ html, val, step, wrong, unit, kind: 'real', ...o });
const W_ = (val, why) => ({ val, why });
const BOX = (t, cl = 'k1') => `<b class="box ${cl}">${t}</b>`;

// ================================================================ BASIC KINDS
const KINDS = {};
function delayStep(f, steps) {
  steps.push({ type: 'setup', title: 'Put the delay to one side', say: `The signal switches on at t = ${N(f.d)} s, and inside it every t is written as (t ${MI} ${N(f.d)}). That is the time-shift rule:`,
    lines: [{ how: 'Time shift (delay by d): work out the transform without the delay, then multiply by e<sup>−ds</sup>', eq: `f(t ${MI} d) u(t ${MI} d) &nbsp;⇔&nbsp; e<sup>−ds</sup> F(s), &nbsp; here d = ${N(f.d)}` }],
    note: 'Do not mix it up with the frequency shift: e<sup>−at</sup> × f(t) changes s into s + a. A delay changes nothing inside F(s); it only adds the factor e<sup>−ds</sup>.' });
}

// value of a signal at given times (warm-up)
KINDS.val = q => {
  const f = q.f, steps = [], answers = [];
  const text = `A signal is f(t) = ${tH(f)}${f.d ? '' : ' (for t ≥ 0)'}. Find its value at ${q.ts.map(t => `t = ${sf(t)} s`).join(' and at ')}.`;
  const bits = [];
  if (f.d) bits.push(`u(t ${MI} ${N(f.d)}) is a switch: 0 before t = ${N(f.d)} s and 1 after it. Inside the signal, use the time since it switched on, t ${MI} ${N(f.d)}.`);
  if (f.a) bits.push(`The factor e<sup>${MI}${f.a === 1 ? '' : N(f.a)}t</sup> starts at 1 and dies away: the bigger a, the faster.`);
  if (f.sh === 'sin' || f.sh === 'cos') bits.push(`In ${f.sh} ωt the angle ωt is in <b>radians</b>: set the calculator to RAD.`);
  if (f.sh === 'pow' && f.n) bits.push(`t<sup>${f.n > 1 ? f.n : ''}</sup> grows with time${f.a ? ', while the exponential pulls it back down' : ''}.`);
  if (!bits.length) bits.push('A step: it jumps to its height at t = 0 and stays there.');
  steps.push({ type: 'setup', title: 'Read the signal piece by piece', say: bits.join(' '), lines: [{ how: 'The signal', eq: `f(t) = ${tH(f)}` }], plot: true });
  const g = (t, o = {}) => {        // the value with optional mistakes
    const x = o.noDelay ? t : t - f.d;
    if (!o.noDelay && t < f.d - 1e-12) return 0;
    const e = Math.exp((o.plusExp ? 1 : -1) * f.a * x), c = o.noC ? 1 : f.c;
    if (f.sh === 'pow') return c * x ** f.n * e;
    const ang = o.deg ? f.w * x * Math.PI / 180 : f.w * x;
    return c * e * (f.sh === 'sin' ? Math.sin(ang) : Math.cos(ang));
  };
  q.ts.forEach(t => {
    const v = g(t), lines = [];
    if (f.d && t < f.d - 1e-12) lines.push({ how: `t = ${N(t)} is before the switch-on time ${N(f.d)} s`, eq: `u(${sf(t)} ${MI} ${N(f.d)}) = u(${sf(t - f.d)}) = 0, &nbsp; so f(${sf(t)}) = 0` });
    else {
      const x = t - f.d, parts = [];
      if (f.d) lines.push({ how: 'Time since the switch-on', eq: `t ${MI} ${N(f.d)} = ${sf(t)} ${MI} ${N(f.d)} = ${sf(x)} s` });
      if (f.sh === 'pow' && f.n) parts.push([`${sf(x)}${f.n > 1 ? `<sup>${f.n}</sup>` : ''}`, x ** f.n]);
      if (f.a) parts.push([`e<sup>${MI}${N(f.a)} × ${sf(x)}</sup>`, Math.exp(-f.a * x)]);
      if (f.sh === 'sin' || f.sh === 'cos') parts.push([`${f.sh}(${N(f.w)} × ${sf(x)})`, f.sh === 'sin' ? Math.sin(f.w * x) : Math.cos(f.w * x)]);
      const cs = Math.abs(f.c - 1) < 1e-12 ? [] : [N(f.c)];
      lines.push({ how: 'Put the time into each piece', eq: `f(${sf(t)}) = ${cs.concat(parts.map(p => p[0])).join(' × ') || '1'}` });
      if (parts.length) lines.push({ how: 'Work out each piece on the calculator', eq: `= ${cs.concat(parts.map(p => sf(p[1], 4))).join(' × ')} = ${sf(v, 4)}` });
    }
    steps.push({ type: 'answer', title: `Value at t = ${sf(t)} s`, lines });
    const wr = [];
    if (f.d) wr.push(W_(g(t, { noDelay: true }), t < f.d ? `u(t ${MI} ${N(f.d)}) is still 0 before t = ${N(f.d)} s: the signal has not switched on yet.` : `Inside a delayed signal use the time since switch-on, t ${MI} ${N(f.d)}, not t itself.`));
    if (f.a) wr.push(W_(g(t, { plusExp: true }), 'The power of e is negative: e<sup>−at</sup> gets smaller as t grows.'));
    if (f.w) wr.push(W_(g(t, { deg: true }), 'Your calculator is in degrees. In sin ωt and cos ωt the angle is in radians: switch to RAD.'));
    if (Math.abs(f.c - 1) > 1e-12) wr.push(W_(g(t, { noC: true }), `Multiply by the number in front, ${N(f.c)}.`));
    answers.push(stage(`f(${sf(t)})`, v, steps.length - 1, wr));
  });
  const terms = [f];
  return { text, steps, answers, plot: { terms, T: Math.max(plotSpan(terms), ...q.ts.map(t => t * 1.2)), name: 'f' }, plotAt: 0, pair: { t: tH(f), s: sH(f, true), known: 't', at: -1 } };
};

// forward transform of one table entry
KINDS.fwd = q => {
  const f = q.f, sp = sParts(f), steps = [], answers = [];
  const form = f.sh === 'imp' ? `${BOX('K')}${f.d ? ` e<sup>−${BOX('d', 'kx')}s</sup>` : ''}`
    : `${FR(f.sh === 'cos' ? `${BOX('K')}(${f.a ? `s + ${BOX('a', 'k2')}` : 's'})` : BOX('K') + (f.d ? ` e<sup>−${BOX('d', 'kx')}s</sup>` : ''),
      f.sh === 'pow' ? `${f.a ? `(s + ${BOX('a', 'k2')})` : 's'}${f.n ? `<sup>${BOX('m', 'k3')}</sup>` : ''}` : `${f.a ? `(s + ${BOX('a', 'k2')})` : 's'}<sup>2</sup> + ${BOX('b', 'k3')}`)}${f.sh === 'cos' && f.d ? ` × e<sup>−${BOX('d', 'kx')}s</sup>` : ''}`;
  const text = `Find the Laplace transform F(s) of f(t) = ${tH(f)}${f.d ? '' : ', t ≥ 0'}.<div class="form">Write the answer as &nbsp; F(s) = ${form}</div>`;
  if (f.d) delayStep(f, steps);
  // 1. the pattern
  const lines = [];
  if (Math.abs(f.c - 1) > 1e-12) lines.push({ how: `Linearity: the number in front (${N(f.c)}) just waits outside and multiplies the answer`, eq: `f(t) = ${N(f.c)} × [${tBody({ ...f, c: 1, d: 0 })}]` });
  lines.push({ how: 'The matching row of the table', eq: rowH(f) });
  const vals = [];
  if (f.sh === 'pow' && f.n) vals.push(`n = ${f.n}`);
  if (f.a) vals.push(`a = ${N(f.a)}`);
  if (f.w) vals.push(`ω = ${N(f.w)} rad/s`);
  if (vals.length) lines.push({ how: 'Read the numbers off the signal', eq: vals.join(', &nbsp; ') });
  const what = f.sh === 'imp' ? 'an impulse' : f.sh === 'pow' ? (f.n ? (f.a ? 'a power of t times a decaying exponential' : 'a power of t') : (f.a ? 'a decaying exponential' : 'a step')) : `${f.a ? 'a damped ' : 'a '}${f.sh === 'sin' ? 'sine' : 'cosine'}`;
  steps.push({ type: 'setup', title: 'Spot the pattern in the table', say: `${f.d ? 'Without the delay this is' : 'This is'} ${what}.${f.a ? ` The e<sup>−${f.a === 1 ? '' : N(f.a)}t</sup> is a <b>frequency shift</b>: every s in the plain pair becomes s + ${N(f.a)}.` : ''}`, lines });
  // 2. the number on top
  let tl, wr = [];
  if (f.sh === 'imp') { tl = [{ how: 'δ(t) ⇔ 1, so the number in front is the whole answer', eq: `K = ${N(f.c)}` }]; }
  else if (f.sh === 'pow') {
    tl = f.n >= 2 ? [{ how: 'Work out n! (n factorial: multiply down to 1)', eq: `${f.n}! = ${Array.from({ length: f.n }, (_, i) => f.n - i).join(' × ')} = ${fact(f.n)}` }] : f.n === 1 ? [{ how: 'n = 1', eq: '1! = 1' }] : [];
    tl.push({ how: f.n ? 'Number on top = (number in front) × n!' : 'The table has 1 on top, so the number on top is the number in front', eq: `K = ${f.n ? `${N(f.c)} × ${fact(f.n)} = ` : ''}${N(sp.top)}` });
    if (f.n >= 2) wr.push(W_(f.c, `You forgot the n! on top: t<sup>${f.n}</sup> ⇔ ${f.n}!/s<sup>${f.n + 1}</sup> = ${fact(f.n)}/s<sup>${f.n + 1}</sup>.`), W_(f.c * f.n, `n! is not n: ${f.n}! = ${Array.from({ length: f.n }, (_, i) => f.n - i).join(' × ')} = ${fact(f.n)}.`), W_(f.c * fact(f.n + 1), `Use n! with n = ${f.n} (the power of t), not (n + 1)!.`));
    if (f.n >= 1) wr.push(W_(fact(f.n), `Multiply n! by the number in front, ${N(f.c)}.`));
  } else if (f.sh === 'sin') {
    tl = [{ how: 'Sine has ω on top: number on top = (number in front) × ω', eq: `K = ${N(f.c)} × ${N(f.w)} = ${N(sp.top)}` }];
    wr.push(W_(f.c, `Sine has ω on top: sin ωt ⇔ ω/(s² + ω²). Multiply by ω = ${N(f.w)}.`), W_(f.c * f.w * f.w, 'ω goes on top once; ω² belongs on the bottom.'), W_(f.w, `Multiply ω by the number in front, ${N(f.c)}.`));
  } else {
    tl = [{ how: `Cosine has ${f.a ? '(s + a)' : 's'} on top, so only the number in front is left over`, eq: `K = ${N(f.c)}` }];
    wr.push(W_(f.c * f.w, `That is the sine pattern (ω on top). Cosine has ${f.a ? '(s + a)' : 's'} on top, with no ω.`));
  }
  steps.push({ type: 'algebra', title: 'Work out the number on top', lines: tl });
  answers.push(stage(f.sh === 'cos' ? `K (the number in front of ${f.a ? '(s + a)' : 's'} on top)` : 'K (the number on top)', sp.top, steps.length - 1, wr));
  // 3. the shift
  if (f.a) {
    steps.push({ type: 'algebra', title: 'Read the shift a', say: `The factor e<sup>−${f.a === 1 ? '' : N(f.a)}t</sup> means a = ${N(f.a)}: every s in the plain pair turns into (s + ${N(f.a)}).`, lines: [{ how: 'The bracket on the bottom', eq: `(s + ${N(f.a)})` }] });
    answers.push(stage('a (in s + a)', f.a, steps.length - 1, [W_(-f.a, `e<sup>−${N(f.a)}t</sup> gives (s + ${N(f.a)}) with a plus sign: the minus in the exponent becomes plus in the bracket.`)]));
  }
  // 4. the bottom
  if (f.sh === 'pow' && f.n) {
    steps.push({ type: 'algebra', title: 'Find the power on the bottom', lines: [{ how: 'The power is one more than the power of t', eq: `m = n + 1 = ${f.n} + 1 = ${f.n + 1}` }] });
    answers.push(stage('m (the power on the bottom)', f.n + 1, steps.length - 1, [W_(f.n, `The power on the bottom is n + 1, one more than the power of t: t<sup>${f.n}</sup> ⇔ …/s<sup>${f.n + 1}</sup>.`)]));
  } else if (f.sh === 'sin' || f.sh === 'cos') {
    steps.push({ type: 'algebra', title: 'Find the number added on the bottom', lines: [{ how: 'The bottom has ω squared', eq: `b = ω<sup>2</sup> = ${N(f.w)}<sup>2</sup> = ${N(f.w * f.w)}` }] });
    answers.push(stage('b = ω²', f.w * f.w, steps.length - 1, [W_(f.w, `Square ω: the bottom is s² + ω², so b = ${N(f.w)}² = ${N(f.w * f.w)}.`), W_(2 * f.w, `ω² means ω × ω, not 2 × ω.`)]));
  }
  if (f.d) {
    steps.push({ type: 'algebra', title: 'Put the delay back', lines: [{ how: 'Multiply by e<sup>−ds</sup> with the delay d', eq: `e<sup>−${N(f.d)}s</sup>` }] });
    answers.push(stage('d (in e<sup>−ds</sup>)', f.d, steps.length - 1, [W_(-f.d, `The delay factor is e<sup>−ds</sup> with d = ${N(f.d)} (the switch-on time), a positive number.`)], 's'));
  }
  steps.push({ type: 'answer', title: 'Answer', say: 'Colours: <span class="k1">number on top</span>, <span class="k2">shift a</span>, <span class="k3">power or ω²</span>' + (f.d ? ', <span class="kx">delay</span>' : '') + '.', lines: [{ how: 'The Laplace transform', eq: `F(s) = ${sH(f, true)}` }], pz: true });
  if (f.sh !== 'imp') {
    const v0 = f0p(f);
    steps.push({ type: 'check', title: 'Check with the initial value theorem', say: 'f(0<sup>+</sup>) read from the signal must equal the limit of s F(s) as s → ∞ (A&S 15.3).',
      lines: [{ how: 'From the signal', eq: `f(0<sup>+</sup>) = ${N(v0)}${f.d ? ' (it has not switched on yet)' : ''}` },
        { how: 'From F(s): multiply by s and let s grow without limit', eq: `lim<sub>s→∞</sub> s F(s) = ${N(v0)} &nbsp;${f.d ? '(e<sup>−ds</sup> → 0)' : sp.cosTop || (f.sh === 'pow' && !f.n) ? '(top and bottom have the same power of s)' : '(the bottom has the higher power of s)'} &nbsp;✓` }] });
  }
  return { text, steps, answers, plot: { terms: [f], T: plotSpan([f]), name: 'f' }, plotAt: -1, pz: { poles: polesOf(f), delay: f.d }, pzAt: steps.findIndex(s => s.pz),
    pair: { t: tH(f), s: sH(f, true), known: 't', at: steps.findIndex(s => s.pz) } };
};

// inverse transform of one table entry
KINDS.inv = q => {
  const f = q.f, sp = sParts(f), steps = [], answers = [];
  const dbox = f.d ? `(t ${MI} ${BOX('d', 'kx')})` : 't';
  const form = f.sh === 'imp' ? `${BOX('A')} δ(${f.d ? `t ${MI} ${BOX('d', 'kx')}` : 't'})`
    : f.sh === 'pow' ? `${BOX('A')} ${(f.n ? `${dbox}<sup>${BOX('n', 'k3')}</sup>` : '') + (f.a ? ` e<sup>−${BOX('a', 'k2')}${dbox}</sup>` : '') || (f.d ? '' : 'u(t)')}${f.d ? ` u(t ${MI} ${BOX('d', 'kx')})` : ''}`
    : `${BOX('A')}${f.a ? ` e<sup>−${BOX('a', 'k2')}${dbox}</sup>` : ''} ${f.sh} ${BOX('ω', 'k3')}${dbox}${f.d ? ` u(t ${MI} ${BOX('d', 'kx')})` : ''}`;
  const text = `Find f(t) when F(s) = ${sH(f)}.<div class="form">Write the answer as &nbsp; f(t) = ${form}</div>`;

// partial fractions (and the inverse) of a rational F(s)

// a quadratic s² + bs + c with real roots (from a differential equation): its roots become factors flagged fromSplit
function markSplit(R, q) {

// factorise a quadratic with real roots (warm-up)
KINDS.roots = q => {

  if (Math.abs(c) < 1e-12) steps.push({ type: 'setup', title: 'Take out the common s', say: 'There is no constant term, so every term has an s in it.', lines: [{ how: 'Factor s out', eq: `${quadH(q)} = s(${linH(b)})` }] });

// complete the square (warm-up)

  const poles = []; R.facs.forEach(f => poles.push({ re: -f.p, im: 0, m: f.m })); if (R.quad) { const al = R.quad.b / 2, be2 = R.quad.c - al * al; if (be2 > 0) poles.push({ re: -al, im: Math.sqrt(be2), m: 1, cls: 'cx' }, { re: -al, im: -Math.sqrt(be2), m: 1, cls: 'cx' }); else { const r = Math.sqrt(-be2); poles.push({ re: -al + r, im: 0, m: 1 }, { re: -al - r, im: 0, m: 1 }); } }

  steps.push({ type: 'algebra', title: 'Initial value: multiply by s, let s → ∞', say: `f(0<sup>+</sup>) = lim<sub>s→∞</sub> s F(s). Only the highest powers matter when s is huge: divide top and bottom by s<sup>${dd}</sup>; every term with 1/s left over dies.`,
    lines: [{ how: 's × F(s)', eq: `s F(s) = ${FR(polyH(sN), polyH(D))}` },
      { how: dn + 1 < dd ? `The top's highest power (s<sup>${dn + 1}</sup>) is below the bottom's (s<sup>${dd}</sup>)` : `Top and bottom both have s<sup>${dd}</sup>: keep only those two numbers`, eq: `f(0<sup>+</sup>) = ${dn + 1 < dd ? '0' : `${N(Nn[dn])} ÷ ${N(D[dd])} = ${N(v0)}`}` }] });
  answers.push(stage('f(0<sup>+</sup>)', v0, 0, [W_(dn + 1 < dd ? Nn[dn] : NaN, `The top's highest power (s<sup>${dn + 1}</sup>) is lower than the bottom's (s<sup>${dd}</sup>), so the limit is 0.`), W_(Number.isFinite(pev(Nn, 0) / pev(D, 0)) ? pev(Nn, 0) / pev(D, 0) : NaN, 'That is F(0). The initial value needs s → ∞, after multiplying by s.')]));
  steps.push({ type: 'setup', title: 'Where are the poles?', say: fvOK ? 'The final value theorem only works if every pole is in the left half of the s-plane (a single pole at s = 0 is allowed): then f(t) settles.' : 'The final value theorem only works if every pole is in the left half of the s-plane (a single pole at s = 0 is allowed).',
    lines: [{ how: 'Poles (bottom = 0)', eq: poles.filter(p => p.im >= 0).map(p => `s = ${p.im ? `${N(p.re)} ± j${N(p.im)}` : N(p.re)}${p.m > 1 ? ' (double)' : ''}`).join(', &nbsp; ') },
      { how: fvOK ? 'All in the left half (or a single one at 0)' : 'Not all in the left half', eq: fvOK ? 'The final value theorem can be used ✓' : `${bad.filter(p => p.im >= 0).map(p => `s = ${p.im ? `${N(p.re)} ± j${N(p.im)}` : N(p.re)}`).join(', ')} ${bad.some(p => Math.abs(p.re) < 1e-12) ? 'sits on the jω axis: f(t) keeps oscillating' : 'is in the right half: f(t) grows without limit'}. <b>No final value</b>; the theorem would give a wrong number.` }], pz: true });

  }

    const so = pfSolve(R); terms = so.terms;
    steps.push(fvOK ? { type: 'check', title: 'Compare with f(t)', say: 'Partial fractions (not needed for the theorems) give f(t); its start and end agree.', lines: [{ how: 'f(t)', eq: `f(t) = ${tSum(terms)}` }, { how: 'At t = 0 and as t → ∞', eq: `f(0<sup>+</sup>) = ${N(terms.reduce((a, f) => a + f0p(f), 0))}, &nbsp; f(∞) = ${N(vinf)} &nbsp;✓` }], plot: true }

  return { text, rat: { N: Nn, D }, steps, answers, pz: { poles }, pzAt: steps.findIndex(s => s.pz), plot: terms ? { terms, T: plotSpan(terms), name: 'f', marks: { f0: v0, finf: vinf } } : null, plotAt };
};

// ---------------------------------------------------------------- differential equations
const yH = (k, v = 'y') => (k === 2 ? `${v}″(t)` : k === 1 ? `${v}′(t)` : `${v}(t)`);
const inpH = i => (!i || i.type === 'none' || !i.K ? '0' : i.type === 'step' ? `${N(i.K)}u(t)` : `${N(i.K)}e<sup>${MI}${i.b === 1 ? '' : N(i.b)}t</sup>`);

const lhs = (cs, v = 'y') => cs.map(([k, c], j) => coefH(c, yH(k, v), j === 0)).join('');
// y' + a y = input, y(0) = y0
KINDS.ode1 = q => {
  const { a, y0 } = q, inp = q.inp || { type: 'none' }, ctx = { steps: [], answers: [], noCheck: true }, S = ctx.steps, A = ctx.answers;
  const text = `Use the Laplace transform to solve &nbsp; ${lhs([[1, 1], [0, a]])} = ${inpH(inp)}, &nbsp; with y(0) = ${N(y0)}.`;
  S.push({ type: 'setup', title: 'Transform every term', say: 'Use the derivative rule: the starting value y(0) comes in here, so you never need a separate constant (A&S Eq. 15.23).',
    lines: [{ how: 'Derivative rule', eq: `y′(t) &nbsp;⇔&nbsp; sY(s) ${MI} y(0) = sY(s) ${MI} ${P(y0)}` }, { how: 'The unknown itself', eq: 'y(t) &nbsp;⇔&nbsp; Y(s)' }, { how: 'The right side (table)', eq: `${inpH(inp)} &nbsp;⇔&nbsp; ${inpS(inp)}` }] });
  S.push({ type: 'equation', title: 'Write the s-domain equation', lines: [{ how: 'Replace each term', eq: `[sY(s) ${MI} ${P(y0)}] + ${N(a)}Y(s) = ${inpS(inp)}` }] });
  let R, how;
  if (inp.type === 'step') { R = { facs: [{ p: 0, m: 1 }, { p: a, m: 1 }], quad: null, N: [inp.K, y0] }; how = `(s + ${N(a)})Y(s) = ${N(y0)} + ${FR(N(inp.K), 's')} = ${FR(polyH([inp.K, y0]), 's')}`; }
  else if (inp.type === 'exp') { R = { facs: [{ p: a, m: 1 }, { p: inp.b, m: 1 }], quad: null, N: [y0 * inp.b + inp.K, y0] }; how = `(s + ${N(a)})Y(s) = ${N(y0)} + ${FR(N(inp.K), linH(inp.b))} = ${FR(polyH([y0 * inp.b + inp.K, y0]), linH(inp.b))}`; }
  else { R = { facs: [{ p: a, m: 1 }], quad: null, N: [y0] }; how = `(s + ${N(a)})Y(s) = ${N(y0)}`; }
  S.push({ type: 'algebra', title: 'Collect the Y(s) terms and divide', say: `Move ${P(y0)} to the right (it changes sign), take Y(s) out as a common factor, then divide by (s + ${N(a)}).`,
    lines: [{ how: 'Collect', eq: how }, { how: 'Divide', eq: `Y(s) = ${ratH(R)}` }] });

  if (inp.type === 'exp') A.push(stage('the constant on top of Y(s)', y0 * inp.b + inp.K, yi, [W_(-y0 * inp.b + inp.K, 'sY − y(0): when y(0) moves to the right it becomes +y(0).'), W_(inp.K, `y(0) also multiplies (s + ${N(inp.b)}) when you make one fraction.`)]));

};
// y'' + b y' + c y = input, y(0) = y0, y'(0) = y1
KINDS.ode2 = q => {
  const { b, c, y0, y1 } = q, K = q.K || 0, ctx = { steps: [], answers: [], noCheck: true }, S = ctx.steps, A = ctx.answers, inp = K ? { type: 'step', K } : { type: 'none' };
  const text = `Use the Laplace transform to solve &nbsp; ${lhs([[2, 1], [1, b], [0, c]])} = ${inpH(inp)}, &nbsp; with y(0) = ${N(y0)} and y′(0) = ${N(y1)}.`;
  S.push({ type: 'setup', title: 'Transform every term', say: 'Both starting values come in through the derivative rules (A&S Eq. 15.24).',
    lines: [{ how: 'Second derivative', eq: `y″(t) &nbsp;⇔&nbsp; s<sup>2</sup>Y(s) ${MI} s y(0) ${MI} y′(0) = s<sup>2</sup>Y(s) ${MI} ${N(y0)}s ${MI} ${P(y1)}` },
      { how: 'First derivative', eq: `y′(t) &nbsp;⇔&nbsp; sY(s) ${MI} y(0) = sY(s) ${MI} ${P(y0)}` }, { how: 'The right side', eq: `${inpH(inp)} &nbsp;⇔&nbsp; ${inpS(inp)}` }] });
  S.push({ type: 'equation', title: 'Write the s-domain equation', lines: [{ how: 'Replace each term', eq: `[s<sup>2</sup>Y ${MI} ${N(y0)}s ${MI} ${P(y1)}] + ${N(b)}[sY ${MI} ${P(y0)}] + ${N(c)}Y = ${inpS(inp)}` }] });

  S.push({ type: 'algebra', title: 'Collect the Y(s) terms on the left', say: 'Everything with Y(s) stays on the left; the starting-value terms move to the right and change sign.',

  const facs = K ? [{ p: 0, m: 1 }] : [];
  const R = disc >= -1e-12 ? { facs, quad: null, N: top } : { facs, quad: { b, c }, N: top };
  if (disc >= -1e-12) markSplit(R, { split: { b, c }, N: top });
  S.push({ type: 'algebra', title: 'Make Y(s) one fraction', lines: [{ how: K ? 'Multiply the right side by s/s to combine, then divide by the quadratic' : 'Divide by the quadratic', eq: `Y(s) = ${FR(polyH(top), denH(R))}` }] });

  ctx.steps.push({ type: 'check', title: 'Check the start and the end', lines: [{ how: 'At t = 0', eq: `y(0) = ${N(ctx.terms.reduce((s, f) => s + f0p(f), 0))} &nbsp;✓ (given ${N(y0)})` }, { how: 'Long after', eq: `y(∞) = ${N(yinf)}${K ? ` (= ${N(K)} ÷ ${N(c)}: put y″ = y′ = 0)` : ''} &nbsp;✓` }] });

};
// integro-differential: y' + a y + c ∫ y = K u(t), y(0) = y0
KINDS.ide = q => {
  const { a, c, y0, K } = q, ctx = { steps: [], answers: [], noCheck: true }, S = ctx.steps, A = ctx.answers;
  const text = `Use the Laplace transform to solve &nbsp; y′(t) + ${N(a)}y(t) + ${N(c)}∫<sub>0</sub><sup>t</sup> y(τ) dτ = ${N(K)}u(t), &nbsp; with y(0) = ${N(y0)}.`;
  S.push({ type: 'setup', title: 'Transform every term', say: 'The integral rule divides by s (A&S Eq. 15.28); the derivative rule brings in y(0).',
    lines: [{ how: 'Derivative', eq: `y′(t) &nbsp;⇔&nbsp; sY(s) ${MI} ${P(y0)}` }, { how: 'Integral', eq: `∫<sub>0</sub><sup>t</sup> y(τ) dτ &nbsp;⇔&nbsp; ${FR('Y(s)', 's')}` }, { how: 'Right side', eq: `${N(K)}u(t) &nbsp;⇔&nbsp; ${FR(N(K), 's')}` }] });
  S.push({ type: 'equation', title: 'Write the s-domain equation', lines: [{ how: 'Replace each term', eq: `sY ${MI} ${P(y0)} + ${N(a)}Y + ${N(c)}${FR('Y', 's')} = ${FR(N(K), 's')}` }] });
  S.push({ type: 'algebra', title: 'Multiply every term by s', say: 'This clears the 1/s fractions. Then collect Y(s).', lines: [{ how: '× s', eq: `s<sup>2</sup>Y ${MI} ${N(y0)}s + ${N(a)}sY + ${N(c)}Y = ${N(K)}` }, { how: 'Collect', eq: `(${quadH({ b: a, c })})Y(s) = ${polyH([K, y0])}` }] });
  A.push(stage('the number in front of s on the right', y0, 2, [W_(-y0, 'The −y(0)s term moves to the right and becomes +y(0)s.')]));
  const disc = a * a - 4 * c, top = [K, y0];
  const R = disc >= -1e-12 ? { facs: [], quad: null, N: top } : { facs: [], quad: { b: a, c }, N: top };
  if (disc >= -1e-12) markSplit(R, { split: { b: a, c }, N: top });
  S.push({ type: 'algebra', title: 'Divide to get Y(s)', lines: [{ how: 'Y(s) on its own', eq: `Y(s) = ${FR(polyH(top), denH(R))}` }] });
  pfWrite(R, { F: 'Y', f: 'y' }, ctx);
  ctx.steps.push({ type: 'check', title: 'Check the start', lines: [{ how: 'At t = 0', eq: `y(0) = ${N(ctx.terms.reduce((s, f) => s + f0p(f), 0))} &nbsp;✓ (given ${N(y0)})` }] });

};

// ---------------------------------------------------------------- solving, mistake filter, generator
function solveQ(q) {
  if (q.sol) return q.sol;
  const s = KINDS[q.kind](q);
  if (q.text) s.text = q.text;
  s.answers.forEach(a => {
    const keep = [];
    for (const w of a.wrong || []) {
      if (a.kind === 'cx') {
        if (!w.val.every(Number.isFinite)) continue;
        if (Math.hypot(w.val[0] - a.val[0], w.val[1] - a.val[1]) <= Math.max(0.06, 0.03 * Math.hypot(...a.val))) continue;
        keep.push(w); continue;
      }
      if (!Number.isFinite(w.val) || !w.why) continue;
      const thr = Math.max(Math.abs(a.val) * (a.tol ?? 0.01) * 3, a.val === 0 ? 0.015 : 0, 1e-9);
      if (Math.abs(w.val - a.val) <= thr) continue;
      if (keep.some(k => isRight({ ...a, val: k.val }, w.val) || isRight({ ...a, val: w.val }, k.val))) continue;
      keep.push(w);
    }
    a.wrong = keep;
  });
  return s;
}
function rng(seed) { let x = (seed >>> 0) || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function generate(T, level, seed) {
  const R = rng(seed); for (let i = 0; i < 3; i++) R();
  const h = { R, pick: l => l[Math.floor(R() * l.length)], int: (a, b) => a + Math.floor(R() * (b - a + 1)) };
  const tl = T.templates[level];
  for (let k = 0; k < 300; k++) {
    const t = h.pick(tl);
    try {
      const q = { level, title: 'Practice', generated: true, ...t(h) };
      const sol = solveQ(q);
      if (q.ok && !q.ok(sol)) continue;
      if (sol.answers.some(a => /^[A-H]$/.test(a.html) && Math.abs(a.val) < 1e-9)) continue;     // a zero coefficient: a pole cancels, a poor question
      if (!sol.answers.every(a => (a.kind === 'cx' ? a.val.every(Number.isFinite) : Number.isFinite(a.val) && Math.abs(a.val) < 1e4))) continue;
      if (!q.anyNum && !sol.answers.every(a => a.kind === 'cx' || nice(a.val))) continue;
      q.sol = sol; delete q.ok; return q;
    } catch (e) { /* try another */ }
  }
  throw Error('no question generated');
}

<script>
'use strict';
// Laplace transform, advanced page: F(s) with more than one s-term. Partial fractions (A&S 15.4: simple, repeated
// and complex poles, improper fractions), initial and final value theorems (15.3) and differential and
// integro-differential equations (15.6). All question values are our own.
(function () {
  const levels = [
    { id: 'warm', code: 'W', name: 'Warm-up', blurb: 'find the poles, one cover-up, complete the square' },
    { id: 'basic', code: 'B', name: 'Basics', blurb: 'split into simple poles, back to t' },
    { id: 'core', code: 'C', name: 'Core', blurb: 'repeated poles and complex poles' },
    { id: 'app', code: 'A', name: 'Applied', blurb: 'initial and final values, first-order equations' },
    { id: 'chal', code: 'X', name: 'Challenge', blurb: 'second-order equations, integrals, improper fractions' },
  ];

  const method = [
    { title: 'The road map', widget: 'roadmap', html: `<p>Every problem on this page follows the same road. Click a box to see what happens there.</p>
      <div class="note">The basic page did the last box for one table row. Here the hard part is the <b>split</b>: one big fraction becomes a sum of small fractions, each of which is a single row of the table.</div>` },
    { title: 'Poles: where the bottom is zero', html: `<p>For F(s) = N(s)/D(s), the <b>poles</b> are the values of s that make D(s) = 0 (A&amp;S 15.4). A factor (s + 3) gives a pole at s = −3.</p>
      <p><b>Maths reminder: factorising s² + bs + c.</b> Find two numbers that <b>multiply</b> to c and <b>add</b> to b.</p>
      <div class="eq">s<sup>2</sup> + 5s + 6: &nbsp; 2 × 3 = 6, 2 + 3 = 5 &nbsp; → &nbsp; (s + 2)(s + 3), poles −2 and −3</div>
      <ul><li>No constant term? Take out s: s² + 4s = s(s + 4).</li>
      <li>Stuck? The quadratic formula: s = [−b ± √(b² − 4c)] / 2.</li>
      <li>If b² − 4c is <b>negative</b> there are no real brackets: the poles are a complex pair (see "complete the square").</li></ul>` },
    { title: 'Why split the fraction?', widget: 'split', html: `<p>The table has no row for a big fraction such as ${FR('s + 5', '(s + 1)(s + 2)(s + 3)')}. But it can always be written as a sum of small fractions, one per factor of the bottom, and each small fraction <b>is</b> a row of the table.</p>
      <ul><li>simple factor (s + p): &nbsp; A/(s + p) &nbsp;⇔&nbsp; A e<sup>−pt</sup></li>
      <li>repeated factor (s + p)²: &nbsp; C/(s + p)² + D/(s + p) &nbsp;⇔&nbsp; C t e<sup>−pt</sup> + D e<sup>−pt</sup></li>
      <li>quadratic with complex poles: &nbsp; (Bs + C)/(s² + bs + c) &nbsp;⇔&nbsp; a damped cosine and sine</li></ul>
      <div class="note">The top must be <b>smaller</b> (lower power of s) than the bottom. If not, divide first.</div>` },
    { title: 'The cover-up (residue) method', widget: 'coverup', html: `<p>To find the number over one simple factor (A&amp;S Eq. 15.52, Heaviside):</p>
      <ol><li>Cover that factor on the bottom with your finger.</li><li>Put s = the value that makes it zero into everything left.</li><li>The number you get is the coefficient.</li></ol>
      <p>Why it works: multiplying both sides by (s + p) leaves the letter alone; every other fraction picks up a factor (s + p), which is 0 at s = −p. Click a factor in the example.</p>` },
    { title: 'Repeated poles', html: `<p>A squared factor (s + p)² needs <b>two</b> fractions (A&amp;S 15.4.2):</p>
      <div class="eq">${FR('…', 's(s + 1)<sup>2</sup>')} = ${FR('A', 's')} + ${FR('B', '(s + 1)<sup>2</sup>')} + ${FR('C', 's + 1')}</div>
      <ul><li>A: cover s, put s = 0.</li><li>B: cover the <b>whole</b> (s + 1)², put s = −1.</li>
      <li>C: cover-up cannot reach it. Multiply both sides by the bottom and compare the numbers in front of the <b>highest</b> power of s: only A and C give s² terms, so (s²-number on top) = A + C.</li></ul>
      <p>Back in time: B/(s + p)² ⇔ B t e<sup>−pt</sup> (the t comes from the square).</p>` },
    { title: 'Complex poles: complete the square', widget: 'square', html: `<p>When s² + bs + c will not factorise, rewrite it as (s + α)² + β² (A&amp;S 15.4.3):</p>
      <div class="eq">α = b ÷ 2, &nbsp; β<sup>2</sup> = c − α<sup>2</sup></div>
      <p>Then split the top Bs + C into B(s + α) + (C − Bα) and use two rows of the table:</p>
      <div class="eq">${FR('B(s + α)', '(s + α)<sup>2</sup> + β<sup>2</sup>')} ⇔ B e<sup>−αt</sup> cos βt, &nbsp; ${FR('Sβ', '(s + α)<sup>2</sup> + β<sup>2</sup>')} ⇔ S e<sup>−αt</sup> sin βt, &nbsp; S = (C − Bα)/β</div>
      <p>Slide b and c to see the square being completed.</p>` },
    { title: 'Maths reminder: comparing coefficients', html: `<p>Two polynomials are equal for <b>every</b> s only if the numbers in front of each power match. Example (A&amp;S Example 15.9, method 2):</p>
      <div class="eq">s<sup>2</sup> + 12 = A(s<sup>2</sup> + 5s + 6) + B(s<sup>2</sup> + 3s) + C(s<sup>2</sup> + 2s)</div>
      <ul><li>s² terms: 1 = A + B + C</li><li>s terms: 0 = 5A + 3B + 2C</li><li>constants: 12 = 6A</li></ul>
      <p>On this page cover-up finds most letters; comparing <b>one</b> power finishes the rest, so you never solve more than one small equation at a time.</p>` },
    { title: 'Improper fractions: divide first', html: `<p>If the top has the same power of s as the bottom, take the bottom out as many whole times as it goes (A&amp;S 15.4 margin note):</p>
      <div class="eq">${FR('s<sup>2</sup> + 6s + 11', 's<sup>2</sup> + 4s + 3')} = 1 + ${FR('2s + 8', 's<sup>2</sup> + 4s + 3')}</div>
      <p>The whole number becomes an impulse: k<sub>0</sub> ⇔ k<sub>0</sub> δ(t). The remainder is split as usual.</p>` },
    { title: 'Initial and final values', widget: 'ivfv', html: `<div class="eq">f(0<sup>+</sup>) = lim<sub>s→∞</sub> s F(s) &nbsp; &nbsp; f(∞) = lim<sub>s→0</sub> s F(s)</div>
      <ul><li>Always multiply by s first.</li><li>s → ∞: only the highest powers matter.</li>
      <li>s → 0: just put s = 0 (after cancelling the s on the bottom, if there is one).</li>
      <li>The final value theorem needs every pole in the <b>left half</b> of the s-plane (one single pole at 0 is allowed). Poles on the jω axis (a sine that never stops) or on the right (growth): no final value (A&amp;S 15.3).</li></ul>` },
    { title: 'Derivatives and integrals become algebra', html: `<table><tr><th>t-domain</th><th>s-domain</th></tr>
      <tr><td>y(t)</td><td>Y(s)</td></tr><tr><td>y′(t) = dy/dt</td><td>sY(s) − y(0)</td></tr>
      <tr><td>y″(t)</td><td>s²Y(s) − s y(0) − y′(0)</td></tr><tr><td>∫<sub>0</sub><sup>t</sup> y(τ) dτ</td><td>Y(s)/s</td></tr></table>
      <p>The starting values come in by themselves (A&amp;S 15.6): no constants to find at the end. After the transform, collect every Y(s) term on the left, move the rest to the right (signs change!), divide, and split.</p>` },
    { title: 'The recipe for a differential equation', widget: 'recipe', html: `<ol>
      <li><b>Transform</b> every term, putting in y(0) and y′(0).</li>
      <li><b>Collect</b> Y(s) on the left: Y(s) × (s² + bs + c) = the rest.</li>
      <li><b>Divide</b> to get Y(s) as one fraction.</li>
      <li><b>Split</b> it (cover-up, compare one power, complete the square).</li>
      <li><b>Table backwards</b>, term by term.</li>
      <li><b>Check</b>: the answer must give the given y(0), and y(∞) from putting all derivatives to zero.</li></ol>` },
  ];

  const questions = [
    // warm-up
    { level: 'warm', title: 'Factorise s² + 5s + 6', kind: 'roots', b: 5, c: 6, mistake: 'Giving the poles as +2 and +3: (s + 2) is zero at s = −2.' },
    { level: 'warm', title: 'Factorise s² + 4s', kind: 'roots', b: 4, c: 0, mistake: 'Forgetting the pole at s = 0 that the common factor s gives.' },
    { level: 'warm', title: 'Complete the square for s² + 4s + 13', kind: 'cts', b: 4, c: 13, mistake: 'Taking α = 4 instead of half of it, or forgetting to subtract α².' },
    { level: 'warm', title: 'One cover-up', kind: 'res1', facs: [{ p: 1, A: 3 }, { p: 3, A: -2 }], mistake: 'Putting s = +1 instead of s = −1 into what is left.' },
    { level: 'warm', title: 'A cover-up with s on the bottom', kind: 'res1', facs: [{ p: 0, A: 3 }, { p: 2, A: -3 }], mistake: 'Covering the s and then still dividing by 0: once covered, s is gone.' },
    // basics
    { level: 'basic', title: 'Two simple poles', kind: 'pf', facs: [{ p: 2, A: 3 }, { p: 3, A: 2 }], mistake: 'Forgetting to divide by what is left on the bottom after covering.' },
    { level: 'basic', title: 'Three poles, one at zero', kind: 'pf', facs: [{ p: 0, A: 1 }, { p: 1, A: 2 }, { p: 4, A: -1 }], mistake: 'Writing the s-term as e<sup>0t</sup> and then dropping it: A/s ⇔ A, a constant.' },
    { level: 'basic', title: 'Three simple poles', kind: 'pf', facs: [{ p: 1, A: 2 }, { p: 2, A: -3 }, { p: 3, A: 1 }], mistake: 'A sign slip in the bracket values: at s = −2, (s + 3) = 1 and (s + 1) = −1.' },
    { level: 'basic', title: 'Factorise first', kind: 'pf', facs: [{ p: 1, A: 4, sp: true }, { p: 4, A: -1, sp: true }], mistake: 'Trying cover-up before factorising s² + 5s + 4.' },
    // core
    { level: 'core', title: 'A repeated pole with s', kind: 'pf', facs: [{ p: 0, A: 1 }, { p: 1, m: 2, C: -1, D: -1 }], mistake: 'Writing only one fraction for (s + 1)²: it needs one over (s + 1)² and one over (s + 1).' },
    { level: 'core', title: 'A repeated pole', kind: 'pf', facs: [{ p: 2, A: 1 }, { p: 1, m: 2, C: 2, D: -1 }], mistake: 'Forgetting the t: B/(s + 1)² ⇔ B t e<sup>−t</sup>.' },
    { level: 'core', title: 'A complex pair on its own', kind: 'pf', quad: { b: 2, c: 5, B: 2, S: 3 }, mistake: 'Using 8 as the sine number: first take away Bα = 2, then divide by β = 2.' },
    { level: 'core', title: 'A real pole and a complex pair', kind: 'pf', facs: [{ p: 3, A: 1 }], quad: { b: 2, c: 5, B: 2, S: 1 }, mistake: 'Forgetting the A term when comparing the constants.' },
    { level: 'core', title: 'A pole at zero and a complex pair', kind: 'pf', facs: [{ p: 0, A: 1 }], quad: { b: 8, c: 20, B: -1, S: -2 }, mistake: 'Taking β² = 20 instead of 20 − 4² = 4.' },
    // applied
    { level: 'app', title: 'Start and finish without f(t)', kind: 'ivfv', facs: [{ p: 0, A: 1 }, { p: 2, A: 1 }, { p: 4, A: 4 }], mistake: 'Forgetting to multiply by s before taking the limits.' },
    { level: 'app', title: 'When the final value theorem fails', kind: 'ivfv', N: [6, 2], quad: { b: 0, c: 9 }, mistake: 'Using the final value theorem with poles on the jω axis: f(t) oscillates for ever.' },
    { level: 'app', title: 'A first-order equation with a step', kind: 'ode1', a: 2, y0: 1, inp: { type: 'step', K: 6 }, mistake: 'Writing sY(s) + y(0): the derivative rule is sY(s) − y(0).' },
    { level: 'app', title: 'A first-order equation with an exponential input', kind: 'ode1', a: 3, y0: 1, inp: { type: 'exp', K: 4, b: 1 }, mistake: 'Forgetting that y(0) also multiplies (s + 1) when the right side is made one fraction.' },
    { level: 'app', title: 'A second-order equation, no input', kind: 'ode2', b: 3, c: 2, y0: 1, y1: 0, mistake: 'Forgetting the 3y(0) that comes from 3[sY(s) − y(0)].' },
    // challenge
    { level: 'chal', title: 'A second-order equation with a step', kind: 'ode2', b: 5, c: 6, y0: 1, y1: -1, K: 12, mistake: 'Losing the 12/s: multiply the whole right side by s/s before dividing.' },
    { level: 'chal', title: 'A second-order equation with complex poles', kind: 'ode2', b: 2, c: 5, y0: 2, y1: 0, mistake: 'Taking the sine number as C/β: take away Bα first.' },
    { level: 'chal', title: 'Complex poles and a step input', kind: 'ode2', b: 2, c: 5, y0: 0, y1: 4, K: 10, mistake: 'Forgetting the steady part 10/5 = 2 that the pole at s = 0 gives.' },
    { level: 'chal', title: 'An integro-differential equation', kind: 'ide', a: 3, c: 2, y0: 1, K: 4, mistake: 'Not multiplying every term by s, so a 1/s is left in the equation.' },
    { level: 'chal', title: 'An improper fraction', kind: 'pf', k0: 1, facs: [{ p: 1, A: 3 }, { p: 3, A: -1 }], mistake: 'Splitting straight away: the top is as big as the bottom, so divide first.' },
  ];

  // ------------------------------------------------------------ practice templates (h = { R, pick, int })
  const nz = h => h.pick([-4, -3, -2, -1, 1, 2, 3, 4, 5]);
  const poles = (h, n, zero) => { const ps = new Set(); if (zero) ps.add(0); while (ps.size < n) ps.add(h.int(1, 6)); return [...ps]; };
  const cx = h => { const al = h.int(1, 4), be = h.int(1, 4); return { b: 2 * al, c: al * al + be * be }; };
  const templates = {
    warm: [
      h => { const [p1, p2] = poles(h, 2, h.R() < 0.25); return { kind: 'roots', b: p1 + p2, c: p1 * p2 }; },
      h => ({ kind: 'cts', ...cx(h) }),
      h => ({ kind: 'res1', facs: poles(h, 2, h.R() < 0.3).map(p => ({ p, A: nz(h) })), ask: h.int(0, 1) }),
    ],
    basic: [
      h => ({ kind: 'pf', facs: poles(h, 2, false).map(p => ({ p, A: nz(h) })) }),
      h => ({ kind: 'pf', facs: poles(h, 3, h.R() < 0.5).map(p => ({ p, A: nz(h) })) }),
      h => ({ kind: 'pf', facs: poles(h, 2, false).map(p => ({ p, A: nz(h), sp: true })) }),
    ],
    core: [
      h => { const [q, p] = poles(h, 2, h.R() < 0.5); return { kind: 'pf', facs: [{ p: q, A: nz(h) }, { p, m: 2, C: nz(h), D: nz(h) }] }; },
      h => ({ kind: 'pf', quad: { ...cx(h), B: nz(h), S: nz(h) } }),
      h => ({ kind: 'pf', facs: [{ p: poles(h, 1, h.R() < 0.4)[0], A: nz(h) }], quad: { ...cx(h), B: nz(h), S: nz(h) } }),
    ],
    app: [
      h => ({ kind: 'ivfv', facs: poles(h, h.int(2, 3), true).map(p => ({ p, A: nz(h) })) }),
      h => ({ kind: 'ode1', a: h.int(1, 5), y0: h.pick([-2, -1, 1, 2, 3]), inp: { type: 'step', K: h.pick([2, 4, 6, 8, 10, 12]) } }),
      h => { const [a, b] = poles(h, 2, false); return { kind: 'ode1', a, y0: h.pick([-1, 1, 2]), inp: { type: 'exp', K: h.pick([2, 3, 4, 6]), b } }; },
      h => { const [p1, p2] = poles(h, 2, false); return { kind: 'ode2', b: p1 + p2, c: p1 * p2, y0: h.pick([-1, 1, 2]), y1: h.pick([-2, -1, 0, 1, 2]) }; },
    ],
    chal: [
      h => { const [p1, p2] = poles(h, 2, false); return { kind: 'ode2', b: p1 + p2, c: p1 * p2, y0: h.pick([0, 1, 2]), y1: h.pick([-2, -1, 0, 1, 2]), K: p1 * p2 * h.pick([1, 2, 3]) }; },
      h => { const q = cx(h); return { kind: 'ode2', ...q, y0: h.pick([0, 1, 2]), y1: h.pick([-2, -1, 0, 1, 2, 3, 4]), K: h.R() < 0.5 ? 0 : q.c * h.pick([1, 2]) }; },
      h => { const [p1, p2] = poles(h, 2, false); return { kind: 'ide', a: p1 + p2, c: p1 * p2, y0: h.pick([-1, 1, 2]), K: h.pick([2, 3, 4, 6, 8]) }; },
      h => ({ kind: 'pf', k0: h.pick([1, 2, 3]), facs: poles(h, 2, false).map(p => ({ p, A: nz(h) })) }),
    ],
  };
  window.TOPIC = { title: 'Laplace Transform: Partial Fractions and Equations', levels, method, questions, templates, widgets: 'adv' };
})();

</script>
<script>
'use strict';
// Shared by the self-study pages (transients, AC nodal and mesh, Laplace): reading typed answers, checking
// them with hints for known mistakes, the step badges and icons, and the help modes (Watch / Guided / On my own) in
// which the student works out one number at a time.  A page gives each question a list of "stages":
//   { html, unit, kind: 'real' | 'cx' | 'deg', val (number, or [re, im] for 'cx'), step (index), wrong: [{ val, why }] }
// and a reveal(n) that shows the first n steps.  Loaded before the page's shell.js, which defines $ and $$.

// ---------------------------------------------------------------- reading a typed answer
// real: 0.33, 330 ms, 330m, 1.5k, 2.4 kΩ, -24, 63.4°     complex: 4+j8, 4 + 8j, -j2, 8.94∠63.4, 8.94<63.4, 8.94@63.4
const PFX = { G: 1e9, M: 1e6, k: 1e3, K: 1e3, m: 1e-3, u: 1e-6, 'µ': 1e-6, 'μ': 1e-6, n: 1e-9 };
const UNITS = ['ohm', 'ohms', 'Ω', 'V', 'A', 's', 'F', 'H', 'J', 'W', 'VA', 'VAR', 'deg', 'rad/s'];
function parseNum(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/,/g, '').replace(/\s+/g, '').replace(/°$/, '');
  const fr = /^([+-]?(?:\d+\.?\d*|\.\d+))\/((?:\d+\.?\d*|\.\d+))$/.exec(s);      // a fraction: 2/3, -7/4
  if (fr) return +fr[2] ? Number(fr[1]) / Number(fr[2]) : null;
  const m = /^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)(.*)$/.exec(s);
  if (!m) return null;
  const v = Number(m[1]), rest = m[2];
  if (!rest || UNITS.includes(rest)) return v;
  if (PFX[rest[0]] !== undefined && (rest.length === 1 || UNITS.includes(rest.slice(1)))) return v * PFX[rest[0]];
  return null;
}
function parseCx(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/\s+/g, '').replace(/°/g, '').replace(/(VA|VAR|[VAWΩ])$/i, '').replace(/i/g, 'j');
  if (!s) return null;
  const pm = /^(-?\d*\.?\d+)(?:∠|<|@|ang)(-?\d*\.?\d+)$/.exec(s);
  if (pm) { const m = +pm[1], a = +pm[2] * Math.PI / 180; return [m * Math.cos(a), m * Math.sin(a)]; }
  const toks = s.match(/[+-]?[^+-]+/g); if (!toks) return null;
  let re = 0, im = 0;
  for (const t of toks) {
    if (t.includes('j')) { const n = t.replace('j', ''); const v = n === '' || n === '+' ? 1 : n === '-' ? -1 : Number(n); if (!Number.isFinite(v)) return null; im += v; }
    else { const v = Number(t); if (!Number.isFinite(v)) return null; re += v; }
  }
  return [re, im];
}
const readIn = (st, s) => (st.kind === 'cx' ? parseCx(s) : parseNum(s));
const angDiff = (a, b) => Math.abs((((a - b) % 360) + 540) % 360 - 180);

// ---------------------------------------------------------------- checking it
function isRight(st, v) {
  if (v === null || v === undefined) return false;
  if (st.kind === 'cx') { const [a, b] = st.val; return Math.hypot(v[0] - a, v[1] - b) <= Math.max(0.02, Math.hypot(a, b) * 0.01); }
  if (st.kind === 'deg') return angDiff(v, st.val) <= 0.5;
  return Math.abs(v - st.val) <= Math.max(1e-12, Math.abs(st.val) * (st.tol ?? 0.01), st.val === 0 ? 0.005 : 0);   // tol: relative, default 1 %
}
// a page may replace the generic real-number slip hints: SLIP_TEXT = { pow10: text | false, sign: text }
const slipText = (k, d) => (typeof SLIP_TEXT !== 'undefined' && SLIP_TEXT[k] !== undefined ? SLIP_TEXT[k] : d);
// the hint for a wrong answer: a known mistake first, then the slips that can happen in any question
function diagnose(st, v, all) {
  const as = val => isRight({ ...st, val }, v);
  for (const w of st.wrong || []) if (as(w.val)) return w.why;
  const nearRight = val => isRight(st, val);      // a "slip" value that is really the right answer is never reported
  const slip = (val, why) => (!nearRight(val) && as(val) ? why : null);
  let h = null;
  if (st.kind === 'cx') {
    const [a, b] = st.val, m = Math.hypot(a, b);
    if (m > 0) h = slip([a, -b], 'Right size, but the j part has the wrong sign. Check 1/j = −j, and the sign of each reactance (+j for L, −j for C).')
      || slip([-a, -b], 'Right size, wrong sign: check the direction (tail minus head), or which end of the source is +.')
      || slip([b, a], 'The real part and the j part are swapped.')
      || slip([-b, a], 'Off by a factor of j: check where the j goes when you multiply or divide.')
      || slip([b, -a], 'Off by a factor of −j: remember 1/j = −j.')
      || (Math.abs(v[1]) < 1e-9 && Math.abs(b) > 1e-9 && Math.abs(v[0] - m) <= Math.max(0.02, m * 0.01) ? 'That is only the magnitude. Give the whole phasor: a + jb, or A∠θ.' : null);
  } else if (st.kind === 'deg') {
    const t = st.val;
    h = slip(t + 180, 'Off by 180°: check which quadrant the phasor is in. When the real part is negative, add or subtract 180° from what tan⁻¹ gives.')
      || (Math.abs(v - t * Math.PI / 180) < 0.01 && Math.abs(t) > 1 ? 'That is the angle in radians. Set your calculator to degrees (DEG).' : null)
      || slip(90 - t, 'That is tan⁻¹(a ÷ b). The angle is tan⁻¹(b ÷ a): the j part goes on top.')
      || slip(-t, 'Right size, wrong sign: a phasor below the real axis has a negative angle.');
  } else if (st.val !== 0) {
    const p10 = slipText('pow10', 'Right digits, wrong power of ten. Check the prefixes: k = 10³, m = 10⁻³, µ = 10⁻⁶ (kΩ × µF = ms). You can type the prefix too: 330 ms, 2.4k.');
    if (p10) for (const f of [1e3, 1e6, 1e9, 1e-3, 1e-6, 1e-9]) if (!h) h = slip(st.val * f, p10);
    h = h || slip(-st.val, slipText('sign', 'Right size, wrong sign. Check the bracket [x(0<sup>+</sup>) − x(∞)], or which way the current flows.'));
  }
  if (h) return h;
  for (const o of all) if (o !== st && o.kind === st.kind && as(o.val) && !nearRight(o.val)) return `That is the value of ${o.html}. Which number does this box ask for?`;
  return null;
}

// ---------------------------------------------------------------- step badges and icons
// every step title of the three pages falls under one of these (test.js checks that none is left over)
const STEP_TYPES = [
  ['check', /^check|rising or falling|power balance/i],
  ['setup', /^before the switch|just after|long after|after the second switching|redraw|reference node|draw the mesh|already known|spot the|phasor domain|rectangular form|how many time constants/i],
  ['equation', /^kcl|^kvl|use the (voltage|current) source|controlling quantity|write the (response|second response|decay|charging)|put in the known/i],
  ['algebra', /tidy|solve|back-substitute|rearrange|read the ruler|when does|make it reach/i],
  ['answer', /value|time constant|current|voltage|polar form|energy|largest|choose|find|settl|charging time|how long|at t =/i],
];
const STEP_NAME = { setup: 'set-up', equation: 'equation', algebra: 'algebra', answer: 'answer', check: 'check' };
function stepType(title) { const t = String(title).replace(/<[^>]+>/g, ''); const m = STEP_TYPES.find(([, r]) => r.test(t)); return m ? m[0] : null; }
const STEP_KINDS = Object.keys(STEP_NAME);
const typeOf = s => (STEP_KINDS.includes(s.type) ? s.type : stepType(s.title));      // an explicit type wins
const ICON = {
  setup: '<path d="M0 8h3l1.5-4 3 8 3-8 1.5 4H16"/>',
  equation: '<path d="M3 5.5h10M3 10.5h10"/>',
  algebra: '<path d="M3 13l1-4 7-7 3 3-7 7zM9.5 3.5l3 3"/>',
  answer: '<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.2"/>',
  check: '<path d="M2.5 8.5l3.5 3.5 7.5-8"/>',
};
const iconSVG = ty => `<svg class="sico" viewBox="0 0 16 16" aria-hidden="true">${ICON[ty]}</svg>`;
function stepHTML(s, deCls = 'de') {
  const lines = (s.lines || []).map(l => `<div class="line">${l.how ? `<div class="how">${l.how}</div>` : ''}${l.eq ? `<div class="eq">${l.eq}</div>` : ''}</div>`).join('');
  const cap = h => h.replace(/^((?:<[^>]+>)*)([a-z])/, (m, t, c) => t + c.toUpperCase());
  const ty = typeOf(s) || 'answer';
  return `<h3>${iconSVG(ty)}<span class="sty">${STEP_NAME[ty]}</span> ${s.title}</h3>${s.say ? `<p>${cap(s.say)}</p>` : ''}${lines}${s.note ? `<div class="note">${s.note}</div>` : ''}` +
    (s.details ? `<details><summary>${s.details.title}</summary><div class="${deCls}">${s.details.html}</div></details>` : '');
}
function stepsHTML(steps, deCls) {
  return `<ol class="steps${stg && mode === 'own' ? ' own' : ''}">${steps.map(s => `<li hidden class="t-${typeOf(s) || 'answer'}">${stepHTML(s, deCls)}</li>`).join('')}</ol>`;
}

// ---------------------------------------------------------------- help modes
const MODES = [{ id: 'watch', name: 'Watch', tip: 'See every step worked out for you.' },
  { id: 'guided', name: 'Guided', tip: 'Each step tells you what to do; you work out the number.' },
  { id: 'own', name: 'On my own', tip: 'Only the step titles: you do all the working.' }];
let mode = 'guided', stg = null;
try { const m = localStorage.getItem('eeeMode'); if (MODES.some(x => x.id === m)) mode = m; } catch (e) { /* storage blocked */ }
const modeBarHTML = () => `<div class="modes"><span class="muted">How much help?</span>${MODES.map(m => `<button data-m="${m.id}" title="${m.tip}"${m.id === mode ? ' class="on"' : ''}>${m.name}</button>`).join('')}
  <span class="muted">${MODES.find(m => m.id === mode).tip}</span></div>`;
function bindModeBar(box, rerender) {
  $$('.modes button', box).forEach(b => { b.onclick = () => {

  } else if (name === 'square') {
    host.innerHTML = `<div class="sliders"><label>b (s-number)<input type="range" id="qb" min="0" max="10" step="2" value="4"><b id="qbv"></b></label>
      <label>c (constant)<input type="range" id="qc" min="1" max="40" step="1" value="13"><b id="qcv"></b></label></div><div class="eq big" id="qform"></div><div class="two" id="qpics"></div>`;
    const draw = () => {
      const b = +$('#qb', host).value, c = +$('#qc', host).value, al = b / 2, r = c - al * al;
      $('#qbv', host).textContent = b; $('#qcv', host).textContent = c;
      $('#qform', host).innerHTML = `${quadH({ b, c })} = ${linP(al)}<sup>2</sup> ${r < 0 ? MI : '+'} ${N(Math.abs(r))} &nbsp; ${r > 0 ? `= ${linP(al)}<sup>2</sup> + ${sf(Math.sqrt(r), 3)}<sup>2</sup>: complex poles ${MI}${N(al)} ± j${sf(Math.sqrt(r), 3)}` : r === 0 ? `: a double pole at ${N(-al)}` : ': β² is negative, so it factorises into real brackets'}`;
      const S = 120, u = Math.min(14, 120 / Math.max(al, 1)), a = al * u, X0 = 20, Y0 = 20;
      const area = `<svg class="sqpic" viewBox="0 0 ${S + a + 300} ${S + a + 50}" role="img" aria-label="completing the square as areas">
        <rect class="sq0" x="${X0}" y="${Y0}" width="${S}" height="${S}"/><text x="${X0 + S / 2}" y="${Y0 + S / 2}" text-anchor="middle">s²</text>
        ${a ? `<rect class="sq1" x="${X0 + S}" y="${Y0}" width="${a}" height="${S}"/><rect class="sq1" x="${X0}" y="${Y0 + S}" width="${S}" height="${a}"/><rect class="sq2" x="${X0 + S}" y="${Y0 + S}" width="${a}" height="${a}"/>
        <text x="${X0 + S + a / 2}" y="${Y0 + S / 2}" text-anchor="middle" class="sm">αs</text><text x="${X0 + S / 2}" y="${Y0 + S + a / 2 + 5}" text-anchor="middle" class="sm">αs</text>` : ''}
        <text x="${X0 + S + a + 14}" y="${Y0 + 24}">bs = 2αs: two strips of ${N(al)}s</text><text x="${X0 + S + a + 14}" y="${Y0 + 50}">corner α² = ${N(al * al)} is borrowed</text>
        <text x="${X0 + S + a + 14}" y="${Y0 + 76}">from c = ${N(c)}: left over ${N(r)}</text><text x="${X0}" y="${S + a + 44}">(s + α)² is the whole square</text></svg>`;
      $('#qpics', host).innerHTML = area + pzSVG({ poles: r > 0 ? [{ re: -al, im: Math.sqrt(r), m: 1, cls: 'cx' }, { re: -al, im: -Math.sqrt(r), m: 1, cls: 'cx' }] : r === 0 ? [{ re: -al, im: 0, m: 2 }] : [{ re: -al + Math.sqrt(-r), im: 0, m: 1 }, { re: -al - Math.sqrt(-r), im: 0, m: 1 }] });
    };
    $$('input', host).forEach(x => { x.oninput = draw; }); draw();
  } else if (name === 'ivfv') {
    const EX = [['settles', { facs: [{ p: 0, A: 1 }, { p: 2, A: 1 }, { p: 4, A: 4 }] }], ['dies away', { facs: [{ p: 1, A: 3 }, { p: 3, A: -1 }] }], ['oscillates', { N: [6, 2], quad: { b: 0, c: 9 } }]];
    let i = 0;
    const draw = () => {
      const R = ratSpec(EX[i][1]), so = pfSolve(R), D = denom(R.facs, R.quad), v0 = ivtVal(R.N, D);
      const zero = R.facs.find(f => Math.abs(f.p) < 1e-12), osc = R.quad && R.quad.b === 0;
      const vinf = osc ? NaN : zero ? pev(R.N, 0) / pev(denom(R.facs.filter(f => f !== zero), R.quad), 0) : 0;
      host.innerHTML = `<div class="wbar">${EX.map((e, k) => `<button data-k="${k}"${k === i ? ' class="on"' : ''}>${e[0]}</button>`).join('')}</div>
        <div class="eq big">F(s) = ${ratH(R)} &nbsp; → &nbsp; f(0<sup>+</sup>) = ${N(v0)}, &nbsp; f(∞) = ${osc ? 'none (poles on the jω axis)' : N(vinf)}</div>
        ${plotSVG({ terms: so.terms, T: osc ? 6 : 4, name: 'f', marks: { f0: v0, finf: vinf } })}`;
      $$('.wbar button', host).forEach(b => { b.onclick = () => { i = +b.dataset.k; draw(); }; });
    };
    draw();
  }
}

// ---------------------------------------------------------------- views
const newSeed = () => Math.floor(Math.random() * 90000) + 10000;
function setView(v) {
  view = v;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const M = $('main');
  if (v === 'method') {
    M.innerHTML = `<div class="mgrid">${TOPIC.method.map((s, i) => `<div class="card"><h2>${s.title}</h2>${s.widget ? `<div class="wg" data-i="${i}"></div>` : ''}${s.html}</div>`).join('')}</div>`;
    $$('.wg').forEach(d => widget(TOPIC.method[+d.dataset.i].widget, d));
  } else if (v === 'questions') {
    M.innerHTML = `<div class="card levels">${TOPIC.levels.map((l, li) => `<div class="level" data-lv="${li}"><div class="lname"><span class="lnum">${li + 1}</span><span>${l.name}<small>${l.blurb}</small></span></div>${TOPIC.questions.map((q, i) => [q, i]).filter(([q]) => q.level === l.id).map(([q, i]) => `<button class="qbtn" data-i="${i}">Q${i + 1} · ${q.title}</button>`).join('')}</div>`).join('')}
      <p class="muted">Every question is open: start anywhere. They get harder from top to bottom. Each one has a "Practise more like this" button for fresh questions at the same level.</p></div><div id="qbox"></div>`;
    $$('.qbtn').forEach(b => { b.onclick = () => openQ(+b.dataset.i); });
    const i = cur && TOPIC.questions.indexOf(cur.q) >= 0 ? TOPIC.questions.indexOf(cur.q) : 0;
    openQ(i, true);
  } else {
    M.innerHTML = `<div class="card gen"><b>Difficulty:</b> ${TOPIC.levels.map((l, li) => `<button class="lvb" data-lv="${li}" data-l="${l.id}" title="${l.blurb}">${l.name}</button>`).join('')}
      <button class="primary" id="go">Generate question</button>
      <span class="code" id="code"></span>
      <span style="margin-left:auto"></span><input id="cin" placeholder="question code" aria-label="question code"><button id="cgo">Load</button></div>
      <p class="muted">Each question is new: the numbers are picked so that every answer comes out as a whole number or a simple fraction. The solution is worked out step by step, the same way as in the question bank. Share the code to give a classmate the same question.</p><div id="qbox"></div>`;
    const mark = () => $$('.lvb').forEach(b => b.classList.toggle('on', b.dataset.l === genLevel));
    $$('.lvb').forEach(b => { b.onclick = () => { genLevel = b.dataset.l; mark(); }; });
    mark();
    $('#go').onclick = () => gen(genLevel, newSeed());
    $('#cgo').onclick = () => {
      const m = /^\s*([A-Za-z])-(\d+)\s*$/.exec($('#cin').value), lv = m && TOPIC.levels.find(l => l.code.toLowerCase() === m[1].toLowerCase());
      if (lv) { genLevel = lv.id; mark(); gen(lv.id, +m[2]); } else $('#code').textContent = 'Code not recognised (example: C-12345)';
    };
    if (!cur || !cur.q.generated) gen(genLevel, newSeed(), true);
    else renderQ($('#qbox'), cur.q, `Practice question (${TOPIC.levels.find(l => l.id === cur.q.level).name})`);
  }
}
function openQ(i, quiet) {
  const q = TOPIC.questions[i];
  $$('.qbtn').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  renderQ($('#qbox'), q, `Question ${i + 1}: ${q.title}`);
  if (!quiet) $('#qbox').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function gen(level, seed, quiet) {
  const lv = TOPIC.levels.find(l => l.id === level);
  let q;
  try { q = generate(TOPIC, level, seed); } catch (e) { $('#qbox').innerHTML = '<p class="bad">Could not make a question this time. Click Generate again.</p>'; return; }
  genLevel = level; $$('.lvb').forEach(b => b.classList.toggle('on', b.dataset.l === level));
  $('#code').textContent = `Code: ${lv.code}-${seed}`;
  renderQ($('#qbox'), q, `Practice question (${lv.name})`);
  if (!quiet) $('#qbox').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !$('#nx')) return;
  if (e.key === 'ArrowRight') reveal(shown + 1); if (e.key === 'ArrowLeft') reveal(shown - 1);
});
$$('nav.tabs button').forEach(b => { b.onclick = () => setView(b.dataset.v); });
setView('questions');

</script>
<script>
document.getElementById('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', r.dataset.theme); } catch (e) { }
};
</script>
</body>
