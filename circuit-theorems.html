<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Theorems</title>
<meta name="description" content="Circuit Theorems, step by step: superposition, source transformation, Thevenin and Norton.">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16242e;--muted:#5b6b76;--line:#d5dbe1;--hl:#ffe08a;--ok:#2e7d32;--bad:#c62828;--note:#eef4fb;--warn:#fff4e5;
  --k0:#7d8a94;--k1:#d9480f;--k2:#1565c0;--k3:#2b8a3e;--k4:#8d6e00;--kx:#ae3ec9;--sup:#c2255c;--acc:#1f7a8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b232b;--ink:#e8eef2;--muted:#9fb0bb;--line:#35424d;--hl:#6b5a14;--ok:#7ee787;--bad:#ff7b72;--note:#222e3a;--warn:#3a2f1c;
  --k0:#8c99a3;--k1:#ff9e5e;--k2:#6cb6ff;--k3:#69db7c;--k4:#e3c04d;--kx:#e599f7;--sup:#f783ac;--acc:#5fd3c0}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b232b;--ink:#e8eef2;--muted:#9fb0bb;--line:#35424d;--hl:#6b5a14;--ok:#7ee787;--bad:#ff7b72;--note:#222e3a;--warn:#3a2f1c;
  --k0:#8c99a3;--k1:#ff9e5e;--k2:#6cb6ff;--k3:#69db7c;--k4:#e3c04d;--kx:#e599f7;--sup:#f783ac;--acc:#5fd3c0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:1.25rem;margin:0}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
nav.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
nav.tabs button{border:0;border-radius:0}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.on,button.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{max-width:1500px;margin:auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
h2{font-size:1.2rem;margin:.1em 0 .4em}
h3{font-size:1.02rem;margin:0 0 .25em}
p{margin:.45em 0}
.muted{color:var(--muted);font-size:.92rem}
.note{background:var(--note);border-radius:9px;padding:9px 13px;margin:.7em 0;font-size:.95rem}
.warn{background:var(--warn);border-radius:9px;padding:9px 13px;margin:.7em 0;font-size:.95rem}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
/* level strip */
.levels{display:grid;gap:10px;margin-bottom:16px}
.level{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.level .lname{font-weight:600;min-width:11em}
.level .lname small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.qbtn{font-size:.92rem;padding:4px 11px}
/* question layout */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:1000px){.qgrid{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
@media (max-width:1000px){header{position:static}.sticky{top:0;z-index:3}.sticky .card{padding:6px 8px;box-shadow:0 4px 10px rgba(0,0,0,.12)}.sticky .hint{display:none}svg.ckt{max-height:36vh}}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--note);color:var(--acc);letter-spacing:.02em;text-transform:uppercase}
.qtext{margin:.6em 0 .8em}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.8em 0}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:st}
ol.steps>li{border-left:3px solid var(--line);padding:6px 0 8px 14px;margin:0 0 10px;counter-increment:st}
ol.steps>li h3::before{content:"Step " counter(st) " · ";color:var(--muted);font-weight:600}
ol.steps>li.new{border-left-color:var(--acc)}
.line{margin:.45em 0}
.how{font-size:.86rem;color:var(--muted)}
.eq{font-size:1.07rem;padding:3px 10px;border-left:3px solid var(--line);margin-top:2px;font-variant-numeric:tabular-nums;overflow-x:auto}
.eq:empty{display:none}
details{margin:.6em 0}summary{cursor:pointer;color:var(--muted)}
.answer{border:2px solid var(--acc);border-radius:10px;padding:8px 14px;margin:12px 0}
.try{background:var(--note);border-radius:9px;padding:8px 13px}
.try label{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0}
.try input{width:7.5em;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
/* terms and variables */
.term{border-radius:4px;padding:0 2px;transition:background .12s;cursor:default}
.term.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.var{font-weight:600;font-style:italic;border-radius:4px}
.var.hl{background:var(--hl)}
.k0{color:var(--k0)}.k1{color:var(--k1)}.k2{color:var(--k2)}.k3{color:var(--k3)}.k4{color:var(--k4)}.kx{color:var(--kx)}
/* circuit */
svg.ckt{display:block;width:100%;height:auto;max-height:70vh;touch-action:manipulation}
svg.ckt text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:var(--ink)}
.wire{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.src{fill:var(--card)}
.arrowhead{fill:var(--ink)}
.sign{stroke:var(--ink);stroke-width:2.5;fill:none}
.dot{fill:var(--ink)}
.ul{stroke-width:14;stroke-linecap:round;opacity:0;transition:opacity .15s}
svg.colour .ul{opacity:.35}
svg.colour .ul.hl{opacity:.8}
.ul.k0{stroke:var(--k0)}.ul.k1{stroke:var(--k1)}.ul.k2{stroke:var(--k2)}.ul.k3{stroke:var(--k3)}.ul.k4{stroke:var(--k4)}
.lab{font-size:23px}
.lab.nm{font-weight:600}
.lab.val{fill:var(--muted)}
svg.ckt text.lab.dep{fill:var(--kx);font-weight:600}
svg.ckt text.lab.muted{fill:var(--muted);font-size:19px}
svg.ckt text.lab.nl{font-weight:700;font-size:25px}
svg.ckt text.k1{fill:var(--k1)}svg.ckt text.k2{fill:var(--k2)}svg.ckt text.k3{fill:var(--k3)}svg.ckt text.k4{fill:var(--k4)}
.ndot.k1{fill:var(--k1)}.ndot.k2{fill:var(--k2)}.ndot.k3{fill:var(--k3)}.ndot.k4{fill:var(--k4)}
.nlab.hl .ndot{r:11}
.halo{fill:var(--hl);opacity:0;transition:opacity .12s}
g.el{cursor:pointer}
g.el.hl .halo{opacity:1}
.ctrl .cline{stroke:var(--kx);stroke-width:2.5}
.ctrl .chead{fill:var(--kx)}
.ctrl .csign{stroke:var(--kx);stroke-width:2.5;fill:none}
svg.ckt text.lab.cx{fill:var(--kx);font-weight:700}
.ctrl.hl .cline,.ctrl.hl .csign{stroke-width:5}
.loop .lp{fill:none;stroke-width:2.5;stroke-dasharray:3 6;stroke-linecap:round}
.loop.k1 .lp{stroke:var(--k1)}.loop.k2 .lp{stroke:var(--k2)}.loop.k3 .lp{stroke:var(--k3)}
.loop.k1 .lph{fill:var(--k1)}.loop.k2 .lph{fill:var(--k2)}.loop.k3 .lph{fill:var(--k3)}
svg.ckt .loop.k1 text{fill:var(--k1)}svg.ckt .loop.k2 text{fill:var(--k2)}svg.ckt .loop.k3 text{fill:var(--k3)}
.lab.ml{font-size:30px;font-weight:700;font-style:italic}
.loop.hl .lp{stroke-width:5;stroke-dasharray:none}
.loop{cursor:pointer}
.bubble{fill:var(--sup);fill-opacity:.06;stroke:var(--sup);stroke-width:2.5;stroke-dasharray:8 6;display:none}
svg.ckt text.lab.sup{fill:var(--sup);font-weight:600;display:none}
svg.over .bubble,svg.over text.lab.sup{display:inline}
/* method page */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.mgrid .card ol,.mgrid .card ul{padding-left:1.3em;margin:.4em 0}
.recipe{counter-reset:r}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.6em 0}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--note)}
.gen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.gen .code{font-family:Consolas,monospace;font-size:.9rem;color:var(--muted)}
.gen input{width:9em;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.hint{font-size:.88rem;color:var(--muted);margin:.4em 0 0}
@media (max-width:600px){body{font-size:16px}main{padding:12px 12px 50px}header{padding:10px 12px}.card{padding:12px}.level .lname{min-width:100%}}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:18px 16px 28px;border-top:1px solid var(--line)}
.fdot{pointer-events:none}
.fdot.acc{fill:var(--acc)}.fdot.k1{fill:var(--k1)}.fdot.k2{fill:var(--k2)}.fdot.k3{fill:var(--k3)}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.flowbar button{font-size:.88rem;padding:3px 10px}
@media (prefers-reduced-motion:reduce){.flow{display:none}}
/* circuit theorems: switched-off sources, terminals, look-in arrow, redrawn circuits inside the steps */
.ghost{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5;opacity:.7}
svg.ckt text.lab.gh{fill:var(--muted);font-style:italic}
.tpt{fill:var(--card);stroke:var(--ink);stroke-width:3}
svg.ckt text.lab.tl{font-weight:700;font-style:italic;font-size:26px}
.look line{stroke:var(--k2);stroke-width:3}.look path{fill:var(--k2)}
svg.ckt text.lab.lk{fill:var(--k2);font-weight:700}
g.el.eqv .wire{stroke:var(--acc)}g.el.eqv .arrowhead{fill:var(--acc)}g.el.eqv .sign{stroke:var(--acc)}
svg.ckt g.el.eqv text.lab.nm{fill:var(--acc)}
.fig{margin:.5em 0;max-width:620px}
.fig svg.ckt{max-height:300px}
.fig svg.ckt+svg.ckt{margin-top:6px}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.card.gbar{margin-bottom:14px}
.gen{gap:10px}
.grp{display:grid;gap:10px;padding-top:6px}
.grp+.grp{border-top:1px solid var(--line);padding-top:12px}
.grp h2{margin:0}
svg.ckt text.lab.gh{font-size:19px}

/* ================================================================ from the Interactive Study Pages handover
/* help modes and one-number-at-a-time checking */
.modes{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:.6em 0 .8em}
.modes button{font-size:.9rem;padding:3px 12px}
ol.steps>li.pend{border-left-style:dashed;border-left-color:var(--acc)}
ol.steps>li.pend h3::after{content:" · your turn";color:var(--acc);font-size:.85rem}
ol.steps>li.pend .eq,ol.steps>li.pend .note,ol.steps>li.pend details{display:none}
ol.steps.own>li.pend>:not(h3){display:none}
ol.steps>li.won h3::after{content:" ✓";color:var(--ok)}
ol.steps>li.helped h3::after{content:" · with help";color:var(--muted);font-weight:400;font-size:.85rem}
.stage{background:var(--note);border:2px solid var(--acc);border-radius:10px;padding:10px 14px;margin:12px 0}
.stage .sq{font-weight:600;margin-bottom:6px}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srow label{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.srow input{width:8em;font:inherit;padding:4px 8px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.stage .warn{margin:.6em 0 .3em}
.stage ul{margin:.4em 0;padding-left:1.3em}

/* ---------------------------------------------------------------- colour theme */
:root{--on-acc:#fff;--hdr1:#1f7a8c;--hdr2:#5b3cc4;--warnline:#f08c00;
  --lv0:#2f9e44;--lv1:#0c8599;--lv2:#1971c2;--lv3:#7048e8;--lv4:#e03131;
  --t-setup:#1971c2;--t-equation:#e8590c;--t-algebra:#7048e8;--t-answer:#2f9e44;--t-check:#0c8599}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-acc:#10202a;--hdr1:#145866;--hdr2:#3d2a8a;--warnline:#ffa94d;
  --lv0:#69db7c;--lv1:#3bc9db;--lv2:#74c0fc;--lv3:#b197fc;--lv4:#ff8787;
  --t-setup:#74c0fc;--t-equation:#ffa94d;--t-algebra:#b197fc;--t-answer:#69db7c;--t-check:#3bc9db}}
:root[data-theme="dark"]{--on-acc:#10202a;--hdr1:#145866;--hdr2:#3d2a8a;--warnline:#ffa94d;
  --lv0:#69db7c;--lv1:#3bc9db;--lv2:#74c0fc;--lv3:#b197fc;--lv4:#ff8787;
  --t-setup:#74c0fc;--t-equation:#ffa94d;--t-algebra:#b197fc;--t-answer:#69db7c;--t-check:#3bc9db}
/* header band with the page icon; tabs as pills */
header{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));border-bottom:0;color:#fff}
header h1{display:flex;align-items:center;gap:12px}
header h1 small{color:rgba(255,255,255,.82)}
.picon{flex:none;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.picon svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{border:0;gap:6px;background:rgba(255,255,255,.14);padding:4px;border-radius:24px}
nav.tabs button{background:transparent;color:#fff;border-radius:20px;border:0}
nav.tabs button:hover{background:rgba(255,255,255,.18)}
nav.tabs button.on{background:#fff;color:var(--hdr1)}
button.on,button.primary{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
/* difficulty levels: one colour each (data-lv = 0 … 4) */
[data-lv="0"]{--lv:var(--lv0)}[data-lv="1"]{--lv:var(--lv1)}[data-lv="2"]{--lv:var(--lv2)}[data-lv="3"]{--lv:var(--lv3)}[data-lv="4"]{--lv:var(--lv4)}
.level .lname{color:var(--lv);padding-left:10px;border-left:4px solid var(--lv)}
.qbtn,.lvb{border-left:4px solid var(--lv,var(--line))}
.qbtn:hover,.lvb:hover{background:color-mix(in srgb,var(--lv,var(--acc)) 10%,var(--card))}
.qbtn.on,.lvb.on{background:var(--lv);border-color:var(--lv);color:var(--on-acc)}
.chip{background:color-mix(in srgb,var(--lv,var(--acc)) 15%,var(--card));color:var(--lv,var(--acc))}
/* steps: a numbered badge and an icon coloured by the kind of step */
ol.steps>li.t-setup{--tc:var(--t-setup)}ol.steps>li.t-equation{--tc:var(--t-equation)}ol.steps>li.t-algebra{--tc:var(--t-algebra)}
ol.steps>li.t-answer{--tc:var(--t-answer)}ol.steps>li.t-check{--tc:var(--t-check)}
ol.steps>li{border-left:4px solid color-mix(in srgb,var(--tc,var(--line)) 40%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--tc,var(--line)) 7%,transparent),transparent 60%);border-radius:0 8px 8px 0;padding-right:8px}
ol.steps>li.new{border-left-color:var(--tc,var(--acc))}
ol.steps>li h3{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
ol.steps>li h3::before{content:counter(st);display:inline-grid;place-items:center;min-width:1.65em;height:1.65em;border-radius:50%;background:var(--tc,var(--muted));color:var(--on-acc);font-size:.85rem;font-weight:700}
.sico{width:17px;height:17px;fill:none;stroke:var(--tc,var(--muted));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sty{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tc,var(--muted))}
ol.steps>li.pend{border-left-style:dashed;border-left-color:var(--tc,var(--acc))}
/* other surfaces */
.answer{background:color-mix(in srgb,var(--acc) 10%,var(--card));font-size:1.05rem}
.warn{border-left:4px solid var(--warnline)}
.note{border-left:4px solid color-mix(in srgb,var(--acc) 55%,transparent)}
.try,.stage{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.modes button.on{background:var(--acc);border-color:var(--acc)}
.mgrid>.card{border-top:5px solid var(--mc,var(--acc))}
.mgrid>.card:nth-child(5n+1){--mc:var(--lv2)}.mgrid>.card:nth-child(5n+2){--mc:var(--lv1)}.mgrid>.card:nth-child(5n+3){--mc:var(--lv3)}
.mgrid>.card:nth-child(5n+4){--mc:var(--t-equation)}.mgrid>.card:nth-child(5n+5){--mc:var(--lv0)}
.mgrid>.card>h2{color:var(--mc,var(--ink))}
.card.levels{border-top:5px solid var(--acc)}

/* ================================================================ course colour layer on top of the handover theme */
:root{--shadow:0 1px 2px rgba(22,36,46,.06),0 6px 18px rgba(22,36,46,.07);--src-v:#ffe3e3;--src-i:#d0ebff;--src-d:#f3d9fa;--grid:rgba(91,107,118,.16);--glow1:rgba(31,122,140,.10);--glow2:rgba(91,60,196,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);--src-v:#4a2328;--src-i:#1d3550;--src-d:#3d2347;--grid:rgba(159,176,187,.12);--glow1:rgba(95,211,192,.08);--glow2:rgba(151,117,250,.08)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);--src-v:#4a2328;--src-i:#1d3550;--src-d:#3d2347;--grid:rgba(159,176,187,.12);--glow1:rgba(95,211,192,.08);--glow2:rgba(151,117,250,.08)}
body{background:radial-gradient(900px 420px at 0 0,var(--glow1),transparent 70%),radial-gradient(900px 420px at 100% 0,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed}
.card{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
header{box-shadow:0 4px 14px rgba(0,0,0,.14)}
header h1{font-size:1.3rem}
/* levels: a tinted row per level with a numbered badge */
.level{background:color-mix(in srgb,var(--lv,var(--acc)) 7%,var(--card));border-left:5px solid var(--lv,var(--acc));border-radius:10px;padding:8px 12px}
.level .lname{display:flex;align-items:center;gap:10px;border-left:0;padding-left:0}
.lnum{flex:none;display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--lv,var(--acc));color:var(--on-acc);font-weight:700;font-size:.9rem}
.level .lname small{color:var(--muted)}
.qbtn,.lvb{border:1.5px solid color-mix(in srgb,var(--lv,var(--acc)) 45%,var(--line));border-radius:20px;background:var(--card)}
.qbtn.on,.lvb.on{background:var(--lv,var(--acc));border-color:var(--lv,var(--acc));color:var(--on-acc);box-shadow:0 2px 8px color-mix(in srgb,var(--lv,var(--acc)) 35%,transparent)}
.grp h2{color:var(--hdr2)}
.card.levels,.card.gen{border-top:0;padding-top:19px;background:linear-gradient(90deg,var(--hdr1),var(--hdr2)) top/100% 5px no-repeat,var(--card)}
/* the question: a level-coloured top edge; the circuit on faint graph paper */
.qcard{border-top:5px solid var(--lv,var(--acc))}
.qhead h2{margin:0}
.sticky>.card{border-top:5px solid color-mix(in srgb,var(--lv,var(--acc)) 55%,transparent);background-color:var(--card);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);background-size:20px 20px}
.src.sv{fill:var(--src-v)}.src.si{fill:var(--src-i)}.src.sd{fill:var(--src-d)}
.modes{background:color-mix(in srgb,var(--hdr2) 6%,var(--card));border-radius:24px;padding:5px 8px 5px 14px;width:fit-content;max-width:100%}
.modes button{border-radius:20px}
.modes button.on{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));border-color:transparent;color:#fff}
.stage{border-width:2px;border-color:var(--hdr2);box-shadow:var(--shadow)}
.stage .sq b{color:var(--hdr2)}
.srow input{font-size:1.05rem}
.srow input:focus,.try input:focus,.gen input:focus{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}

<script>
'use strict';
// Shared engine for the nodal / mesh analysis pages: exact fractions, linear expressions, a ladder-shaped
// netlist, an independent MNA solver, the SVG drawing and the step-by-step solution writer.
// Every number the steps print is derived by the step writer itself and then compared with the MNA solution.

// ===================================================================== exact fractions
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };

const F = x => Fr.of(x);

// ===================================================================== linear expressions  (sum of c·var + const)
class LE {

const vcmp = (a, b) => (a.length - b.length) || (a < b ? -1 : a > b ? 1 : 0);

// solve LE = 0 equations for the listed vars (Gauss-Jordan by substitution); throws if singular
function solveLin(eqs, vars) {
  eqs = eqs.slice(); const sol = [];

  const r = {}; sol.forEach(([v, ex]) => { if (!ex.isConst) throw Error('underdetermined'); r[v] = ex.c; }); return r;

// ===================================================================== number / symbol formatting
const MINUS = '−';
function fnum(f) {

  let d = f.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5;
  if (d === 1) { const s = String(Math.abs(f.val())); if (s.length <= 7) return (f.n < 0 ? MINUS : '') + s; }
  return (f.n < 0 ? MINUS : '') + Math.abs(f.n) + '/' + f.d;

const fnP = f => (F(f).sign() < 0 ? '(' + fnum(f) + ')' : fnum(f));               // negative numbers in brackets
function sf3(x) { x = x instanceof Fr ? x.val() : x; if (Math.abs(x) < 1e-12) return '0'; const v = Number(x.toPrecision(3)); return (v < 0 ? MINUS : '') + Math.abs(v); }
function fans(f) { const s = fnum(f); return s.includes('/') ? s + ' ≈ ' + sf3(f) : s; }   // answers: exact, plus 3 s.f. if a fraction
const coefH = a => { const s = fnum(a); return s.includes('/') ? '(' + s + ')' : s; };

const uni = (b, s) => b + String(s).split('').map(c => SUBU[c] || c).join('');
const sub = (b, s) => `${b}<sub>${s}</sub>`;
// a variable: v1, v2 (node voltages), i1, i2 (mesh currents), x (the controlling quantity)
const VH = v => v === 'x' ? '' : `<span class="var k${v.slice(1)}" data-var="${v}">${v[0]}<sub>${v.slice(1)}</sub></span>`;
function leH(e) {
  const parts = []; for (const [v, c] of e.k) parts.push([c, VH(v)]); if (!e.c.z) parts.push([e.c, null]);

    const neg = c.sign() < 0, a = c.abs(), mag = vh ? (a.eq(1) ? '' : coefH(a)) + vh : fnum(a);
    return i === 0 ? (neg ? MINUS : '') + mag : (neg ? ' − ' : ' + ') + mag;
  }).join('');
}
const stdH = (e, c) => leH(e.sorted()) + ' = ' + fnum(c);
const wrapT = (el, h) => (el ? `<span class="term" data-el="${el}">${h}</span>` : h);
const listJoin = a => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);

// ===================================================================== equation terms
// term value = sgn · k · ex / den.  sym: symbolic display of a dependent source (e.g. 2iₓ) until it is substituted.
const Tm = o => Object.assign({ el: null, sgn: 1, k: F(1), ex: LE.n(0), den: F(1), sym: null, dep: null, disp: null, bare: false }, o);
function tVal(t) { if (t.sym) return t.dep.ex.scale(F(t.sgn).mul(t.k).mul(t.dep.g).mul(t.dep.ck).div(t.dep.den)); return t.ex.scale(F(t.sgn).mul(t.k).div(t.den)); }
function single(e) { return e.k.size === 1 && e.c.z; }
function tSign(t) {
  if (t.sym || t.disp) return t.sgn;
  const e = t.ex; if (e.isConst) return t.sgn * e.c.mul(t.k).sign() || 1;
  if (single(e)) return t.sgn * t.k.sign() * e.co(e.vars()[0]).sign();
  return t.sgn * t.k.sign();
}
function core(t, mult) {                               // display without the leading sign
  if (t.sym) return (mult ? mult + ' × ' : '') + t.sym;
  if (t.disp) return (mult ? mult + ' × ' : '') + t.disp;
  const e = t.ex, k = t.k.abs();
  if (e.isConst) { const v = e.c.mul(k).div(t.den).abs(); return mult ? mult + ' × ' + fnum(e.c.abs().mul(k).div(t.den)) : fnum(v); }

}
function sideH(ts, mult) {
  if (!ts.length) return mult ? mult + ' × 0' : '0';

const eqH = (q, mult) => sideH(q.L, mult) + ' = ' + sideH(q.R, mult);
const mapT = (q, f) => ({ ...q, L: q.L.map(f), R: q.R.map(f) });

const hasSym = q => allT(q).some(t => t.sym);
function substEq(q, v, e) { return mapT(q, t => { const n = { ...t, ex: t.ex.subst(v, e), disp: null }; if (t.dep) n.dep = { ...t.dep, ex: t.dep.ex.subst(v, e) }; return n; }); }
function depEq(q, ctrl) {
  return mapT(q, t => {
    if (!t.sym) return t;
    const c = { ...t, sym: null, k: t.k.mul(t.dep.g).mul(t.dep.ck), ex: t.dep.ex, den: t.dep.den, dep: null };
    const inner = core(Tm({ k: t.dep.ck, ex: t.dep.ex, den: t.dep.den }));
    c.disp = (t.dep.g.eq(1) ? '' : fnum(t.dep.g) + ' × ') + (t.dep.ex.parts > 1 && t.dep.ck.eq(1) && t.dep.den.eq(1) ? '(' + leH(t.dep.ex) + ')' : inner);

function denOf(t) { const s = t.k.div(t.den); let L = s.d; for (const c of t.ex.k.values()) L = lcm(L, s.mul(c).d); return lcm(L, s.mul(t.ex.c).d); }

}
// tidy one equation into a·x + b·y = c, recording every move. Returns {lines, e, c}
function tidy(q, meta) {
  const lines = []; let cur = q;
  const push = (how, h) => { if (!lines.length || lines[lines.length - 1].eq !== h) lines.push({ how, eq: h }); };
  const ts = allT(cur); let L = 1; ts.forEach(t => { L = lcm(L, denOf(t)); });

// ===================================================================== solving the tidied equations
// show a·x + b·y with one unknown replaced by its number, in the written order
const putH = (e, v, val) => [...e.sorted().k].map(([x, c], i) => {
  const neg = c.sign() < 0, a = c.abs(), body = x === v ? (a.eq(1) ? fnP(val) : coefH(a) + '(' + fnum(val) + ')') : (a.eq(1) ? '' : coefH(a)) + VH(x);

function solveStd(eqs, vars, meta) {

    const v = e.vars()[0], a = e.co(v), val = c.div(a);

    else lines.push({ how: `${tag}This already gives the answer.`, eq: `${VH(v)} = <b>${fans(val)}</b>` });
    vals[v] = val; return val;

  lines.push({ how: ec.eq(1) ? 'This gives the first answer.' : `Divide both sides by ${fnum(ec)}.`, eq: `${VH(o)} = ${ec.eq(1) ? '' : `${fnum(C)} ÷ ${fnP(ec)} = `}<b>${fans(vo)}</b>` });

// ===================================================================== independent check: modified nodal analysis

    if (lines.length) S.push({ title: 'Put in the known value' + (kv.length > 1 ? 's' : ''), say: `Replace ${listJoin(kv.map(v => `${VH(v)} by ${fnum(ctx.known[v])}`))} wherever it appears.`, lines });
  }

    const srcs = net.els.filter(e => isV(e) && g.includes(e.na) && g.includes(e.nb));
    const inside = net.els.filter(e => !isV(e) && g.includes(e.na) && g.includes(e.nb));
    S.push({ title: 'Spot the supernode', say: `${listJoin(srcs.map(e => wrapT(e.id, elHv(e, net))))} sits between ${listJoin(g.map(nn))}, and neither is the reference. The current through a voltage source cannot be written with Ohm's law, so draw a bubble round both nodes and the source: a <b>supernode</b>. It gives <b>one KCL equation</b> (round the bubble) and <b>one equation from the source</b>.` +
      (inside.length ? ` ${listJoin(inside.map(e => wrapT(e.id, e.name)))} joins two nodes inside the bubble, so its current never crosses the dashed line: leave it out of the bubble KCL.` : ''), lines: [] });
  });
  // 4. KCL for each group
  const eqs = [];
  groups.forEach(g => {
    const L = [], R = [];
    net.els.forEach(e => {
      const ia = g.includes(e.na), ib = g.includes(e.nb);
      if (ia === ib || isV(e)) return;
      const n = ia ? e.na : e.nb, o = ia ? e.nb : e.na;
      if (e.t === 'R') { R.push(Tm({ el: e.id, ex: vl(n).sub(vl(o)).first(n.v), den: e.v })); return; }
      const into = ia;                       // the source pushes current out of terminal a, i.e. into node a
      const t = e.t === 'I' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } });
      (into ? L : R).push(t);
    });
    const name = g.length > 1 ? 'the supernode KCL' : `the KCL at node ${g[0].num}`;
    eqs.push({ name, q: { L, R }, q0: { L, R }, g });
    S.push({ title: g.length > 1 ? 'KCL round the supernode' : `KCL at node ${g[0].num}`,
      say: (g.length > 1 ? 'Count only the currents that cross the dashed line. ' : `Stand at node ${g[0].num}. `) + 'Current <b>in</b> = current <b>out</b>. Write every resistor current as <b>leaving</b> the node: (v<sub>this node</sub> − v<sub>other end</sub>) ÷ R. A source arrow pointing in is current in.' +
        (L.length ? '' : ' Nothing is drawn as flowing in, so the left-hand side is 0.'),
      lines: [{ how: 'in = out', eq: eqH({ L, R }) }] });
  });
  // constraints from voltage sources between unknown nodes (or a dependent source to ground)
  const C = cons.map(e => {
    const lhs = vl(e.na).sub(vl(e.nb)).first(e.na.v || e.nb.v);
    const L = [Tm({ el: e.id, ex: e.na.gnd ? lhs : lhs, bare: true })];
    const R = [e.t === 'V' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } })];
    const q0 = { L, R };
    return { el: e.id, q0, q: q0, title: 'Use the voltage source', how: '(+ end) − (− end) = source voltage',
      say: `${wrapT(e.id, elHv(e, net))} fixes the difference between its two nodes: the voltage at its + end minus the voltage at its − end equals the source voltage.` };
  });
  const ctrlSay = net.ctrl ? `The dependent source depends on ${ctrlH(net)}. Write ${ctrlH(net)} with node voltages, then put that into the equation${eqs.length + C.length > 1 ? 's' : ''}.` : '';
  const vals = pipeline({ kind: 'nodal', S, net, eqs, cons: C, known, unknowns, ctrlDef, ctrlSay, meta });
  // compare with the independent solution
  const M = mna(net);
  nodes.forEach(n => { if (!vals[n.v] || !vals[n.v].eq(M.v[n.v])) throw Error(`mismatch at ${n.v}`); });
  const res = results(net, q, S, vals, M, 'nodal', { eqs, C, ctrlDef });
  return { steps: S, unknowns: nodes.filter(n => !(n.v in known)).map(n => n.v), vals, M, meta, answers: res.answers };
}

// ===================================================================== MESH ANALYSIS
function meshSteps(net, q) {
  const S = [], meta = {}, m = net.ncol - 1;
  if (net.arch) throw Error('mesh analysis needs a planar ladder');
  const iv = k => (k >= 1 && k <= m ? LE.v('i' + k) : LE.n(0));
  const mvars = Array.from({ length: m }, (_, k) => 'i' + (k + 1));
  // current a→b through each element, written with mesh currents
  const iab = e => {
    let base;
    if (e.pos === 'col') base = iv(e.j).sub(iv(e.j + 1));              // downward
    else if (e.pos === 'top') base = iv(e.j + 1);                       // to the right
    else base = iv(e.j + 1).scale(-1);                                  // bottom: to the right
    const p = net.P[e.a], r = net.P[e.b];
    const fwd = e.pos === 'col' ? r.y > p.y : r.x > p.x;
    return fwd ? base : base.scale(-1);
  };
  const meshesOf = e => iab(e).vars();
  let ctrlDef = null;
  if (net.ctrl) {
    const X = net.ctrl, ex = iab(X);
    const first = ex.vars().find(v => ex.co(v).sign() > 0); const exo = first ? ex.first(first) : ex;
    ctrlDef = X.x === 'i'
      ? { ex: exo, den: F(1), ck: F(1), html: core(Tm({ ex: exo, bare: true })), how: `${ctrlH(net)} is the current in ${X.name} in the direction of its arrow. Add the mesh currents that flow that way and subtract those that flow against it:` }
      : { ex: exo, den: F(1), ck: X.v, html: core(Tm({ ex: exo, k: X.v })), how: `${ctrlH(net)} is the voltage across ${X.name} (+ end minus − end) = R × (current from + to −):` };
  }
  S.push({ title: 'Draw the mesh currents', say: `A mesh is a window of the circuit with no other loop inside it. This circuit has <b>${m} mesh${m > 1 ? 'es' : ''}</b>. Draw one <b>clockwise</b> current in each: ${listJoin(mvars.map(VH))}. If an answer comes out negative, that mesh current really flows anticlockwise.`, lines: [] });
  // current sources
  const known = {}, kl = [], consEls = [];
  const par = {}; mvars.forEach(v => { par[v] = v; });
  const find = v => (par[v] === v ? v : (par[v] = find(par[v])));
  net.els.filter(isI).forEach(e => {
    const ms = meshesOf(e);
    if (ms.length === 2) { par[find(ms[0])] = find(ms[1]); consEls.push(e); return; }
    const v = ms[0], arrow = iab(e).scale(-1), co = arrow.co(v);        // current in the arrow direction = co · i_k
    if (e.t === 'I') {
      known[v] = e.v.div(co);
      kl.push({ how: `${elHv(e, net)} is on an outside branch of mesh ${v.slice(1)}, so ${VH(v)} is the only mesh current through it. ${VH(v)} flows ${co.sign() > 0 ? 'the same way as' : 'against'} the source arrow there.`, eq: wrapT(e.id, `${VH(v)} = ${fnum(known[v])} A`) });
    } else consEls.push(e);
  });
  const fixedMesh = new Set(net.els.filter(isI).filter(e => meshesOf(e).length === 1).map(e => meshesOf(e)[0]));
  const unknowns = mvars.filter(v => !(v in known));
  S.push({ title: 'Which mesh currents are already known?', say: kl.length ? 'A current source on the outside edge of a mesh carries only that mesh current, so it fixes it.' : 'No current source sits on an outside edge, so no mesh current is known yet.',
    lines: kl.concat([{ how: `Unknowns left: ${listJoin(unknowns.map(VH))}. We need <b>${unknowns.length} equation${unknowns.length === 1 ? '' : 's'}</b>.`, eq: '' }]) });
  if (unknowns.length > 2) throw Error('more than 2 unknowns');
  // groups of meshes joined by a shared current source = supermesh
  const comps = {}; mvars.forEach(v => { (comps[find(v)] = comps[find(v)] || []).push(v); });
  const groups = Object.values(comps).map(g => g.sort(vcmp)).filter(g => !g.some(v => fixedMesh.has(v)));
  groups.filter(g => g.length > 1).forEach(g => {
    const shared = consEls.filter(e => meshesOf(e).length === 2 && meshesOf(e).every(v => g.includes(v)));
    const series = net.els.filter(e => !isI(e) && e.pos === 'col' && shared.some(s => s.j === e.j));
    S.push({ title: 'Spot the supermesh', say: `${listJoin(shared.map(e => wrapT(e.id, elHv(e, net))))} is shared by ${listJoin(g.map(v => 'mesh ' + v.slice(1)))}. Its voltage is unknown, so KVL cannot be written round either mesh on its own. Join the two meshes into a <b>supermesh</b>: walk round the <b>outside</b> of both, skipping the shared branch. This gives <b>one KVL equation</b>; the source gives the second equation.` +
      (series.length ? ` ${listJoin(series.map(e => wrapT(e.id, e.name)))} is in series with the current source in the shared branch, so it is skipped too.` : ''), lines: [] });
  });
  // KVL round each group
  const eqs = [];
  groups.forEach(g => {
    const k1 = +g[0].slice(1), k2 = +g[g.length - 1].slice(1), seq = [];
    const colEls = j => net.els.filter(e => e.pos === 'col' && e.j === j).sort((a, b) => Math.min(net.P[a.a].y, net.P[a.b].y) - Math.min(net.P[b.a].y, net.P[b.b].y));
    colEls(k1 - 1).reverse().forEach(e => seq.push([e, 'up', 'i' + k1]));
    for (let k = k1; k <= k2; k++) net.els.filter(e => e.pos === 'top' && e.j === k - 1).forEach(e => seq.push([e, 'right', 'i' + k]));
    colEls(k2).forEach(e => seq.push([e, 'down', 'i' + k2]));
    for (let k = k2; k >= k1; k--) net.els.filter(e => e.pos === 'bot' && e.j === k - 1).forEach(e => seq.push([e, 'left', 'i' + k]));
    const L = [];
    seq.forEach(([e, dir, own]) => {
      const p = net.P[e.a], r = net.P[e.b];
      const ab = { up: r.y < p.y, down: r.y > p.y, right: r.x > p.x, left: r.x < p.x }[dir] ? 1 : -1;   // +1 when we walk from a to b
      if (e.t === 'R') { L.push(Tm({ el: e.id, k: e.v, ex: iab(e).scale(ab).first(own) })); return; }
      if (isI(e)) throw Error('current source on a KVL path');
      if (e.t === 'V') L.push(Tm({ el: e.id, sgn: ab, ex: LE.n(e.v) }));
      else L.push(Tm({ el: e.id, sgn: ab, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } }));
    });
    const name = g.length > 1 ? 'the supermesh KVL' : `the KVL for mesh ${k1}`;
    eqs.push({ name, q: { L, R: [] }, q0: { L, R: [] }, g });
    S.push({ title: g.length > 1 ? 'KVL round the supermesh' : `KVL round mesh ${k1}`,
      say: `Start at the bottom-left corner of ${g.length > 1 ? 'the supermesh' : `mesh ${k1}`} and walk <b>clockwise</b>. Add the voltage drop across each element you pass; the total back at the start is 0. A resistor gives R × (current in the walking direction): for a shared resistor that is (this mesh current − the other mesh current). A source gives the sign of the terminal you meet first.`,
      lines: [{ how: 'sum of voltage drops = 0', eq: eqH({ L, R: [] }) }] });
  });
  // constraints from current sources that are shared, or dependent ones on an outside edge
  const C = consEls.map(e => {
    const arrow = iab(e).scale(-1); const pos = arrow.vars().find(v => arrow.co(v).sign() > 0); const lhs = pos ? arrow.first(pos) : arrow;
    const L = [Tm({ el: e.id, ex: lhs, bare: true })];
    const R = [e.t === 'I' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } })];
    const q0 = { L, R };
    return { el: e.id, q0, q: q0, title: 'Use the current source', how: 'current in the direction of the arrow = source current',
      say: `${wrapT(e.id, elHv(e, net))} fixes the current in its branch. Add the mesh currents that flow the same way as its arrow and subtract those that flow against it.` };
  });
  const ctrlSay = net.ctrl ? `The dependent source depends on ${ctrlH(net)}. Write ${ctrlH(net)} with mesh currents, then put that into the equation${eqs.length + C.length > 1 ? 's' : ''}.` : '';
  const vals = pipeline({ kind: 'mesh', S, net, eqs, cons: C, known, unknowns, ctrlDef, ctrlSay, meta });
  const M = mna(net);
  mvars.forEach(v => { if (!vals[v] || !vals[v].eq(M.mesh[v])) throw Error(`mismatch at ${v}`); });
  const res = results(net, q, S, vals, M, 'mesh', { eqs, C, ctrlDef, iab });
  return { steps: S, unknowns, vals, M, meta, answers: res.answers };
}

// ===================================================================== branch currents, extras, check
function results(net, q, S, vals, M, kind, X) {
  const answers = [];
  const ex = q.extras || [];
  const vOf = n => (n.gnd ? F(0) : vals[n.v]);
  const I = {};             // element current a→b, found by the steps
  const lines = [];
  if (kind === 'nodal') {
    net.els.filter(e => e.t === 'R').forEach(e => {
      let a = e.na, b = e.nb, word = e.dirWord, rev = e.revWord;
      if (a.gnd) { [a, b] = [b, a]; [word, rev] = [rev, word]; }
      const i = vOf(a).sub(vOf(b)).div(e.v);
      I[e.id] = e.na === a ? i : i.neg();
      const sym = b.gnd ? `${VH(a.v)}/${fnum(e.v)}` : `(${VH(a.v)} − ${VH(b.v)})/${fnum(e.v)}`;
      const num = b.gnd ? `${fnP(vOf(a))} ÷ ${fnum(e.v)}` : `(${fnum(vOf(a))} − ${fnP(vOf(b))}) ÷ ${fnum(e.v)}`;
      lines.push({ how: wrapT(e.id, `${e.name}, flowing ${word}:`), eq: wrapT(e.id, `${sym} = ${num} = ${fans(i)} A`) + (i.z ? ' &nbsp; (no current)' : i.sign() < 0 ? ` &nbsp; → really <b>${fans(i.neg())} A ${rev}</b>` : ` &nbsp; → <b>${fans(i)} A ${word}</b>`) });
    });
    S.push({ title: 'Find the current in each resistor', say: 'Use i = (v<sub>tail</sub> − v<sub>head</sub>) ÷ R with the node voltages. A negative answer means the current flows the other way.', lines });
  } else {
    net.els.forEach(e => {
      let le = X.iab(e); let word = e.dirWord, rev = e.revWord;
      const pos = le.vars().find(v => le.co(v).sign() > 0);
      if (!pos) { le = le.scale(-1); [word, rev] = [rev, word]; }
      const p2 = le.vars().find(v => le.co(v).sign() > 0); le = le.first(p2);
      const i = le.at(vals); I[e.id] = X.iab(e).at(vals);
      if (e.t !== 'R') return;
      const shown = [...le.k].map(([v, c], k) => (k ? (c.sign() < 0 ? ' − ' : ' + ') : '') + fnP(vals[v])).join('');
      lines.push({ how: wrapT(e.id, `${e.name}${le.k.size > 1 ? ' (shared)' : ''}, flowing ${word}:`), eq: wrapT(e.id, `${leH(le)}${le.k.size > 1 ? ` = ${shown}` : ''} = ${fans(i)} A`) + (i.z ? ' &nbsp; (no current)' : i.sign() < 0 ? ` &nbsp; → really <b>${fans(i.neg())} A ${rev}</b>` : ` &nbsp; → <b>${fans(i)} A ${word}</b>`) });
    });
    S.push({ title: 'Find the current in each resistor', say: 'A resistor on an outside edge carries one mesh current. A shared resistor carries the difference of the two mesh currents.', lines });
  }
  // the controlling quantity and the dependent source
  if (net.ctrl) {
    const d = X.ctrlDef, cv = d.ex.scale(d.ck.div(d.den)).at(vals);
    if (!cv.eq(M.ctrl)) throw Error('control mismatch');
    const dl = net.els.filter(isDep).map(e => ({ how: `${wrapT(e.id, 'The dependent source')}:`, eq: wrapT(e.id, `${depH(e, net)} = ${fnum(e.v)} × ${fnP(cv)} = <b>${fans(e.v.mul(cv))} ${depUnit(e)}</b>`) }));
    S.push({ title: 'Value of the dependent source', say: `Put the answers into the expression for ${ctrlH(net)}.`, lines: [{ how: '', eq: `${ctrlH(net)} = ${wrapT(net.ctrl.id, d.html)} = <b>${fans(cv)} ${net.ctrl.x === 'i' ? 'A' : 'V'}</b>` }].concat(dl) });
    answers.push({ v: 'x', html: ctrlH(net), val: cv, unit: net.ctrl.x === 'i' ? 'A' : 'V' });
  }
  const ctrlV = net.ctrl ? X.ctrlDef.ex.scale(X.ctrlDef.ck.div(X.ctrlDef.den)).at(vals) : null;
  const srcVal = e => (isDep(e) ? e.v.mul(ctrlV) : e.v);
  // voltage-source currents (nodal) by KCL at one node; current-source voltages (mesh) by KVL round one mesh
  const need = ex.includes('power');
  if (kind === 'nodal') {
    net.els.filter(isV).forEach(e => {
      if (!(need || ex.includes('isrc'))) return;
      const cand = [e.na, e.nb].filter(n => !n.gnd && net.els.filter(f => isV(f) && (f.na === n || f.nb === n)).length === 1);
      if (!cand.length) throw Error('cannot find the source current');
      const n = cand[0], inT = [], outT = [];
      let sumIn = F(0), sumOut = F(0);
      net.els.forEach(f => {
        if (f === e || (f.na !== n && f.nb !== n)) return;
        const leave = f.na === n ? I[f.id] ?? (isI(f) ? srcVal(f).neg() : null) : (I[f.id] !== undefined ? I[f.id].neg() : (isI(f) ? srcVal(f) : null));
        if (leave === null) throw Error('unknown current');
        if (f.t === 'R') { outT.push(wrapT(f.id, fnP(leave))); sumOut = sumOut.add(leave); }
        else if (leave.sign() < 0) { inT.push(wrapT(f.id, fnum(leave.neg()))); sumIn = sumIn.add(leave.neg()); }
        else { outT.push(wrapT(f.id, fnum(leave))); sumOut = sumOut.add(leave); }
      });
      const is = sumIn.sub(sumOut);               // leaving node n through the source
      const other = e.na === n ? e.nb : e.na;
      I[e.id] = e.na === n ? is : is.neg();
      const ish = `i<sub>s</sub>`;
      const l2 = [{ how: `KCL at node ${n.num} on its own, with ${ish} = current leaving node ${n.num} through ${elH(e)}:`, eq: `${inT.length ? inT.join(' + ') : '0'} = ${outT.concat([wrapT(e.id, ish)]).join(' + ')}` },
        { how: `Rearrange for ${ish}:`, eq: `${wrapT(e.id, ish)} = ${fnum(sumIn)} − ${fnP(sumOut)} = <b>${fans(is)} A</b>` }];
      const toward = is.sign() >= 0 ? (other.gnd ? 'the reference' : `node ${other.num}`) : `node ${n.num}`;
      l2.push({ how: '', eq: `So ${fans(is.abs())} A flows through ${wrapT(e.id, elH(e))} towards ${toward}.` });
      S.push({ title: `Current through ${elH(e)}`, say: "A voltage source's current has no formula of its own. Find it with KCL at one of its nodes, now that every other current there is known.", lines: l2 });
      answers.push({ v: 'is_' + e.id, html: `current through ${elH(e)}`, val: I[e.id].abs(), unit: 'A', hide: true });
    });
  } else {
    net.els.filter(isI).forEach(e => {
      if (!(need || ex.includes('vsrc'))) return;
      const ms = X.iab(e).vars(); const k = Math.min(...ms.map(v => +v.slice(1)));
      // walk mesh k clockwise
      const seq = [], colEls = j => net.els.filter(f => f.pos === 'col' && f.j === j).sort((a, b) => Math.min(net.P[a.a].y, net.P[a.b].y) - Math.min(net.P[b.a].y, net.P[b.b].y));
      colEls(k - 1).reverse().forEach(f => seq.push([f, 'up'])); net.els.filter(f => f.pos === 'top' && f.j === k - 1).forEach(f => seq.push([f, 'right']));
      colEls(k).forEach(f => seq.push([f, 'down'])); net.els.filter(f => f.pos === 'bot' && f.j === k - 1).forEach(f => seq.push([f, 'left']));
      const parts = []; let sum = F(0), selfDir = 1;
      seq.forEach(([f, dir]) => {
        const p = net.P[f.a], r = net.P[f.b];
        const ab = { up: r.y < p.y, down: r.y > p.y, right: r.x > p.x, left: r.x < p.x }[dir] ? 1 : -1;
        if (f === e) { selfDir = dir === 'down' || dir === 'right' ? 1 : -1; parts.push(wrapT(f.id, (selfDir > 0 ? '+ ' : '− ') + 'v')); return; }
        let drop;
        if (f.t === 'R') drop = f.v.mul(I[f.id]).mul(ab);
        else if (isV(f)) drop = srcVal(f).mul(ab);
        else drop = M.vab[f.id].mul(ab);
        sum = sum.add(drop); parts.push(wrapT(f.id, (drop.sign() < 0 ? '− ' : '+ ') + fnum(drop.abs())));
      });
      const vShow = sum.neg().mul(selfDir);       // top minus bottom (or left minus right)
      const end = e.pos === 'col' ? ['top', 'bottom'] : ['left', 'right'];
      const pa = net.P[e.a], pb = net.P[e.b]; const aIsFirst = e.pos === 'col' ? pa.y < pb.y : pa.x < pb.x;
      if (!(aIsFirst ? vShow : vShow.neg()).eq(M.vab[e.id])) throw Error('vsrc mismatch');
      S.push({ title: `Voltage across ${elH(e)}`, say: `A current source's voltage has no formula of its own. Call it v (${end[0]} end minus ${end[1]} end) and write KVL round mesh ${k}, now that every current is known.`,
        lines: [{ how: `KVL round mesh ${k} (voltage drops, clockwise):`, eq: parts.join(' ').replace(/^\+ /, '').replace(/^(<[^>]+>)?\+ /, '$1').replace(/^(<[^>]+>)?− /, '$1−') + ' = 0' },
          { how: 'Rearrange for v:', eq: `v = <b>${fans(vShow)} V</b> &nbsp; (${end[0]} end ${vShow.sign() >= 0 ? 'higher' : 'lower'})` }] });
      answers.push({ v: 'vs_' + e.id, html: `voltage across ${elH(e)}`, val: vShow, unit: 'V', hide: true });
    });
  }
  // power balance
  if (need) {
    const pl = []; let sup = F(0), abs = F(0); const supL = [], absL = [];
    net.els.forEach(e => {
      const i = I[e.id] ?? M.i[e.id], v = kind === 'nodal' ? vOf(e.na).sub(vOf(e.nb)) : (isI(e) ? M.vab[e.id] : (e.t === 'R' ? e.v.mul(i) : srcVal(e)));
      if (!i.eq(M.i[e.id]) || !v.eq(M.vab[e.id])) throw Error('power mismatch ' + e.id);
      const p = v.mul(i);                                   // absorbed, passive sign convention
      if (e.t === 'R') { pl.push({ how: wrapT(e.id, `${e.name}:`), eq: wrapT(e.id, `i²R = ${fnum(i.abs()).includes('/') ? '(' + fnum(i.abs()) + ')' : fnum(i.abs())}² × ${fnum(e.v)} = ${fans(p)} W absorbed`) }); abs = abs.add(p); absL.push(fnum(p)); return; }
      const what = p.sign() < 0 ? 'supplied' : 'absorbed';

      const last = snet.els.find(e => e.pos === 'top' && e.j === Jl - 1);
      if (!last || last.t !== 'R') throw Error('needs a series resistor next to a');
      const rightward = snet.P[last.a].x < snet.P[last.b].x ? 1 : -1;
      if (srcs.length === 1) {
        const d = drive(snet, srcs[0], meta), leaf = d.red.all.find(z => z.leaf.id === last.id);
        const lines = d.lines.concat(leaf.zero ? [] : downLines(leaf, meta, 'i'));
        X.in = d.M.i[last.id].mul(rightward);
        lines.push({ how: `The current in ${wrapT(last.id, last.name)} goes straight on through the short from a to b:`, eq: `${NM.in} = <b>${fr(X.in)} A</b>` });
        S.push({ title: 'Find I<sub>N</sub>: short a-b', say: 'Join a to b with a wire and find the current in that wire. Every resistor stays; the sources stay on.', fig: fig(snet), lines });
      } else {
        const r = nodalSteps(snet, { extras: [] });
        meta.unk = Math.max(meta.unk || 0, r.unknowns.length); if (r.meta.frac) meta.bad = true;
        const k = last.na.gnd ? last.nb : last.na, vk = k.gnd ? F(0) : r.vals[k.v];
        const nf = svgNet(snet, 'nodal', overlays(snet, 'nodal')).replace('class="ckt"', 'class="ckt colour"');
        S.push({ title: 'Find I<sub>N</sub>: short a-b', say: `Join a to b with a wire. Terminal a is now part of the reference node (0 V). With more than one source, use nodal analysis; then ${NM.in} is the current in ${wrapT(last.id, last.name)}, which flows on through the short.`, fig: nf, lines: [] });
        r.steps.filter(s => !/current in each resistor|^Check/.test(s.title)).forEach(s => S.push(s));
        X.in = vk.div(last.v);
        if (!X.in.eq(mna(snet).i[last.id].mul(rightward))) throw Error('short-circuit current mismatch');
        S.push({ title: 'Read off I<sub>N</sub>', say: '', lines: [{ how: `Current in ${wrapT(last.id, last.name)} towards a (a is at 0 V now): Ohm's law.`, eq: `${NM.in} = (${k.gnd ? '0' : VH(k.v)} − 0) ÷ ${wrapT(last.id, fnum(last.v))} = ${fnP(vk)} ÷ ${fnum(last.v)} = <b>${fr(X.in)} A</b>` }] });
      }
    }
    const chk = mnaTh(spec);
    if (!rn.eq(chk.rth) || !X.in.eq(chk.vth.div(chk.rth))) throw Error('Norton mismatch');
    if (ugly(X.in) || ugly(rn)) meta.bad = true;
    S.push({ title: 'Draw the Norton equivalent', say: 'A current source I<sub>N</sub> (arrow towards a) in parallel with R<sub>N</sub>.', fig: equivFig('no', X, spec),
      lines: [{ how: '', eq: `${NM.in} = <b>${fr(X.in)} A</b>, &nbsp; ${NM.rn} = <b>${fr(rn)} Ω</b>` },
        { how: 'Check with the Thevenin form: V<sub>Th</sub> = I<sub>N</sub> × R<sub>N</sub>.', eq: `${NM.vth} = ${fr(X.in)} × ${fr(rn)} = <b>${fr(X.in.mul(rn))} V</b>` }] });
    ans.push({ html: NM.in, val: X.in, unit: 'A' }, { html: NM.rn, val: rn, unit: 'Ω' });
    if (q.inm === 'fromTh') ans.unshift({ html: NM.vth, val: X.vth, unit: 'V' });
    loadSteps(spec, S, ans, meta, 'no', X, q);
    return finish(S, ans, meta, X);
  }

  // chk: the headline results in plain form, re-derived independently by check.py (sympy) from fixed.json
  function finish(S, ans, meta, chk) {
    const friendly = !meta.bad && (meta.unk || 0) <= 2 && ans.every(a => !a.val.z && a.val.d <= 2 && Math.abs(a.val.val()) <= 200);
    return { steps: S, unknowns: [], vals: {}, answers: ans, meta, friendly, chk: chk || {} };
  }
  Object.assign(KINDS, { super: superSteps, trans: transSteps, thev: thevSteps, norton: nortonSteps });
})();

<script>

    H3: [

      h => ({ spec: { cols: [V(h.V()), R(h.r()), mayFlip(h, I(h.I())), RL(h.r())], top: [R(h.r()), 'w', R(h.r())], ab: true }, vth: 'super' }),

  // ------------------------------------------------------------ method cards, one set per concept
  const method = {

      { title: 'Switching a source off',
        html: `<table><tr><th>Source</th><th>Off means</th><th>Why</th></tr>

        html: `<p><b>Series:</b> R = R<sub>1</sub> + R<sub>2</sub>. &nbsp; <b>Parallel (two):</b> R = (R<sub>1</sub> × R<sub>2</sub>) ÷ (R<sub>1</sub> + R<sub>2</sub>), product over sum. Example: 6 ∥ 3 = 18 ÷ 9 = 2 Ω.</p>

        html: `<ol><li><b>Remove the load</b> and mark the terminals a and b.</li>

        html: P('With a-b open, <b>no current</b> leaves at a. So a resistor that leads only to terminal a has <b>no current and no voltage</b> across it: a sits at the same voltage as the node at the other end of that resistor.') +

      { title: 'Short-circuit current', spec: { cols: [V(36), R(12), { t: 'S', of: 'R', n: 'sc', nm: '', lab: 'a–b shorted' }], top: [R(6), R(4)], ab: true },

  // ------------------------------------------------------------ question bank
  const questions = [

<script>
'use strict';
// Shared by every interactive self-study page (from the Interactive Study Pages handover): reading typed answers, checking
// them with hints for known mistakes, the step badges and icons, and the help modes (Watch / Guided / On my own) in
// which the student works out one number at a time.  A page gives each question a list of "stages":
//   { html, unit, kind: 'real' | 'cx' | 'deg', val (number, or [re, im] for 'cx'), step (index), wrong: [{ val, why }], tol? }
// tol (real answers only) is the relative tolerance, 1 % by default: make it smaller when a common mistake lands close
// to the right answer (money, for example).
// and a reveal(n) that shows the first n steps.  Loaded before the page's shell.js, which defines $ and $$.

// ---------------------------------------------------------------- reading a typed answer
// real: 0.33, 330 ms, 330m, 1.5k, 2.4 kΩ, -24, 63.4°     complex: 4+j8, 4 + 8j, -j2, 8.94∠63.4, 8.94<63.4, 8.94@63.4

  if (fr && +fr[2] && (!fr[3] || UNITS.includes(fr[3]))) return +fr[1] / +fr[2];
  const m = /^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)(.*)$/.exec(s);
  if (!m) return null;

// ---------------------------------------------------------------- checking it
function isRight(st, v) {

const STEP_TYPES = [

  algebra: '<path d="M3 13l1-4 7-7 3 3-7 7zM9.5 3.5l3 3"/>',

const MODES = [{ id: 'watch', name: 'Watch', tip: 'See every step worked out for you.' },
  { id: 'guided', name: 'Guided', tip: 'Each step tells you what to do; you work out the number.' },
  { id: 'own', name: 'On my own', tip: 'Only the step titles: you do all the working.' }];

'use strict';

function stepOfVal(steps, val, from) {
  const want = `<b>${fans(val)}`, alt = `<b>${fnum(val)}`;
  const text = s => [s.say || '', s.note || '', ...(s.lines || []).map(l => (l.how || '') + (l.eq || ''))].join(' ');
  for (let i = from; i < steps.length; i++) { const t = text(steps[i]); if (t.includes(want) || t.includes(alt)) return i; }
  return -1;
}

// ---------------------------------------------------------------- the circuit re-solved with one change
function resolveWith(q, change) {
  try { const net = buildNet(q.spec); if (change(net) === false) return null; return mna(net); } catch (e) { return null; }
}
const unkOf = (M, v) => (M ? (M.v[v] !== undefined ? M.v[v] : M.mesh && M.mesh[v]) : undefined);
function circuitSlips(q, v) {
  const out = [], els = buildNet(q.spec).els;
  els.forEach((e, k) => {
    if (e.ghost) return;
    if (e.t === 'V' || e.t === 'I') {
      const M = resolveWith(q, n => { n.els[k].v = n.els[k].v.neg(); });
      out.push([unkOf(M, v), e.t === 'V' ? `That is the answer with ${e.name} the other way round. Check which end of ${e.name} is + before you write it into the equation.`
        : `That is the answer with ${e.name} pointing the other way. Current into a node is on one side, current out on the other: check which way its arrow points.`]);
      if (e.t === 'I') {
        const M0 = resolveWith(q, n => { n.els[k].v = F(0); });
        out.push([unkOf(M0, v), `That is the answer with ${e.name} left out. Every source joined to a node (or in a mesh) must appear in its equation.`]);
      }
    } else if (e.fam === 'D') {
      const M0 = resolveWith(q, n => { n.els[k].v = F(0); });
      out.push([unkOf(M0, v), 'That is the answer with the dependent source left out. Write it with the controlling quantity and keep it in the equation.']);
    }
  });
  return out;
}

// ---------------------------------------------------------------- the stage list for one solved question
// every stage: { html, unit, kind: 'real', val, step, wrong: [{ val, why }], tol?, abs? }  (abs: the size is asked)
function stagesOf(q, sol, kind) {
  const steps = typeSteps(sol.steps), list = [];
  let at = 0;
  const add = (html, val, unit, wrong, abs, from) => {             // from: search from this step (else after the last stage)
    const s = stepOfVal(steps, val, from ?? at); if (s < 0) return;
    at = Math.max(at, s);
    const v = (abs ? val.abs() : val).val();
    list.push({ html, unit, kind: 'real', val: v, step: s, abs: !!abs, wrong: cleanWrong(v, (wrong || []).map(([w, why]) => ({ val: w === undefined || w === null ? NaN : abs ? Math.abs(w.val ? w.val() : w) : (w.val ? w.val() : w), why }))) });
  };
  if (q.custom) { (sol.answers || []).forEach(x => add(x.html, x.val, x.unit, [])); return list; }   // hand-written warm-ups: their answers only
  const net = sol.net;
  if (kind === 'nodal' || kind === 'mesh') {
    const unit = kind === 'nodal' ? 'V' : 'A';
    sol.unknowns.forEach(v => add(VH(v), sol.vals[v], unit, circuitSlips(q, v), false, 0));   // solved in any order
    // branch currents, in the order the step lists them
    const bs = steps.findIndex(s => /^Find the current in each resistor/.test(s.title));
    if (bs >= 0) {
      const M = sol.M || mna(net), V = n => (n.gnd ? F(0) : (sol.vals[n.v] || M.v[n.v]));
      net.els.filter(e => e.t === 'R').forEach(e => {
        const i = M.i[e.id], w = [];
        if (kind === 'nodal') {
          const a = V(e.na), b = V(e.nb);
          if (!e.na.gnd && !e.nb.gnd) {
            w.push([a.div(e.v), 'That uses one node voltage only. The current depends on the voltage across the resistor: (v at one end − v at the other end) ÷ R.']);
            w.push([b.div(e.v), 'That uses one node voltage only. The current depends on the voltage across the resistor: (v at one end − v at the other end) ÷ R.']);
            w.push([a.add(b).div(e.v), 'That adds the two node voltages. The voltage across the resistor is their difference.']);
          }
          w.push([a.sub(b).mul(e.v), 'That multiplies by R. Ohm\'s law gives current = voltage ÷ resistance.']);
        } else {
          const ms = Object.keys(sol.vals).filter(k => /^i\d+$/.test(k));
          const near = ms.filter(k => Math.abs(sol.vals[k].val()) > 1e-12);
          if (ms.length === 2 && Math.abs(Math.abs(i.val()) - Math.abs(sol.vals[ms[0]].val())) > 1e-9 && Math.abs(Math.abs(i.val()) - Math.abs(sol.vals[ms[1]].val())) > 1e-9 && near.length === 2) {
            w.push([sol.vals[ms[0]], 'That is one mesh current only. A shared resistor carries both mesh currents: take the difference.']);
            w.push([sol.vals[ms[1]], 'That is one mesh current only. A shared resistor carries both mesh currents: take the difference.']);
            w.push([sol.vals[ms[0]].add(sol.vals[ms[1]]), 'That adds the two mesh currents. Both are clockwise, so in a shared resistor they flow opposite ways: subtract.']);
          }
        }
        list.push({ html: `current in ${e.name}`, unit: 'A', kind: 'real', val: Math.abs(i.val()), step: bs, abs: true, wrong: cleanWrong(Math.abs(i.val()), w.map(([x, why]) => ({ val: Math.abs(x.val()), why }))) });
        at = Math.max(at, bs);
      });
    }
    (sol.answers || []).forEach(a => add(a.html.replace(/^./, c => c.toUpperCase()), a.val, a.unit, [], a.unit === 'A' || a.unit === 'V'));
  } else {
    const X = sol.chk || {};
    const rAll = net.els.filter(e => e.t === 'R' && !e.load && !e.ghost).reduce((s, e) => s.add(e.v), F(0));
    (sol.answers || []).forEach(a => {
      const w = [], h = a.html;
      if (a.unit === 'Ω' && /R<sub>(Th|N)<\/sub>/.test(h)) w.push([rAll, 'That adds every resistor in series. Look in from a-b with the sources off: some resistors are in parallel, so combine them with product ÷ sum.']);
      if (/I<sub>N<\/sub>/.test(h) && X.vth && X.rth) w.push([X.vth.mul(X.rth), 'That multiplies. The Norton current is V<sub>Th</sub> ÷ R<sub>Th</sub>.']);
      if (/^I<sub>L<\/sub>/.test(h) && X.vth && X.rth) {
        w.push([X.vth.div(X.rth), 'That leaves out the load. The load current is V<sub>Th</sub> ÷ (R<sub>Th</sub> + R<sub>L</sub>).']);
        const RL = X.loads && X.loads.length === 1 ? F(X.loads[0][0]) : null;
        if (RL) w.push([X.vth.div(RL), 'That leaves out R<sub>Th</sub>. The load current is V<sub>Th</sub> ÷ (R<sub>Th</sub> + R<sub>L</sub>).']);
      }
      if (X.parts && X.parts.length > 1 && a.val.eq && X.total && a.val.eq(X.total)) {
        w.push([X.parts.reduce((s, p) => s.add(p[1].abs()), F(0)), 'That adds the sizes only. A part that flows the other way is negative: keep each part\'s sign when you add.']);
      }
      add(h.replace(/^[a-z]/, c => c.toUpperCase()), a.val, a.unit, w);
    });
  }
  return list.map((x, k) => [x, k]).sort((a, b) => a[0].step - b[0].step || a[1] - b[1]).map(x => x[0]);   // in step order
}
// drop mistakes that are not numbers, that sit within 3 tolerances of the answer, or that repeat an earlier one
function cleanWrong(v, wrong) {
  const out = [];
  for (const w of wrong) {
    if (!Number.isFinite(w.val)) continue;
    if (Math.abs(w.val - v) <= Math.max(0.015, Math.abs(v) * 0.03)) continue;
    if (out.some(o => isRight({ kind: 'real', val: o.val }, w.val) || isRight({ kind: 'real', val: w.val }, o.val))) continue;   // same band as the answer check
    out.push(w);
  }
  return out;
}

</script>
<script>
'use strict';
// Page shell: method view, question bank (every question open, in any order), practice generator,
// and the two-way hover link between circuit elements and equation terms. Nothing here is timed.
// The help modes (Watch / Guided / On my own) come from stage.js; the numbers asked come from stages.js.
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TOPIC = window.TOPIC;
// a page holds one method (nodal, mesh) or several concepts, each with its own levels and step writer
const GROUPS = TOPIC.groups || [{ id: 'all', name: '', kind: TOPIC.kind, levels: TOPIC.levels }];
const LEVELS = GROUPS.flatMap(g => g.levels.map(l => ({ ...l, group: g })));
const lvOf = id => LEVELS.find(l => l.id === id);
const kindOf = q => q.kind || lvOf(q.level).group.kind;
const PLAIN = k => k === 'nodal' || k === 'mesh';
const methodOf = g => (Array.isArray(TOPIC.method) ? TOPIC.method : TOPIC.method[g.id]);
let view = 'questions', curQ = null, shown = 0, curSol = null, KIND = TOPIC.kind;
let genGroup = GROUPS[0], genLevel = genGroup.levels[Math.min(1, genGroup.levels.length - 1)].id, mGroup = GROUPS[0];

// ---------------------------------------------------------------- hover: element <-> term, node/mesh <-> variable
let pinned = null;
// data-els lists the original elements inside a combined resistor or an equivalent source: they light up together
function keyOf(t) {
  const g = t.closest('[data-el],[data-els]') || t.closest('[data-var]'); if (!g) return null;
  if (g.dataset.el || g.dataset.els) return ['el', [g.dataset.el, ...(g.dataset.els || '').split(' ')].filter(Boolean).join(' ')];
  return ['var', g.dataset.var];
}
function light(k, scope) {
  $$('.hl').forEach(n => n.classList.remove('hl'));
  if (!k || !scope) return;
  if (k[0] === 'var') { $$(`[data-var="${k[1]}"]`, scope).forEach(n => n.classList.add('hl')); return; }
  k[1].split(' ').forEach(id => $$(`[data-el="${id}"],[data-els~="${id}"]`, scope).forEach(n => n.classList.add('hl')));
}
document.addEventListener('mouseover', e => { if (pinned) return; const k = keyOf(e.target); light(k, e.target.closest('.scope')); });
document.addEventListener('mouseout', e => { if (pinned) return; if (!e.relatedTarget || !keyOf(e.relatedTarget)) light(null); });
document.addEventListener('click', e => {           // tap to pin a highlight on touch screens; tap again to clear
  const k = keyOf(e.target);
  if (!k) { pinned = null; light(null); return; }
  if (pinned && pinned[0] === k[0] && pinned[1] === k[1]) { pinned = null; light(null); return; }

// ---------------------------------------------------------------- text helpers
const T = (el, h) => `<span class="term" data-el="${el}">${h}</span>`;

function autoText(q, sol) {
  if (q.text) return q.text;
  const u = sol.unknowns, ex = q.extras || [];
  const parts = [`Use ${KIND === 'nodal' ? 'nodal' : 'mesh'} analysis to find ${listJoin(varList(u))}${u.length ? '' : ' the unknowns'}, then the current in each resistor.`];
  if (ex.includes('isrc')) parts.push(`Find the current through ${listJoin(sol.net.els.filter(isV).map(elH))}.`);
  if (ex.includes('vsrc')) parts.push(`Find the voltage across ${listJoin(sol.net.els.filter(isI).map(elH))}.`);
  if (sol.net.ctrl) parts.push(`Find the value of the dependent source.`);
  if (ex.includes('power')) parts.push('Find the power of every element and show that the power supplied equals the power absorbed.');
  return parts.map(p => `<p>${p}</p>`).join('');
}
// ---------------------------------------------------------------- one question (fixed or generated)
function solve(q) {
  if (q.sol) return q.sol;
  if (q.custom) { const net = buildNet(q.spec); const c = q.custom(net); q.sol = { net, steps: c.steps, unknowns: c.unknowns || [], vals: c.vals || {}, answers: c.answers || [], custom: true }; return q.sol; }

}
function answerList(q, sol) {
  const a = sol.unknowns.map(v => ({ html: VH(v), val: sol.vals[v], unit: kindOf(q) === 'nodal' ? 'V' : 'A' }));
  return a.concat(sol.answers || []);
}
const fmtStage = a => `${sf3(a.val)} ${a.unit}`;
function renderQ(box, q, label) {
  KIND = kindOf(q);
  const sol = solve(q); curQ = q; curSol = sol; shown = 0;
  const lv = lvOf(q.level), lvi = lv ? lv.group.levels.indexOf(lv) : 0;
  const ans = answerList(q, sol);
  const tryable = ans.filter(a => !a.hide);
  const stages = sol.stages || (sol.stages = stagesOf(q, sol, KIND));
  const staged = stageStart(stages, sol.steps, { reveal, restart: () => renderQ(box, q, label), fmt: fmtStage });
  box.innerHTML = `<div class="qgrid scope" data-lv="${lvi}">
    <div class="sticky"><div class="card"><div id="cktbox"></div>
      ${isWarm(q) ? `<div class="flowbar"><button id="replay"${KIND !== 'mesh' ? ' hidden' : ''}>▶ Show the current</button><span class="muted" id="flowcap"></span></div>` : ''}
      <p class="hint">${PLAIN(KIND) ? 'Hover over (or tap) any element to light up every term it creates in the equations. Hover over a term to find its element. Coloured letters are node voltages or mesh currents.'
        : 'Hover over (or tap) any element to light up every number it gives in the steps, in this circuit and in the redrawn ones. Hover over a number or a combined resistor to find its elements. Switched-off sources are drawn faint.'}</p></div></div>
    <div class="card qcard">
      <div class="qhead"><span class="chip">${lv ? (lv.group.name ? lv.group.name + ' · ' : '') + lv.name : ''}</span><h2>${label}</h2></div>
      <div class="qtext">${autoText(q, sol)}</div>
      ${modeBarHTML()}
      ${!staged && tryable.length ? `<details class="try"><summary>Try it yourself first, then check your answers here</summary>
        <div>${tryable.map((a, i) => `<label>${a.html} = <input data-i="${i}" inputmode="decimal" autocomplete="off"> ${a.unit}</label>`).join('')}
        <button id="chk">Check</button> <span id="chkout"></span></div></details>` : ''}
      ${staged ? '' : `<div class="ctl"><button class="primary" id="nx">Show next step</button><button id="all">Show all steps</button><button id="hide">Hide steps</button>
        <span class="muted" id="cnt"></span></div>`}
      ${stepsHTML(typeSteps(sol.steps))}
      ${staged ? '<div class="stage" id="stage" aria-live="polite"></div>' : ''}
      <div class="answer" id="ansbox" hidden><b>Answers:</b> ${ans.map(a => `${a.html} = <b>${fans(a.val)} ${a.unit}</b>`).join('; &nbsp; ')}</div>
      ${q.mistake ? `<div class="warn" id="mist" hidden><b>Common mistake:</b> ${q.mistake}</div>` : ''}
      <div class="more"><button id="more">Practise more like this →</button><span class="muted">a new ${lv ? lv.name : ''} question, solved the same way</span></div>
    </div></div>`;
  setupFlow(q, sol);
  drawCkt();
  bindModeBar(box, () => renderQ(box, q, label));
  if (!staged) {
    $('#nx').onclick = () => reveal(shown + 1);
    $('#all').onclick = () => reveal(sol.steps.length);
    $('#hide').onclick = () => reveal(0);
  }
  $('#more').onclick = () => { genGroup = lv.group; genLevel = q.level; setView('practice'); gen(genLevel, Math.floor(Math.random() * 90000) + 10000); };
  const ck = $('#chk');
  if (ck) ck.onclick = () => {
    let good = 0;
    $$('.try input').forEach(inp => {
      const a = tryable[+inp.dataset.i], v = parseNum(inp.value), t = a.val.val();
      const ok = v !== null && Math.abs(v - t) <= Math.max(0.01, Math.abs(t) * 0.01);
      inp.style.borderColor = v === null ? '' : ok ? 'var(--ok)' : 'var(--bad)'; if (ok) good++;
    });
    $('#chkout').innerHTML = good === tryable.length ? '<span class="ok">All correct ✓</span>' : `<span class="bad">${good} of ${tryable.length} correct.</span> Open the steps to see where it goes wrong.`;
  };
  reveal(0);
  if (staged) drawStage();
  if (flow && KIND === 'mesh') play('cw');
}
// the circuit is drawn once per question; later steps only switch on the node colours / bubble
function drawCkt() {
  const sol = curSol, upto = sol.steps.slice(0, shown), svg = $('#cktbox svg');
  svg.classList.toggle('colour', KIND === 'nodal' && shown > 0);
  svg.classList.toggle('over', upto.some(s => /supernode|supermesh/i.test(s.title)));
}

// ---------------------------------------------------------------- brief current-flow dots (warm-up questions only)
// Nodal: dots run along every element in the real current direction, first shown with the branch currents.
// Mesh: dots circle each loop clockwise on opening, then in the real direction once the equations are solved.
let flow = null, flowTimers = [];
const isWarm = q => q.level === 'warm' || !!(lvOf(q.level) || {}).warm;
function setupFlow(q, sol) {
  flow = null;
  const net = sol.net, opt = PLAIN(KIND) ? overlays(net, KIND) : {};
  if (isWarm(q)) {
    const M = sol.M || mna(net);
    const trig = PLAIN(KIND) ? sol.steps.findIndex(s => (KIND === 'nodal' ? /current in each resistor|^KCL at node/i : /^Solve/).test(s.title)) : sol.steps.findIndex(s => s.flow);
    flow = { trig, fired: false, neg: [] };

}
function play(name) {
  flowTimers.forEach(clearTimeout); flowTimers = [];
  const svg = $('#cktbox svg'); if (!svg || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('.flow animate, .flow animateMotion', svg).forEach(a => { try { a.endElement(); } catch (e) { /* not started yet */ } });
  $$(`.flow[data-flow="${name}"] circle`, svg).forEach(c => {
    const m = $('animateMotion', c), o = $('animate', c), dur = parseFloat(m.getAttribute('dur'));
    flowTimers.push(setTimeout(() => { try { m.beginElement(); o.beginElement(); } catch (e) { /* svg replaced */ } }, +m.dataset.k * dur * 1000 / 3));
  });

  if (cap) cap.innerHTML = KIND !== 'mesh' ? 'The dots show the real direction of each current.'
    : name === 'cw' ? 'Each mesh current is drawn clockwise to start with.'
      : flow.neg.length ? `${listJoin(flow.neg.map(k => VH('i' + k)))} came out negative, so it really flows anticlockwise.` : 'Every mesh current came out positive: it really flows clockwise.';
}
// show the first n steps (in Guided / On my own, markSteps also shows the pending ones as titles)
function reveal(n) {
  shown = Math.max(0, Math.min($$('ol.steps>li').length, n));
  const li = markSteps(shown);
  if (!stg) {
    $('#cnt').textContent = `${shown} of ${li.length} steps shown`;
    $('#nx').disabled = shown >= li.length; $('#hide').disabled = shown === 0; $('#all').disabled = shown >= li.length;
  }

  drawCkt();

    const rp = $('#replay'); if (rp) rp.hidden = false;
  }
  if (!stg && n > 0 && li[shown - 1] && n === shown && n !== li.length) li[shown - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---------------------------------------------------------------- views
function setView(v) {
  view = v; pinned = null;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const M = $('main');
  const many = GROUPS.length > 1;
  if (v === 'method') {
    const cards = methodOf(mGroup);
    M.innerHTML = (many ? `<div class="card gbar">${GROUPS.map(g => `<button class="gb${g === mGroup ? ' on' : ''}" data-g="${g.id}">${g.name}</button>`).join('')}</div>` : '') +
      `<div class="mgrid">${cards.map((s, i) => `<div class="card scope"><h2>${s.title}</h2>${s.spec ? `<div class="mc" data-i="${i}"></div>` : ''}${s.html}</div>`).join('')}</div>`;
    $$('.gb').forEach(b => { b.onclick = () => { mGroup = GROUPS.find(g => g.id === b.dataset.g); setView('method'); }; });
    const k = mGroup.kind, sk = PLAIN(k) ? k : 'th';
    $$('.mc').forEach(d => { const s = cards[+d.dataset.i]; const net = buildNet(s.spec); d.innerHTML = svgNet(net, sk, { ...(PLAIN(k) ? overlays(net, k) : {}), ...(s.opt || {}) }); const svg = $('svg', d); if (k === 'nodal') svg.classList.add('colour'); if (s.over) svg.classList.add('over'); });

    const row = (l, li) => `<div class="level" data-lv="${li}"><div class="lname"><span class="lnum">${li + 1}</span><span>${l.name}<small>${l.blurb}</small></span></div>${TOPIC.questions.map((q, i) => [q, i]).filter(([q]) => q.level === l.id).map(([q, i]) => `<button class="qbtn" data-i="${i}">Q${i + 1} · ${q.title}</button>`).join('')}</div>`;
    M.innerHTML = `<div class="card levels">${many ? `<div class="gbar">Jump to: ${GROUPS.map(g => `<button class="gj" data-g="${g.id}">${g.name}</button>`).join('')}</div>` : ''}
      ${GROUPS.map(g => `<div class="grp" id="g-${g.id}">${many ? `<h2>${g.name}</h2>` : ''}${g.levels.map(row).join('')}</div>`).join('')}
      <p class="muted">Every question is open: start anywhere. ${many ? 'Inside each topic they' : 'They'} get harder from top to bottom.</p></div><div id="qbox"></div>`;
    $$('.qbtn').forEach(b => { b.onclick = () => openQ(+b.dataset.i); });
    $$('.gj').forEach(b => { b.onclick = () => { const i = TOPIC.questions.findIndex(q => lvOf(q.level).group.id === b.dataset.g); $('#g-' + b.dataset.g).scrollIntoView({ block: 'start', behavior: 'smooth' }); if (i >= 0) openQ(i, true); }; });
    openQ(TOPIC.questions.indexOf(curQ) >= 0 ? TOPIC.questions.indexOf(curQ) : 0, true);
  } else {
    M.innerHTML = `<div class="card gen">${many ? `<div class="gbar"><b>Topic:</b> ${GROUPS.map(g => `<button class="gpb" data-g="${g.id}">${g.name}</button>`).join('')}</div>` : ''}
      <div class="gbar"><b>Difficulty:</b> <span id="lvs"></span>
      <button class="primary" id="go">Generate question</button>
      <span class="code" id="code"></span>
      <span style="margin-left:auto"></span><input id="cin" placeholder="question code" aria-label="question code"><button id="cgo">Load</button></div></div>
      <p class="muted">Each question is new: the circuit is drawn from the chosen level and the values are picked so that the answers come out as friendly numbers. The solution is worked out step by step, the same way as in the question bank. Share the code to give a classmate the same question.</p><div id="qbox"></div>`;
    const mark = () => {
      $$('.gpb').forEach(b => b.classList.toggle('on', b.dataset.g === genGroup.id));
      $('#lvs').innerHTML = genGroup.levels.map((l, li) => `<button class="lvb${l.id === genLevel ? ' on' : ''}" data-lv="${li}" data-l="${l.id}" title="${l.blurb}">${l.name}</button>`).join(' ');
      $$('.lvb').forEach(b => { b.onclick = () => { genLevel = b.dataset.l; mark(); }; });
    };
    $$('.gpb').forEach(b => { b.onclick = () => { genGroup = GROUPS.find(g => g.id === b.dataset.g); if (!genGroup.levels.some(l => l.id === genLevel)) genLevel = genGroup.levels[Math.min(1, genGroup.levels.length - 1)].id; mark(); }; });
    mark();
    $('#go').onclick = () => gen(genLevel, Math.floor(Math.random() * 90000) + 10000);
    $('#cgo').onclick = () => {
      const m = /^\s*([A-Za-z]+\d*)-(\d+)\s*$/.exec($('#cin').value), lv = m && LEVELS.find(l => l.code.toLowerCase() === m[1].toLowerCase());
      if (lv) { genGroup = lv.group; genLevel = lv.id; mark(); gen(lv.id, +m[2]); } else $('#code').textContent = `Code not recognised (example: ${LEVELS[1].code}-12345)`;
    };
  }
}
function openQ(i, quiet) {
  const q = TOPIC.questions[i];
  $$('.qbtn').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  renderQ($('#qbox'), q, `Question ${i + 1}: ${q.title}`);
  if (!quiet) $('#qbox').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function gen(level, seed) {
  const lv = lvOf(level);
  let q;
  try { q = generate(TOPIC, level, seed); } catch (e) { $('#qbox').innerHTML = `<p class="bad">Could not make a question this time. Click Generate again.</p>`; return; }
  $('#code').textContent = `Code: ${lv.code}-${seed}`;
  renderQ($('#qbox'), q, `Practice question (${lv.group.name ? lv.group.name + ', ' : ''}${lv.name})`);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !$('#nx')) return;
  if (e.key === 'ArrowRight') reveal(shown + 1); if (e.key === 'ArrowLeft') reveal(shown - 1);
});
$$('nav.tabs button').forEach(b => { b.onclick = () => setView(b.dataset.v); });
setView('questions');

</script>
</body>
