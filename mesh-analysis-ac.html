<script>
'use strict';
// Shared engine for the phasor nodal / mesh analysis pages: exact fractions, exact complex numbers,
// linear expressions, a ladder-shaped netlist of impedances, an independent MNA solver, the SVG drawing
// and the step-by-step solution writer. Every number the steps print is derived by the step writer itself
// and then compared with the MNA solution.

// ===================================================================== exact fractions
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a / gcd(a, b) * b);
class Fr {
  constructor(n, d = 1) {
    if (!Number.isFinite(n) || !Number.isFinite(d) || d === 0) throw Error('bad fraction');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d); this.n = n / g; this.d = d / g;
    if (Math.abs(this.n) > 1e12 || this.d > 1e12) throw Error('fraction overflow');
  }
  static of(x) {
    if (x instanceof Fr) return x;
    if (Number.isInteger(x)) return new Fr(x, 1);
    let d = 1; while (Math.abs(x * d - Math.round(x * d)) > 1e-9 && d < 1e6) d *= 10;
    return new Fr(Math.round(x * d), d);
  }
  add(o) { o = F(o); return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return this.add(F(o).neg()); }
  mul(o) { o = F(o); return new Fr(this.n * o.n, this.d * o.d); }
  div(o) { o = F(o); if (!o.n) throw Error('divide by zero'); return new Fr(this.n * o.d, this.d * o.n); }
  neg() { return new Fr(-this.n, this.d); }
  abs() { return new Fr(Math.abs(this.n), this.d); }
  get z() { return this.n === 0; }
  isInt() { return this.d === 1; }
  val() { return this.n / this.d; }
  eq(o) { o = F(o); return this.n === o.n && this.d === o.d; }
  sign() { return Math.sign(this.n); }
}
const F = x => Fr.of(x);

// ===================================================================== exact complex numbers  re + j·im
class Cx {
  constructor(re, im = 0) { this.re = F(re); this.im = F(im); }
  static of(x) { if (x instanceof Cx) return x; if (Array.isArray(x)) return new Cx(x[0], x[1]); return new Cx(x, 0); }
  add(o) { o = C(o); return new Cx(this.re.add(o.re), this.im.add(o.im)); }
  sub(o) { o = C(o); return new Cx(this.re.sub(o.re), this.im.sub(o.im)); }
  mul(o) { o = C(o); return new Cx(this.re.mul(o.re).sub(this.im.mul(o.im)), this.re.mul(o.im).add(this.im.mul(o.re))); }
  div(o) { o = C(o); const d = o.n2(); if (d.z) throw Error('divide by zero'); const t = this.mul(o.conj()); return new Cx(t.re.div(d), t.im.div(d)); }
  neg() { return new Cx(this.re.neg(), this.im.neg()); }
  conj() { return new Cx(this.re, this.im.neg()); }
  n2() { return this.re.mul(this.re).add(this.im.mul(this.im)); }            // |z|²
  get z() { return this.re.z && this.im.z; }
  get real() { return this.im.z; }
  get imag() { return this.re.z && !this.im.z; }
  get d() { return lcm(this.re.d, this.im.d); }
  eq(o) { o = C(o); return this.re.eq(o.re) && this.im.eq(o.im); }
  isInt() { return this.re.isInt() && this.im.isInt(); }
  sign() { return this.re.z ? this.im.sign() : this.re.sign(); }             // the sign written in front
  abs() { return this.sign() < 0 ? this.neg() : this; }                       // without the sign in front
  mag() { return Math.hypot(this.re.val(), this.im.val()); }
  deg() { return Math.atan2(this.im.val(), this.re.val()) * 180 / Math.PI; }
}
const C = x => Cx.of(x);
const J = C([0, 1]);

// ===================================================================== linear expressions  (sum of c·var + const, complex c)
class LE {
  constructor(k = new Map(), c = C(0)) { this.k = k; this.c = c; }
  static v(name, co = 1) { return C(co).z ? LE.n(0) : new LE(new Map([[name, C(co)]])); }
  static n(x) { return new LE(new Map(), C(x)); }
  clone() { return new LE(new Map(this.k), this.c); }
  add(o) {
    const r = this.clone();
    for (const [v, c] of o.k) { const s = (r.k.get(v) || C(0)).add(c); if (s.z) r.k.delete(v); else r.k.set(v, s); }
    r.c = r.c.add(o.c); return r;
  }
  sub(o) { return this.add(o.scale(-1)); }
  scale(s) { s = C(s); const r = new LE(new Map(), this.c.mul(s)); if (s.z) return r; for (const [v, c] of this.k) r.k.set(v, c.mul(s)); return r; }
  subst(v, e) {            // replace var v by expression e, keeping the place of v in the written order
    if (!this.k.has(v)) return this;
    const cv = this.k.get(v), r = new LE(new Map(), this.c.add(e.c.mul(cv)));
    const put = (x, c) => { const s = (r.k.get(x) || C(0)).add(c); if (s.z) r.k.delete(x); else r.k.set(x, s); };
    for (const [x, cx] of this.k) { if (x === v) for (const [y, cy] of e.k) put(y, cy.mul(cv)); else put(x, cx); }
    return r;
  }
  co(v) { return this.k.get(v) || C(0); }
  vars() { return [...this.k.keys()]; }
  get isConst() { return this.k.size === 0; }
  get parts() { return this.k.size + (this.c.z ? 0 : 1); }
  at(vals) { let s = this.c; for (const [v, c] of this.k) { if (!(v in vals)) throw Error('no value for ' + v); s = s.add(c.mul(vals[v])); } return s; }
  first(v) { if (!this.k.has(v)) return this; const r = new LE(new Map([[v, this.k.get(v)]]), this.c); for (const [x, c] of this.k) if (x !== v) r.k.set(x, c); return r; }
  sorted() { const r = new LE(new Map(), this.c); [...this.k.keys()].sort(vcmp).forEach(v => r.k.set(v, this.k.get(v))); return r; }
}
const vcmp = (a, b) => (a.length - b.length) || (a < b ? -1 : a > b ? 1 : 0);

// solve LE = 0 equations for the listed vars (Gauss-Jordan by substitution); throws if singular
function solveLin(eqs, vars) {
  eqs = eqs.slice(); const sol = [];
  for (const v of vars) {
    const i = eqs.findIndex(e => !e.co(v).z);
    if (i < 0) throw Error('singular system');
    const e = eqs.splice(i, 1)[0], c = e.co(v);
    const ex = e.sub(LE.v(v, c)).scale(C(-1).div(c));
    eqs = eqs.map(q => q.subst(v, ex)); sol.forEach(s => { s[1] = s[1].subst(v, ex); }); sol.push([v, ex]);
  }
  eqs.forEach(e => { if (!e.isConst || !e.c.z) throw Error('inconsistent system'); });
  const r = {}; sol.forEach(([v, ex]) => { if (!ex.isConst) throw Error('underdetermined'); r[v] = ex.c; }); return r;
}

// ===================================================================== number / symbol formatting
const MINUS = '−';
function fnum(f) {
  f = F(f);
  if (f.d === 1) return (f.n < 0 ? MINUS : '') + Math.abs(f.n);
  let d = f.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5;
  if (d === 1) { const s = String(Math.abs(f.val())); if (s.length <= 7) return (f.n < 0 ? MINUS : '') + s; }
  return (f.n < 0 ? MINUS : '') + Math.abs(f.n) + '/' + f.d;
}
const fnP = f => (F(f).sign() < 0 ? '(' + fnum(f) + ')' : fnum(f));               // negative numbers in brackets
const fnB = f => { const s = fnum(f); return s.includes('/') ? '(' + s + ')' : s; };  // fractions in brackets
// rectangular form a + jb.  unit: write j rather than j1 (a number in front of an unknown)
function cnum(c, unit) {
  c = C(c); const r = c.re, i = c.im;
  if (i.z) return fnum(r);
  const js = 'j' + (unit && i.abs().eq(1) ? '' : fnB(i.abs()));
  if (r.z) return (i.sign() < 0 ? MINUS : '') + js;
  return fnum(r) + (i.sign() < 0 ? ' − ' : ' + ') + js;
}
const cP = c => { c = C(c); return c.real && c.re.sign() >= 0 ? cnum(c) : '(' + cnum(c) + ')'; };    // brackets unless a plain positive number
const cB = c => { c = C(c); return c.real || c.imag ? cnum(c) : '(' + cnum(c) + ')'; };               // brackets round a two-part number
const cU = c => { c = C(c); return c.real || c.imag ? cnum(c, true) : '(' + cnum(c, true) + ')'; };     // the same, j for j1 (a divisor)
const denH = z => { z = C(z); return z.real ? fnB(z.re) : '(' + cnum(z) + ')'; };                     // after a "/"
const zH = z => { z = C(z); if (z.eq(1)) return ''; if (z.real) return fnB(z.re); return z.imag && z.im.sign() > 0 ? cnum(z) : '(' + cnum(z) + ')'; };
function sf3(x) { if (Math.abs(x) < 1e-12) return '0'; const v = Number(x.toPrecision(3)); return (v < 0 ? MINUS : '') + Math.abs(v); }
function angS(a) { if (a <= -180 + 1e-9) a += 360; return Math.abs(a - Math.round(a)) < 1e-6 ? (a < -1e-9 ? MINUS : '') + Math.abs(Math.round(a)) : sf3(a); }
function magS(m) { return Math.abs(m - Math.round(m)) < 1e-9 ? String(Math.round(m)) : sf3(m); }
function cpol(c) { c = C(c); if (c.z) return '0'; return magS(c.mag()) + '∠' + angS(c.deg()) + '°'; }
function cans(c, unit) { c = C(c); const s = cnum(c) + ' ' + unit; return c.z || (c.real && c.re.sign() > 0) ? s : s + ' = ' + cpol(c) + ' ' + unit; }
const coefH = a => { a = C(a); if (a.eq(1)) return ''; if (a.real) return fnB(a.re); if (a.imag) return 'j' + (a.im.abs().eq(1) ? '' : fnB(a.im.abs())); return '(' + cnum(a, true) + ')'; };
// a × b written as juxtaposition: j20(2 − j1), 4(3 + j2), (2 + j)(1 − j)
const prodH = (a, b) => { a = C(a); b = C(b); if (a.eq(1)) return cP(b); const ah = (a.real || a.imag) && a.sign() > 0 ? cnum(a, true) : '(' + cnum(a, true) + ')'; return ah + (b.real && b.sign() > 0 ? ' × ' + cnum(b) : '(' + cnum(b, true) + ')'); };

    ctx.eqs.forEach(E => { let q = E.q; kv.forEach(v => { if (hasVar(q, v)) q = substEq(q, v, LE.n(ctx.known[v])); }); if (q !== E.q) { lines.push({ how: `${E.name}:`, eq: eqH(q) }); E.q = q; } });
    ctx.cons.forEach(C_ => { let q = C_.q; kv.forEach(v => { if (hasVar(q, v)) q = substEq(q, v, LE.n(ctx.known[v])); }); C_.q = q; });
    if (lines.length) S.push({ title: 'Put in the known value' + (kv.length > 1 ? 's' : ''), say: `Replace ${listJoin(kv.map(v => `${VH(v)} by ${cnum(ctx.known[v])}`))} wherever it appears.`, lines });
  }
  // 2. dependent sources: write the controlling quantity with the unknowns, then substitute
  if (net.ctrl && (ctx.eqs.some(E => hasSym(E.q)) || ctx.cons.some(C_ => hasSym(C_.q)))) {
    const X = net.ctrl, d = ctx.ctrlDef, lines = [];
    let dex = d.ex; kv.forEach(v => { dex = dex.subst(v, LE.n(ctx.known[v])); });
    lines.push({ how: d.how, eq: `${ctrlH(net)} = ${wrapT(X.id, d.html)}` });
    if (dex !== d.ex) lines.push({ how: 'Put in the known value:', eq: `${ctrlH(net)} = ${wrapT(X.id, (tSign(Tm({ k: d.ck, ex: dex, den: d.den, zk: d.zk, bare: true, keep: true })) < 0 ? MINUS : '') + core(Tm({ k: d.ck, ex: dex, den: d.den, zk: d.zk, bare: d.ck.eq(1) && d.den.eq(1), keep: true })))}` });
    const swap = q => { const r = mapT(q, t => (t.sym ? { ...t, dep: { ...t.dep, ex: dex } } : t)); return depEq(r); };
    ctx.eqs.forEach(E => { if (hasSym(E.q)) { E.q = swap(E.q); lines.push({ how: `Substitute into ${E.name}:`, eq: eqH(E.q) }); } });
    ctx.cons.forEach(C_ => { if (hasSym(C_.q)) { C_.q = swap(C_.q); C_.depDone = true; } });
    S.push({ title: 'Write the controlling quantity with the unknowns', say: ctx.ctrlSay, lines });
  }
  // 3. constraints: rearrange each for one unknown and substitute it everywhere
  const isol = [];
  ctx.cons.forEach((Cn, ci) => {
    const lines = [{ how: Cn.how, eq: eqH(Cn.q0) }];
    if (eqH(Cn.q) !== eqH(Cn.q0)) lines.push({ how: Cn.depDone ? 'Put in the expression for the controlling quantity (and any known values):' : 'Put in the known value:', eq: eqH(Cn.q) });
    isol.forEach(([v, ex]) => { if (hasVar(Cn.q, v)) { Cn.q = substEq(Cn.q, v, ex); lines.push({ how: `Use ${VH(v)} = ${leH(ex, true)} here too:`, eq: eqH(Cn.q) }); } });
    let e = LE.n(0); Cn.q.L.forEach(t => { e = e.add(tVal(t)); }); Cn.q.R.forEach(t => { e = e.sub(tVal(t)); });
    const free = e.vars().filter(v => ctx.unknowns.includes(v));
    if (!free.length) throw Error('constraint with no unknown');
    const ones = free.filter(v => e.co(v).abs().eq(1));
    const w = (ones.length ? ones : free).slice().sort(vcmp).pop();
    const cw = e.co(w), ex = e.sub(LE.v(w, cw)).scale(C(-1).div(cw));
    for (const c of ex.k.values()) if (!c.isInt()) meta.frac = true;
    if (!ex.c.isInt()) meta.frac = true;
    lines.push({ how: `Rearrange to get ${VH(w)} on its own` + (cw.abs().eq(1) ? '.' : ` (divide every term by ${cnum(cw, true)}).`), eq: `${VH(w)} = ${leH(ex, true)}` });
    isol.forEach(s => { s[1] = s[1].subst(w, ex); });
    isol.push([w, ex]);
    const sl = [];
    ctx.eqs.forEach(E => { if (hasVar(E.q, w)) { E.q = substEq(E.q, w, ex); sl.push({ how: `Substitute ${VH(w)} = ${leH(ex, true)} into ${E.name}:`, eq: eqH(E.q) }); } });
    ctx.cons.slice(ci + 1).forEach(D => { if (hasVar(D.q, w)) D.q = substEq(D.q, w, ex); });
    S.push({ title: Cn.title, say: Cn.say, lines: lines.concat(sl) });
  });
  const left = ctx.unknowns.filter(v => !isol.some(s => s[0] === v));
  if (left.length !== ctx.eqs.length) throw Error(`unknowns ${left.length} vs equations ${ctx.eqs.length}`);
  // 4. tidy every equation into standard form
  const std = ctx.eqs.map((E, i) => {
    const t = tidy(E.q, meta);
    S.push({ title: `Tidy ${E.name} into equation (${i + 1})`, say: 'Now only numbers and unknowns are left. Tidy the equation one move at a time.', lines: t.lines.concat([{ how: 'Label it:', eq: `${stdH(t.e, t.c)} &nbsp; … (${i + 1})` }]) });
    return t;
  });
  std.forEach(t => t.e.vars().forEach(v => { if (!left.includes(v)) throw Error('stray variable ' + v); }));
  // 5. solve
  const sol = solveStd(std, left.slice().sort(vcmp), meta);
  S.push({ title: std.length === 1 ? 'Solve the equation' : 'Solve the two equations', say: std.length === 1 ? 'One equation, one unknown.' : 'Two equations, two unknowns.', lines: sol.lines });
  const vals = { ...ctx.known, ...sol.vals };
  // 6. back-substitute the isolated unknowns
  if (isol.length) {
    const lines = [];
    isol.slice().reverse().forEach(([w, ex]) => {
      const ps = [...ex.k].map(([v, c]) => [c, vals[v]]);
      let shown = ps.map(([c, x], i) => { const neg = c.sign() < 0, a = c.abs(); return (i ? (neg ? ' − ' : ' + ') : (neg ? MINUS : '')) + (a.eq(1) ? cP(x) : prodH(a, x)); }).join('');
      shown = (ex.c.z ? '' : cnum(ex.c) + (ps.length ? ' ' : '')) + (ex.c.z ? shown : shown.replace(/^−/, '− ').replace(/^(?![− ])/, '+ '));
      const prods = ps.map(([c, x]) => c.mul(x));
      vals[w] = ex.at(vals);
      if (ex.isConst) { lines.push({ how: '', eq: `${VH(w)} = <b>${cnum(vals[w])}</b>` }); return; }
      const mid = (ex.c.z ? '' : cnum(ex.c)) + prods.map((p, i) => constH(p, ex.c.z && i === 0)).join('');
      lines.push({ how: `Use ${VH(w)} = ${leH(ex, true)}:`, eq: `${VH(w)} = ${shown}${mid !== shown ? ' = ' + mid : ''} = <b>${cnum(vals[w])}</b>` });
    });
    S.push({ title: 'Back-substitute', say: 'Put the answer into the rearranged equation to find the last unknown.', lines });
  }
  return vals;
}

// ===================================================================== NODAL ANALYSIS
function nodalSteps(net, q) {
  const S = [], meta = {};
  const nodes = net.nodes.filter(n => !n.gnd);
  const vl = n => (n.gnd ? LE.n(0) : LE.v(n.v));
  const nn = n => (n.gnd ? 'the reference node' : `node ${n.num}`);
  if (net.els.some(e => e.pos === 'bot')) throw Error('nodal needs a plain bottom wire');
  phasorStep(net, S);
  // controlling quantity
  let ctrlDef = null;
  if (net.ctrl) {
    const X = net.ctrl, ex = vl(X.na).sub(vl(X.nb));
    ctrlDef = X.x === 'v'
      ? { ex, den: C(1), ck: C(1), html: (tSign(Tm({ ex, bare: true, keep: true })) < 0 ? MINUS : '') + core(Tm({ ex, bare: true, keep: true })), how: `${ctrlH(net)} is the voltage across ${X.name}, + end minus − end:` }
      : { ex, den: X.Z, ck: C(1), html: core(Tm({ ex, den: X.Z, keep: true })), how: `${ctrlH(net)} is the current in ${X.name} in the direction of its arrow. Ohm's law: (voltage at the tail − voltage at the head) ÷ Z:` };
  }
  // 1. reference node and names
  S.push({ title: 'Choose the reference node and name the nodes', say: `Colour the wires: one colour = one node. Take the bottom wire as the <b>reference node</b> (0 V) because the most elements join there. Name the other nodes ${listJoin(nodes.map(n => VH(n.v)))}: each node voltage is a phasor measured from the reference.`, lines: [] });
  // 2. known nodes
  const known = {}, kl = [];
  const fixed = n => n.gnd || n.v in known;
  let more = true;
  while (more) {
    more = false;
    net.els.filter(e => e.t === 'V').forEach(e => {
      const fa = fixed(e.na), fb = fixed(e.nb);
      if (fa === fb) return;
      const kn = fa ? e.nb : e.na, other = fa ? e.na : e.nb;
      const val = fa ? (e.na.gnd ? C(0) : known[e.na.v]).sub(e.v) : (e.nb.gnd ? C(0) : known[e.nb.v]).add(e.v);
      known[kn.v] = val; more = true;
      const plus = e.na === kn ? nn(kn) : nn(other);
      kl.push({ how: other.gnd ? `${elHv(e, net)} joins ${nn(kn)} to the reference, with its + end at ${plus}. So it holds ${nn(kn)} at ${cnum(val)} V.`
        : `${elHv(e, net)} joins ${nn(kn)} to ${nn(other)}, which is already known, with its + end at ${plus}. So ${VH(kn.v)} = ${VH(other.v)} ${e.na === kn ? '+' : '−'} ${cB(e.v)}.`,
      eq: wrapT(e.id, `${VH(kn.v)} = ${other.gnd ? '' : `${cP(known[other.v])} ${e.na === kn ? '+' : '−'} ${cB(e.v)} = `}${cnum(val)} V`) });
    });
  }
  const unknowns = nodes.filter(n => !(n.v in known)).map(n => n.v);
  // groups: nodes joined by voltage-type elements
  const par = {}; net.nodes.forEach(n => { par[n.r] = n.r; });
  const find = r => (par[r] === r ? r : (par[r] = find(par[r])));
  net.els.filter(isV).forEach(e => { par[find(e.na.r)] = find(e.nb.r); });
  const comps = {}; net.nodes.forEach(n => { (comps[find(n.r)] = comps[find(n.r)] || []).push(n); });
  const groups = Object.values(comps).filter(g => !g.some(n => fixed(n)));
  const cons = net.els.filter(e => isV(e) && !(fixed(e.na) && fixed(e.nb)));
  S.push({ title: 'Which node voltages are already known?', say: kl.length ? 'A voltage source joined to the reference (or to a known node) fixes the voltage of the node at its other end.' : 'No voltage source is joined straight to the reference, so no node voltage is known yet.',
    lines: kl.concat([{ how: `Unknowns left: ${unknowns.length ? listJoin(unknowns.map(VH)) : 'none'}. We need <b>${unknowns.length} equation${unknowns.length === 1 ? '' : 's'}</b>.`, eq: '' }]) });
  if (unknowns.length > 2) throw Error('more than 2 unknowns');
  if (!unknowns.length) throw Error('no unknowns');
  // 3. supernodes
  const sup = groups.filter(g => g.length > 1);
  sup.forEach(g => {
    const srcs = net.els.filter(e => isV(e) && g.includes(e.na) && g.includes(e.nb));
    const inside = net.els.filter(e => !isV(e) && g.includes(e.na) && g.includes(e.nb));
    S.push({ title: 'Spot the supernode', say: `${listJoin(srcs.map(e => wrapT(e.id, elHv(e, net))))} sits between ${listJoin(g.map(nn))}, and neither is the reference. The current through a voltage source cannot be written with Ohm's law, so draw a bubble round both nodes and the source: a <b>supernode</b>. It gives <b>one KCL equation</b> (round the bubble) and <b>one equation from the source</b>.` +
      (inside.length ? ` ${listJoin(inside.map(e => wrapT(e.id, e.name)))} joins two nodes inside the bubble, so its current never crosses the dashed line: leave it out of the bubble KCL.` : ''), lines: [] });
  });
  // 4. KCL for each group
  const eqs = [];
  groups.forEach(g => {
    const L = [], R = [];
    net.els.forEach(e => {
      const ia = g.includes(e.na), ib = g.includes(e.nb);
      if (ia === ib || isV(e)) return;
      const n = ia ? e.na : e.nb, o = ia ? e.nb : e.na;
      if (isP(e)) { R.push(Tm({ el: e.id, ex: vl(n).sub(vl(o)).first(n.v), den: e.Z })); return; }
      const into = ia;                       // the source pushes current out of terminal a, i.e. into node a
      const t = e.t === 'I' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } });
      (into ? L : R).push(t);
    });
    const name = g.length > 1 ? 'the supernode KCL' : `the KCL at node ${g[0].num}`;
    eqs.push({ name, q: { L, R }, q0: { L, R }, g });
    S.push({ title: g.length > 1 ? 'KCL round the supernode' : `KCL at node ${g[0].num}`,
      say: (g.length > 1 ? 'Count only the currents that cross the dashed line. ' : `Stand at node ${g[0].num}. `) + 'Current <b>in</b> = current <b>out</b>. Write every impedance current as <b>leaving</b> the node: (V<sub>this node</sub> − V<sub>other end</sub>) ÷ Z, with Z = R, jX<sub>L</sub> or −jX<sub>C</sub>. A source arrow pointing in is current in.' +
        (L.length ? '' : ' Nothing is drawn as flowing in, so the left-hand side is 0.'),
      lines: [{ how: 'in = out', eq: eqH({ L, R }) }] });
  });
  // constraints from voltage sources between unknown nodes
  const Cs = cons.map(e => {
    const lhs = vl(e.na).sub(vl(e.nb)).first(e.na.v || e.nb.v);
    const L = [Tm({ el: e.id, ex: lhs, bare: true, keep: true })];
    const R = [e.t === 'V' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck } })];
    const q0 = { L, R };
    return { el: e.id, q0, q: q0, title: 'Use the voltage source', how: '(+ end) − (− end) = source voltage',
      say: `${wrapT(e.id, elHv(e, net))} fixes the difference between its two nodes: the voltage at its + end minus the voltage at its − end equals the source voltage.` };
  });
  const ctrlSay = net.ctrl ? `The dependent source depends on ${ctrlH(net)}. Write ${ctrlH(net)} with node voltages, then put that into the equation${eqs.length + Cs.length > 1 ? 's' : ''}.` : '';
  const vals = pipeline({ kind: 'nodal', S, net, eqs, cons: Cs, known, unknowns, ctrlDef, ctrlSay, meta });
  // compare with the independent solution
  const M = mna(net);
  nodes.forEach(n => { if (!vals[n.v] || !vals[n.v].eq(M.v[n.v])) throw Error(`mismatch at ${n.v}`); });
  polarStep(net, S, unknowns, vals, 'nodal');
  const res = results(net, q, S, vals, M, 'nodal', { eqs, C: Cs, ctrlDef });
  return { steps: S, unknowns, vals, M, meta, answers: res.answers };
}

// ===================================================================== MESH ANALYSIS
function meshSteps(net, q) {
  const S = [], meta = {}, m = net.ncol - 1;
  if (net.arch) throw Error('mesh analysis needs a planar ladder');
  const iv = k => (k >= 1 && k <= m ? LE.v('i' + k) : LE.n(0));
  const mvars = Array.from({ length: m }, (_, k) => 'i' + (k + 1));
  // current a→b through each element, written with mesh currents
  const iab = e => {
    let base;
    if (e.pos === 'col') base = iv(e.j).sub(iv(e.j + 1));              // downward
    else if (e.pos === 'top') base = iv(e.j + 1);                       // to the right
    else base = iv(e.j + 1).scale(-1);                                  // bottom: to the right
    const p = net.P[e.a], r = net.P[e.b];
    const fwd = e.pos === 'col' ? r.y > p.y : r.x > p.x;
    return fwd ? base : base.scale(-1);
  };
  const meshesOf = e => iab(e).vars();
  phasorStep(net, S);
  let ctrlDef = null;
  if (net.ctrl) {
    const X = net.ctrl, ex = iab(X);
    const first = ex.vars().find(v => ex.co(v).sign() > 0); const exo = first ? ex.first(first) : ex;
    const sg = tSign(Tm({ ex: exo, bare: true, keep: true })) < 0 ? MINUS : '';
    ctrlDef = X.x === 'i'
      ? { ex: exo, den: C(1), ck: C(1), html: sg + core(Tm({ ex: exo, bare: true, keep: true })), how: `${ctrlH(net)} is the current in ${X.name} in the direction of its arrow. Add the mesh currents that flow that way and subtract those that flow against it:` }
      : { ex: exo, den: C(1), ck: X.Z, zk: true, html: core(Tm({ ex: exo, k: X.Z, zk: true, keep: true })), how: `${ctrlH(net)} is the voltage across ${X.name} (+ end minus − end) = Z × (current from + to −):` };
  }
  S.push({ title: 'Draw the mesh currents', say: `A mesh is a window of the circuit with no other loop inside it. This circuit has <b>${m} mesh${m > 1 ? 'es' : ''}</b>. Draw one <b>clockwise</b> current phasor in each: ${listJoin(mvars.map(VH))}.`, lines: [] });
  // current sources
  const known = {}, kl = [], consEls = [];
  const par = {}; mvars.forEach(v => { par[v] = v; });
  const find = v => (par[v] === v ? v : (par[v] = find(par[v])));
  net.els.filter(isI).forEach(e => {
    const ms = meshesOf(e);
    if (ms.length === 2) { par[find(ms[0])] = find(ms[1]); consEls.push(e); return; }
    const v = ms[0], arrow = iab(e).scale(-1), co = arrow.co(v);        // current in the arrow direction = co · i_k
    if (e.t === 'I') {
      known[v] = e.v.div(co);
      kl.push({ how: `${elHv(e, net)} is on an outside branch of mesh ${v.slice(1)}, so ${VH(v)} is the only mesh current through it. ${VH(v)} flows ${co.sign() > 0 ? 'the same way as' : 'against'} the source arrow there.`, eq: wrapT(e.id, `${VH(v)} = ${cnum(known[v])} A`) });
    } else consEls.push(e);
  });
  const fixedMesh = new Set(net.els.filter(isI).filter(e => meshesOf(e).length === 1).map(e => meshesOf(e)[0]));
  const unknowns = mvars.filter(v => !(v in known));
  S.push({ title: 'Which mesh currents are already known?', say: kl.length ? 'A current source on the outside edge of a mesh carries only that mesh current, so it fixes it.' : 'No current source sits on an outside edge, so no mesh current is known yet.',
    lines: kl.concat([{ how: `Unknowns left: ${listJoin(unknowns.map(VH))}. We need <b>${unknowns.length} equation${unknowns.length === 1 ? '' : 's'}</b>.`, eq: '' }]) });
  if (unknowns.length > 2) throw Error('more than 2 unknowns');
  if (!unknowns.length) throw Error('no unknowns');
  // groups of meshes joined by a shared current source = supermesh
  const comps = {}; mvars.forEach(v => { (comps[find(v)] = comps[find(v)] || []).push(v); });
  const groups = Object.values(comps).map(g => g.sort(vcmp)).filter(g => !g.some(v => fixedMesh.has(v)));
  groups.filter(g => g.length > 1).forEach(g => {
    const shared = consEls.filter(e => meshesOf(e).length === 2 && meshesOf(e).every(v => g.includes(v)));
    const series = net.els.filter(e => !isI(e) && e.pos === 'col' && shared.some(s => s.j === e.j));
    S.push({ title: 'Spot the supermesh', say: `${listJoin(shared.map(e => wrapT(e.id, elHv(e, net))))} is shared by ${listJoin(g.map(v => 'mesh ' + v.slice(1)))}. Its voltage is unknown, so KVL cannot be written round either mesh on its own. Join the two meshes into a <b>supermesh</b>: walk round the <b>outside</b> of both, skipping the shared branch. This gives <b>one KVL equation</b>; the source gives the second equation.` +
      (series.length ? ` ${listJoin(series.map(e => wrapT(e.id, e.name)))} is in series with the current source in the shared branch, so it is skipped too.` : ''), lines: [] });
  });
  // KVL round each group
  const eqs = [];
  groups.forEach(g => {
    const k1 = +g[0].slice(1), k2 = +g[g.length - 1].slice(1), seq = [];
    const colEls = j => net.els.filter(e => e.pos === 'col' && e.j === j).sort((a, b) => Math.min(net.P[a.a].y, net.P[a.b].y) - Math.min(net.P[b.a].y, net.P[b.b].y));
    colEls(k1 - 1).reverse().forEach(e => seq.push([e, 'up', 'i' + k1]));
    for (let k = k1; k <= k2; k++) net.els.filter(e => e.pos === 'top' && e.j === k - 1).forEach(e => seq.push([e, 'right', 'i' + k]));
    colEls(k2).forEach(e => seq.push([e, 'down', 'i' + k2]));
    for (let k = k2; k >= k1; k--) net.els.filter(e => e.pos === 'bot' && e.j === k - 1).forEach(e => seq.push([e, 'left', 'i' + k]));
    const L = [];
    seq.forEach(([e, dir, own]) => {
      const p = net.P[e.a], r = net.P[e.b];
      const ab = { up: r.y < p.y, down: r.y > p.y, right: r.x > p.x, left: r.x < p.x }[dir] ? 1 : -1;   // +1 when we walk from a to b
      if (isP(e)) { L.push(Tm({ el: e.id, k: e.Z, zk: true, ex: iab(e).scale(ab).first(own) })); return; }
      if (isI(e)) throw Error('current source on a KVL path');
      if (e.t === 'V') L.push(Tm({ el: e.id, sgn: ab, ex: LE.n(e.v) }));
      else L.push(Tm({ el: e.id, sgn: ab, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck, zk: ctrlDef.zk } }));
    });
    const name = g.length > 1 ? 'the supermesh KVL' : `the KVL for mesh ${k1}`;
    eqs.push({ name, q: { L, R: [] }, q0: { L, R: [] }, g });
    S.push({ title: g.length > 1 ? 'KVL round the supermesh' : `KVL round mesh ${k1}`,
      say: `Start at the bottom-left corner of ${g.length > 1 ? 'the supermesh' : `mesh ${k1}`} and walk <b>clockwise</b>. Add the voltage drop across each element you pass; the total back at the start is 0. An impedance gives Z × (current in the walking direction), with Z = R, jX<sub>L</sub> or −jX<sub>C</sub>: for a shared impedance that is Z(this mesh current − the other mesh current). A source gives the sign of the terminal you meet first.`,
      lines: [{ how: 'sum of voltage drops = 0', eq: eqH({ L, R: [] }) }] });
  });
  // constraints from current sources that are shared, or dependent ones on an outside edge
  const Cs = consEls.map(e => {
    const arrow = iab(e).scale(-1); const pos = arrow.vars().find(v => arrow.co(v).sign() > 0); const lhs = pos ? arrow.first(pos) : arrow;
    const L = [Tm({ el: e.id, ex: lhs, bare: true, keep: true })];
    const R = [e.t === 'I' ? Tm({ el: e.id, ex: LE.n(e.v) }) : Tm({ el: e.id, sym: depH(e, net), dep: { g: e.v, ex: ctrlDef.ex, den: ctrlDef.den, ck: ctrlDef.ck, zk: ctrlDef.zk } })];
    const q0 = { L, R };
    return { el: e.id, q0, q: q0, title: 'Use the current source', how: 'current in the direction of the arrow = source current',
      say: `${wrapT(e.id, elHv(e, net))} fixes the current in its branch. Add the mesh currents that flow the same way as its arrow and subtract those that flow against it.` };
  });
  const ctrlSay = net.ctrl ? `The dependent source depends on ${ctrlH(net)}. Write ${ctrlH(net)} with mesh currents, then put that into the equation${eqs.length + Cs.length > 1 ? 's' : ''}.` : '';
  const vals = pipeline({ kind: 'mesh', S, net, eqs, cons: Cs, known, unknowns, ctrlDef, ctrlSay, meta });
  const M = mna(net);
  mvars.forEach(v => { if (!vals[v] || !vals[v].eq(M.mesh[v])) throw Error(`mismatch at ${v}`); });
  polarStep(net, S, unknowns, vals, 'mesh');
  const res = results(net, q, S, vals, M, 'mesh', { eqs, C: Cs, ctrlDef, iab });
  return { steps: S, unknowns, vals, M, meta, answers: res.answers };
}

// ===================================================================== branch currents, extras, check
function results(net, q, S, vals, M, kind, X) {
  const answers = [];
  const ex = q.extras || [];
  const vOf = n => (n.gnd ? C(0) : vals[n.v]);
  const I = {};             // element current a→b, found by the steps
  const lines = [];
  if (kind === 'nodal') {
    net.els.filter(isP).forEach(e => {
      let a = e.na, b = e.nb, word = e.dirWord;
      if (a.gnd) { [a, b] = [b, a]; word = e.revWord; }
      const diff = vOf(a).sub(vOf(b)), i = diff.div(e.Z);
      I[e.id] = e.na === a ? i : i.neg();
      const sym = b.gnd ? `${VH(a.v)}/${denH(e.Z)}` : `(${VH(a.v)} − ${VH(b.v)})/${denH(e.Z)}`;
      const num = b.gnd ? '' : `[${cnum(vOf(a))} − ${cP(vOf(b))}]/${denH(e.Z)} = `;
      lines.push({ how: wrapT(e.id, `${e.name} (${e.label}), reference direction ${word}:`), eq: wrapT(e.id, `${sym} = ${num}${cB(diff)}/${denH(e.Z)} = <b>${cans(i, 'A')}</b>`) });
    });
    S.push({ title: 'Find the current in each element', say: 'Use I = (V<sub>tail</sub> − V<sub>head</sub>) ÷ Z with the node voltages, and divide in the same way as before (1/j = −j, or the conjugate).', lines });
  } else {
    net.els.forEach(e => {
      let le = X.iab(e); let word = e.dirWord;
      const pos = le.vars().find(v => le.co(v).sign() > 0);
      if (!pos) { le = le.scale(-1); word = e.revWord; }
      const p2 = le.vars().find(v => le.co(v).sign() > 0); le = le.first(p2);
      const i = le.at(vals); I[e.id] = X.iab(e).at(vals);
      if (!isP(e)) return;
      const shown = [...le.k].map(([v, c], k) => (k ? (c.sign() < 0 ? ' − ' : ' + ') : '') + cP(vals[v])).join('');
      lines.push({ how: wrapT(e.id, `${e.name} (${e.label})${le.k.size > 1 ? ', shared' : ''}, reference direction ${word}:`), eq: wrapT(e.id, `${leH(le)}${le.k.size > 1 ? ` = ${shown}` : ''} = <b>${cans(i, 'A')}</b>`) });
    });
    S.push({ title: 'Find the current in each element', say: 'An element on an outside edge carries one mesh current. A shared element carries the difference of the two mesh currents.', lines });
  }
  // the controlling quantity and the dependent source
  if (net.ctrl) {
    const d = X.ctrlDef, cv = d.ex.scale(d.ck.div(d.den)).at(vals);
    if (!cv.eq(M.ctrl)) throw Error('control mismatch');
    const dl = net.els.filter(isDep).map(e => ({ how: `${wrapT(e.id, 'The dependent source')}:`, eq: wrapT(e.id, `${depH(e, net)} = ${cnum(e.v)} × ${cP(cv)} = <b>${cans(e.v.mul(cv), depUnit(e))}</b>`) }));
    const ps = [...d.ex.k].map(([v, c]) => [c, vals[v]]);
    let mid = '';
    if (d.ck.eq(1) && d.den.eq(1)) mid = ps.map(([c, x], i) => { const neg = c.sign() < 0; return (i ? (neg ? ' − ' : ' + ') : (neg ? MINUS : '')) + (c.abs().eq(1) ? cP(x) : prodH(c.abs(), x)); }).join('') + ' = ';
    else if (d.ck.eq(1)) mid = `${cB(d.ex.at(vals))}/${denH(d.den)} = `;
    else mid = `${prodH(d.ck, d.ex.at(vals))} = `;
    S.push({ title: 'Value of the dependent source', say: `Put the answers into the expression for ${ctrlH(net)}.`, lines: [{ how: '', eq: `${ctrlH(net)} = ${wrapT(net.ctrl.id, d.html)} = ${mid}<b>${cans(cv, net.ctrl.x === 'i' ? 'A' : 'V')}</b>` }].concat(dl) });
    answers.push({ v: 'x', html: ctrlH(net), val: cv, unit: net.ctrl.x === 'i' ? 'A' : 'V' });
  }
  const ctrlV = net.ctrl ? X.ctrlDef.ex.scale(X.ctrlDef.ck.div(X.ctrlDef.den)).at(vals) : null;
  const srcVal = e => (isDep(e) ? e.v.mul(ctrlV) : e.v);
  const need = ex.includes('power');
  if (kind === 'nodal') {
    net.els.filter(isV).forEach(e => {
      if (!(need || ex.includes('isrc'))) return;
      const cand = [e.na, e.nb].filter(n => !n.gnd && net.els.filter(f => isV(f) && (f.na === n || f.nb === n)).length === 1);
      if (!cand.length) throw Error('cannot find the source current');
      const n = cand[0], outT = []; let sum = C(0);
      net.els.forEach(f => {
        if (f === e || (f.na !== n && f.nb !== n)) return;
        let leave;
        if (I[f.id] !== undefined) leave = f.na === n ? I[f.id] : I[f.id].neg();
        else if (isI(f)) leave = f.na === n ? srcVal(f).neg() : srcVal(f);
        else throw Error('unknown current');
        outT.push(wrapT(f.id, cB(leave))); sum = sum.add(leave);
      });
      const is = sum.neg();               // leaving node n through the source
      const other = e.na === n ? e.nb : e.na;
      I[e.id] = e.na === n ? is : is.neg();
      const ish = `I<sub>s</sub>`;
      const l2 = [{ how: `KCL at node ${n.num} on its own: the currents leaving it through every element add up to zero. ${ish} = current leaving node ${n.num} through ${elH(e)}:`, eq: `${outT.concat([wrapT(e.id, ish)]).join(' + ')} = 0` },
        { how: `Rearrange for ${ish}:`, eq: `${wrapT(e.id, ish)} = −(${cnum(sum)}) = <b>${cans(is, 'A')}</b>` },
        { how: '', eq: `This is the current through ${wrapT(e.id, elH(e))} from node ${n.num} towards ${other.gnd ? 'the reference' : `node ${other.num}`}.` + (is.sign() < 0 ? ` The minus sign means ${cnum(is.neg())} A flows the other way, from ${other.gnd ? 'the reference' : `node ${other.num}`} towards node ${n.num}.` : '') }];
      S.push({ title: `Current through ${elH(e)}`, say: "A voltage source's current has no formula of its own. Find it with KCL at one of its nodes, now that every other current there is known.", lines: l2 });
      answers.push({ v: 'is_' + e.id, html: `current through ${elH(e)}`, val: is, unit: 'A', hide: true });
    });
  } else {
    net.els.filter(isI).forEach(e => {
      if (!(need || ex.includes('vsrc'))) return;
      const ms = X.iab(e).vars(); const k = Math.min(...ms.map(v => +v.slice(1)));
      const seq = [], colEls = j => net.els.filter(f => f.pos === 'col' && f.j === j).sort((a, b) => Math.min(net.P[a.a].y, net.P[a.b].y) - Math.min(net.P[b.a].y, net.P[b.b].y));
      colEls(k - 1).reverse().forEach(f => seq.push([f, 'up'])); net.els.filter(f => f.pos === 'top' && f.j === k - 1).forEach(f => seq.push([f, 'right']));
      colEls(k).forEach(f => seq.push([f, 'down'])); net.els.filter(f => f.pos === 'bot' && f.j === k - 1).forEach(f => seq.push([f, 'left']));
      const parts = []; let sum = C(0), selfDir = 1;
      seq.forEach(([f, dir]) => {
        const p = net.P[f.a], r = net.P[f.b];
        const ab = { up: r.y < p.y, down: r.y > p.y, right: r.x > p.x, left: r.x < p.x }[dir] ? 1 : -1;
        if (f === e) { selfDir = dir === 'down' || dir === 'right' ? 1 : -1; parts.push(wrapT(f.id, (selfDir > 0 ? '+ ' : '− ') + 'V')); return; }
        let drop;
        if (isP(f)) drop = f.Z.mul(I[f.id]).mul(ab);
        else if (isV(f)) drop = srcVal(f).mul(ab);
        else drop = M.vab[f.id].mul(ab);
        sum = sum.add(drop); parts.push(wrapT(f.id, (drop.sign() < 0 ? '− ' : '+ ') + cB(drop.abs())));
      });
      const vShow = sum.neg().mul(selfDir);       // top minus bottom (or left minus right)
      const end = e.pos === 'col' ? ['top', 'bottom'] : ['left', 'right'];
      const pa = net.P[e.a], pb = net.P[e.b]; const aIsFirst = e.pos === 'col' ? pa.y < pb.y : pa.x < pb.x;
      if (!(aIsFirst ? vShow : vShow.neg()).eq(M.vab[e.id])) throw Error('vsrc mismatch');
      S.push({ title: `Voltage across ${elH(e)}`, say: `A current source's voltage has no formula of its own. Call it V (${end[0]} end minus ${end[1]} end) and write KVL round mesh ${k}, now that every current is known. Each impedance drop is Z × I, worked out as before.`,
        lines: [{ how: `KVL round mesh ${k} (voltage drops, clockwise):`, eq: parts.join(' ').replace(/^(<[^>]+>)?\+ /, '$1').replace(/^(<[^>]+>)?− /, '$1−') + ' = 0' },
          { how: 'Rearrange for V:', eq: `V = <b>${cans(vShow, 'V')}</b> &nbsp; (${end[0]} end minus ${end[1]} end)` }] });
      answers.push({ v: 'vs_' + e.id, html: `voltage across ${elH(e)}`, val: vShow, unit: 'V', hide: true });
    });
  }
  // complex power balance (rms phasors)
  if (need) {
    const pl = []; let sup = C(0), abs = C(0); const supL = [], absL = [];
    net.els.forEach(e => {
      const i = I[e.id] ?? M.i[e.id], v = kind === 'nodal' ? vOf(e.na).sub(vOf(e.nb)) : (isI(e) ? M.vab[e.id] : (isP(e) ? e.Z.mul(i) : srcVal(e)));
      if (!i.eq(M.i[e.id]) || !v.eq(M.vab[e.id])) throw Error('power mismatch ' + e.id);
      const s = v.mul(i.conj());                           // absorbed, passive sign convention
      if (isP(e)) {
        const n2 = i.n2();
        const what = e.t === 'R' ? `P = ${fnum(s.re)} W` : e.t === 'L' ? `Q = +${fnum(s.im)} VAR` : `Q = ${fnum(s.im)} VAR`;
        pl.push({ how: wrapT(e.id, `${e.name} (${e.label}), current ${cnum(i)} A:`), eq: wrapT(e.id, `|I|² = ${fnB(i.re.abs())}² + ${fnB(i.im.abs())}² = ${fnum(n2)}; &nbsp; S = |I|²Z = ${fnum(n2)} × ${cP(e.Z)} = <b>${cnum(s)} VA</b> absorbed (${what})`) });
        abs = abs.add(s); absL.push(s); return;
      }
      const iout = i.neg(), sp = v.mul(iout.conj());       // supplied
      const ch = mulH(v, iout.conj());
      pl.push({ how: wrapT(e.id, `${e.fam === 'D' ? 'Dependent source' : e.name}: V = ${cnum(v)} V, ` + (isV(e) ? `current leaving its + terminal I = ${cnum(iout)} A:` : `current in its arrow direction I = ${cnum(iout)} A:`)),
        eq: wrapT(e.id, `S = V I* = ${prodH(v, iout.conj())} = ${ch.join(' = ')} VA supplied`) + ` &nbsp; (P = ${fnum(sp.re)} W, Q = ${fnum(sp.im)} VAR)` });
      sup = sup.add(sp); supL.push(sp);
    });
    if (!sup.eq(abs)) throw Error('power does not balance');
    pl.push({ how: '<b>Balance:</b>', eq: `supplied: ${supL.map((x, i) => constH(x, i === 0)).join('')}${supL.length > 1 ? ' = ' + cnum(sup) : ''} VA<br>absorbed: ${absL.map((x, i) => constH(x, i === 0)).join('')} = ${cnum(abs)} VA <span class="ok">✓</span>` });
    S.push({ title: 'Complex power balance', say: 'The phasors are rms values, so S = V I* (I* is the conjugate: change the sign of its j part). An impedance absorbs S = |I|²Z: a resistor absorbs real power P, an inductor +Q, a capacitor −Q. A source supplies S = V I* with I leaving its + terminal (voltage source) or flowing in its arrow direction (current source). Total supplied = total absorbed, for P and for Q.', lines: pl });
    answers.push({ v: 'ps', html: 'total complex power supplied', val: sup, unit: 'VA', hide: true });
  }
  // check: put the answers back into the first written equations
  const chk = [];
  const nv = t => { const val = t.sym ? t.dep.ex.scale(t.k.mul(t.dep.g).mul(t.dep.ck).div(t.dep.den)).at(vals) : t.ex.scale(t.k.div(t.den)).at(vals); return val.mul(t.sgn); };
  const side = ts => (!ts.length ? '0' : ts.length === 1 ? wrapT(ts[0].el, cnum(nv(ts[0]))) : ts.map((t, i) => constH(nv(t), i === 0)).map((h, i) => wrapT(ts[i].el, h)).join(''));
  const sum = ts => ts.reduce((s, t) => s.add(nv(t)), C(0));
  X.eqs.forEach(E => {
    const q0 = E.q0;
    const l = sum(q0.L), r = sum(q0.R);
    if (!l.eq(r)) throw Error('check failed');
    chk.push({ how: E.name.replace(/^the /, '').replace(/^./, c => c.toUpperCase()) + ':', eq: kind === 'nodal' ? `in: ${side(q0.L)} = ${cnum(l)} A<br>out: ${side(q0.R)} = ${cnum(r)} A <span class="ok">✓</span>` : `${side(q0.L)} = ${cnum(l)} <span class="ok">✓</span>` });
  });
  X.C.forEach(Cn => { const l = sum(Cn.q0.L), r = sum(Cn.q0.R); if (!l.eq(r)) throw Error('constraint check failed'); chk.push({ how: 'The source equation:', eq: `${side(Cn.q0.L)} = ${cnum(l)} and the source gives ${cnum(r)} <span class="ok">✓</span>` }); });
  if (chk.length) S.push({ title: 'Check', say: 'Put the answers back into the equations as first written: each term becomes a complex number. Both sides must agree.', lines: chk });
  return { answers };
}

function solveQ(q, kind) {
  const net = buildNet({ ...q.spec, mesh: kind === 'mesh' });
  const r = (kind === 'nodal' ? nodalSteps : meshSteps)(net, q);
  r.net = net; return r;
}

// ===================================================================== SVG drawing
function svgNet(net, kind, opt = {}) {
  const P = net.P, T = net.T, B = net.B, DX = net.DX, X0 = net.X0;
  let ul = '', wr = '', el = '', lb = '', ov = '';
  const line = (p, q, cls, extra = '') => `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" class="${cls}" ${extra}/>`;
  const nodeCls = n => (n.gnd ? 'k0' : 'k' + n.num);
  const nodeVar = n => (n.gnd ? '' : `data-var="${n.v}"`);
  const deg = {}; const bump = p => { deg[p] = (deg[p] || 0) + 1; };
  net.wires.forEach(([p, q]) => { bump(p); bump(q); });
  net.els.forEach(e => { bump(e.a); bump(e.b); });
  // wires
  net.wires.forEach(([p, q]) => {
    const n = net.nodeOf(p);
    if (kind === 'nodal') ul += line(P[p], P[q], 'ul ' + nodeCls(n), nodeVar(n));
    wr += line(P[p], P[q], 'wire');
  });
  // elements
  net.els.forEach(e => {
    const p = P[e.a], q = P[e.b], dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const cx = (p.x + q.x) / 2, cy = (p.y + q.y) / 2, half = e.fam === 'R' || e.fam === 'L' ? 42 : e.fam === 'C' ? 12 : 30;
    const s = { x: cx - ux * half, y: cy - uy * half }, t = { x: cx + ux * half, y: cy + uy * half };
    if (kind === 'nodal') { ul += line(p, s, 'ul ' + nodeCls(e.na), nodeVar(e.na)) + line(t, q, 'ul ' + nodeCls(e.nb), nodeVar(e.nb)); }
    wr += line(p, s, 'wire') + line(t, q, 'wire');
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    let body = '';
    if (e.fam === 'R') body = '<path class="wire" d="M-42,0 l6,-10 l12,20 l12,-20 l12,20 l12,-20 l12,20 l6,-10"/>';
    else if (e.fam === 'L') body = '<path class="wire" d="M-42,0 h3 a9,9 0 0 1 18,0 a9,9 0 0 1 18,0 a9,9 0 0 1 18,0 a9,9 0 0 1 18,0 h3"/>';
    else if (e.fam === 'C') body = '<path class="wire" d="M-12,0 h6 M-6,-20 V20 M6,-20 V20 M6,0 h6"/>';
    else {
      body = isDep(e) ? '<path class="wire src" d="M-30,0 L0,-30 L30,0 L0,30 Z"/>' : '<circle class="wire src" r="28"/>';
      if (isI(e)) body += '<path class="wire" stroke-width="2.5" d="M15,0 H-8"/><path class="arrowhead" d="M-17,0 l10,-7 v14 z"/>';
    }
    let signs = '';
    if (isV(e)) {
      const pp = { x: cx - ux * 13, y: cy - uy * 13 }, mm = { x: cx + ux * 13, y: cy + uy * 13 };
      signs = `<path class="sign" d="M${pp.x - 6},${pp.y} h12 M${pp.x},${pp.y - 6} v12 M${mm.x - 6},${mm.y} h12"/>`;
    }
    // label placement
    let lx, ly, anch = 'middle', mark = { x: 0, y: 0 };
    const off = e.fam === 'C' ? 30 : 40;
    if (e.pos === 'col') {
      const left = e.j === 0; anch = left ? 'end' : 'start'; lx = cx + (left ? -off : off); ly = cy - 6; mark = { x: left ? 1 : -1, y: 0 };
    } else if (e.pos === 'bot') { lx = cx; ly = cy + 50; mark = { x: 0, y: -1 }; }
    else { lx = cx; ly = cy - 52; mark = { x: 0, y: 1 }; }
    const nm = e.fam === 'D' ? '' : e.uname;
    const l1 = nm ? `<text x="${lx}" y="${ly}" text-anchor="${anch}" class="lab nm">${nm}</text>` : '';
    const vy = ly + (nm ? 26 : 8);
    const l2 = e.tlabel && e.tlabel !== e.label
      ? `<text x="${lx}" y="${vy}" text-anchor="${anch}" class="lab val tdl">${e.tlabel.split('\n').map((t, i) => `<tspan x="${lx}" dy="${i ? 21 : 0}">${t}</tspan>`).join('')}</text><text x="${lx}" y="${vy}" text-anchor="${anch}" class="lab val pzl${isDep(e) ? ' dep' : ''}">${e.label}</text>`
      : `<text x="${lx}" y="${vy}" text-anchor="${anch}" class="lab val${isDep(e) ? ' dep' : ''}">${e.label}</text>`;
    // control marker (Iₓ arrow or Vₓ signs) on the controlling element
    let cm = '';
    if (e.x) {
      const ox = mark.x * 26, oy = mark.y * 26, ax = cx + ox, ay = cy + oy;
      if (e.x === 'i') {
        const a = { x: ax - ux * 22, y: ay - uy * 22 }, b = { x: ax + ux * 22, y: ay + uy * 22 };
        const h = `M${b.x + ux * 4},${b.y + uy * 4} L${b.x - ux * 8 - uy * 6},${b.y - uy * 8 + ux * 6} L${b.x - ux * 8 + uy * 6},${b.y - uy * 8 - ux * 6} Z`;
        cm = `<g class="ctrl" data-var="x"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="cline"/><path d="${h}" class="chead"/><text x="${ax + mark.x * 18 + (mark.y ? 26 : 0)}" y="${ay + mark.y * 22 + 6}" text-anchor="${mark.x < 0 ? 'end' : 'start'}" class="lab cx">Iₓ</text></g>`;
      } else {
        const a = { x: ax - ux * 38, y: ay - uy * 38 }, b = { x: ax + ux * 38, y: ay + uy * 38 };
        cm = `<g class="ctrl" data-var="x"><path class="csign" d="M${a.x - 6},${a.y} h12 M${a.x},${a.y - 6} v12 M${b.x - 6},${b.y} h12"/><text x="${ax + mark.x * 12}" y="${ay + mark.y * 14 + 6}" text-anchor="${mark.x < 0 ? 'end' : mark.x > 0 ? 'start' : 'middle'}" class="lab cx">Vₓ</text></g>`;
      }
    }
    const hb = Math.max(half, 30);
    const hw = e.pos === 'col' ? [34, hb + 8] : [hb + 8, 34];
    el += `<g class="el" data-el="${e.id}"><rect class="halo" x="${cx - hw[0]}" y="${cy - hw[1]}" width="${hw[0] * 2}" height="${hw[1] * 2}" rx="10"/>` +
      `<g transform="translate(${cx},${cy}) rotate(${ang})">${body}</g>${signs}${l1}${l2}` +
      `<rect class="hit" x="${Math.min(cx - hw[0], anch === 'end' ? lx - 70 : cx - hw[0])}" y="${Math.min(cy - hw[1], ly - 18)}" width="${hw[0] * 2 + 72}" height="${hw[1] * 2 + 30}" fill="transparent"/></g>` + cm;
  });
  // junction dots
  Object.entries(deg).forEach(([p, d]) => { if (d >= 3) wr += `<circle cx="${P[p].x}" cy="${P[p].y}" r="5" class="dot"/>`; });
  if (kind === 'nodal') {
    // ground symbol and node labels
    const gx = X0 + DX * Math.max(0, Math.floor((net.ncol - 1) / 2)) + (net.ncol > 1 ? DX / 2 : 0);
    lb += `<g class="gnd"><path class="wire" d="M${gx},${B} V${B + 18} M${gx - 20},${B + 18} H${gx + 20} M${gx - 13},${B + 25} H${gx + 13} M${gx - 6},${B + 32} H${gx + 6}"/><text x="${gx + 28}" y="${B + 32}" class="lab muted">reference, 0 V</text></g>`;
    net.nodes.filter(n => !n.gnd).forEach(n => {
      const pts = n.pts.map(k => P[k]).sort((a, b) => (a.y - b.y) || (a.x - b.x));
      const top = pts.filter(p => p.y === T)[0] || pts[0];
      lb += `<g class="nlab" data-var="${n.v}"><circle cx="${top.x}" cy="${top.y}" r="7" class="ndot ${nodeCls(n)}"/><text x="${top.x - 10}" y="${top.y - 16}" text-anchor="end" class="lab nl ${nodeCls(n)}">${uni('V', n.num)}</text></g>`;
    });
    (opt.supernodes || []).forEach(g => {
      const pts = g.flatMap(n => n.pts.map(k => P[k]));
      const x1 = Math.min(...pts.map(p => p.x)) - 28, x2 = Math.max(...pts.map(p => p.x)) + 28;
      const y1 = Math.min(...pts.map(p => p.y)) - 84, y2 = T + 34;
      ov += `<rect class="bubble" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="26"/><text x="${x2 - 8}" y="${y2 + 18}" text-anchor="end" class="lab sup">supernode</text>`;
    });
  } else {
    const m = net.ncol - 1;
    for (let k = 1; k <= m; k++) {

// and the two-way hover link between circuit elements and equation terms. Nothing here is timed.
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TOPIC = window.TOPIC, KIND = TOPIC.kind;
let view = 'questions', curQ = null, shown = 0, curSol = null, genLevel = TOPIC.levels[1].id, genTd = false;

// ---------------------------------------------------------------- hover: element <-> term, node/mesh <-> variable
let pinned = null;
function keyOf(t) { const g = t.closest('[data-el]') || t.closest('[data-var]'); if (!g) return null; return g.dataset.el ? ['el', g.dataset.el] : ['var', g.dataset.var]; }
function light(k, scope) {
  $$('.hl').forEach(n => n.classList.remove('hl'));
  if (!k || !scope) return;
  $$(`[data-${k[0]}="${k[1]}"]`, scope).forEach(n => n.classList.add('hl'));
}
document.addEventListener('mouseover', e => { if (pinned) return; const k = keyOf(e.target); light(k, e.target.closest('.scope')); });
document.addEventListener('mouseout', e => { if (pinned) return; if (!e.relatedTarget || !keyOf(e.relatedTarget)) light(null); });
document.addEventListener('click', e => {           // tap to pin a highlight on touch screens; tap again to clear
  const k = keyOf(e.target);
  if (!k) { pinned = null; light(null); return; }
  if (pinned && pinned[0] === k[0] && pinned[1] === k[1]) { pinned = null; light(null); return; }
  pinned = k; light(k, e.target.closest('.scope'));
});

// ---------------------------------------------------------------- text helpers
const varList = vs => vs.map(v => VH(v));
function autoText(q, sol) {
  if (q.text) return q.text;
  const u = sol.unknowns, ex = q.extras || [], net = sol.net;
  const what = KIND === 'nodal' ? 'node voltage phasor' : 'mesh current phasor';
  const parts = [];
  if (net.w) parts.push(`The sources work at ω = ${net.w} rad/s. Change the circuit to the phasor domain first.`);
  parts.push(`Use ${KIND} analysis to find the ${what}${u.length > 1 ? 's' : ''} ${listJoin(varList(u))}` + (net.w ? ` and write ${u.length > 1 ? 'them' : 'it'} as ${u.length > 1 ? 'sinusoids' : 'a sinusoid'} of time` : ', in rectangular and polar form') + ', then the current in each element.');
  if (ex.includes('isrc')) parts.push(`Find the current through ${listJoin(net.els.filter(isV).filter(e => !isDep(e)).map(elH))}.`);
  if (ex.includes('vsrc')) parts.push(`Find the voltage across ${listJoin(net.els.filter(isI).filter(e => !isDep(e)).map(elH))}.`);
  if (net.ctrl) parts.push('Find the value of the dependent source.');
  if (ex.includes('power')) parts.push('The source values are rms phasors. Find the complex power of every element and show that the total supplied equals the total absorbed.');
  return parts.map(p => `<p>${p}</p>`).join('');
}
// read a complex number typed by a student: 4+j8, 4 + 8j, -j2, 8.94∠63.4, 8.94<63.4, 8.94@63.4
function parseCx(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/\s+/g, '').replace(/°/g, '').replace(/(VA|VAR|[VAWΩ])$/i, '').replace(/i/g, 'j');
  if (!s) return null;
  const pm = /^(-?\d*\.?\d+)(?:∠|<|@|ang)(-?\d*\.?\d+)$/.exec(s);
  if (pm) { const m = +pm[1], a = +pm[2] * Math.PI / 180; return [m * Math.cos(a), m * Math.sin(a)]; }
  const toks = s.match(/[+-]?[^+-]+/g); if (!toks) return null;
  let re = 0, im = 0;
  for (const t of toks) {
    if (t.includes('j')) { const n = t.replace('j', ''); const v = n === '' || n === '+' ? 1 : n === '-' ? -1 : Number(n); if (!Number.isFinite(v)) return null; im += v; }
    else { const v = Number(t); if (!Number.isFinite(v)) return null; re += v; }
  }
  return [re, im];
}

// ---------------------------------------------------------------- one question (fixed or generated)
function stepHTML(s) {
  const lines = (s.lines || []).map(l => `<div class="line">${l.how ? `<div class="how">${l.how}</div>` : ''}${l.eq ? `<div class="eq">${l.eq}</div>` : ''}</div>`).join('');
  const cap = h => h.replace(/^((?:<[^>]+>)*)([a-z])/, (m, t, c) => t + c.toUpperCase());
  return `<h3>${s.title}</h3>${s.say ? `<p>${cap(s.say)}</p>` : ''}${lines}${s.note ? `<div class="note">${s.note}</div>` : ''}` +
    (s.details ? `<details><summary>${s.details.title}</summary><div class="eq">${s.details.html}</div></details>` : '');
}
function solve(q) {
  if (q.sol) return q.sol;
  q.sol = solveQ(q, KIND); return q.sol;
}
function answerList(q, sol) {
  const a = sol.unknowns.map(v => ({ html: VH(v), val: sol.vals[v], unit: KIND === 'nodal' ? 'V' : 'A' }));
  return a.concat(sol.answers || []);
}
function renderQ(box, q, label) {
  const sol = solve(q); curQ = q; curSol = sol; shown = 0;
  const lv = TOPIC.levels.find(l => l.id === q.level);
  const ans = answerList(q, sol);
  const tryable = ans.filter(a => !a.hide);
  box.innerHTML = `<div class="qgrid scope">
    <div class="sticky"><div class="card"><div id="cktbox"></div>
      <p class="hint">Hover over (or tap) any element to light up every term it creates in the equations. Hover over a term to find its element. Coloured letters are ${KIND === 'nodal' ? 'node voltages' : 'mesh currents'}.</p></div></div>
    <div class="card">
      <div class="qhead"><span class="chip">${lv ? lv.name : ''}</span><h2>${label}</h2></div>
      <div class="qtext">${autoText(q, sol)}</div>
      ${tryable.length ? `<details class="try"><summary>Try it yourself first, then check your answers here</summary>
        <div class="muted">Type rectangular form (4 + j8) or polar form (8.94∠63.4 or 8.94&lt;63.4).</div>
        <div>${tryable.map((a, i) => `<label>${a.html} = <input data-i="${i}" autocomplete="off" spellcheck="false"> ${a.unit}</label>`).join('')}
        <button id="chk">Check</button> <span id="chkout"></span></div></details>` : ''}
      <div class="ctl"><button class="primary" id="nx">Show next step</button><button id="all">Show all steps</button><button id="hide">Hide steps</button>
        <span class="muted" id="cnt"></span></div>
      <ol class="steps">${sol.steps.map(s => `<li hidden>${stepHTML(s)}</li>`).join('')}</ol>
      <div class="answer" id="ansbox" hidden><b>Answers:</b> ${ans.map(a => `${a.html} = <b>${cans(a.val, a.unit)}</b>`).join('; &nbsp; ')}</div>
      ${q.mistake ? `<div class="warn" id="mist" hidden><b>Common mistake:</b> ${q.mistake}</div>` : ''}
    </div></div>`;
  $('#cktbox').innerHTML = svgNet(sol.net, KIND, overlays(sol.net, KIND));
  $('#nx').onclick = () => reveal(shown + 1);
  $('#all').onclick = () => reveal(sol.steps.length);
  $('#hide').onclick = () => reveal(0);
  const ck = $('#chk');
  if (ck) ck.onclick = () => {
    let good = 0;
    $$('.try input').forEach(inp => {
      const a = tryable[+inp.dataset.i], v = parseCx(inp.value), t = [a.val.re.val(), a.val.im.val()];
      const ok = v !== null && Math.hypot(v[0] - t[0], v[1] - t[1]) <= Math.max(0.02, Math.hypot(t[0], t[1]) * 0.01);
      inp.style.borderColor = v === null ? '' : ok ? 'var(--ok)' : 'var(--bad)'; if (ok) good++;
    });
    $('#chkout').innerHTML = good === tryable.length ? '<span class="ok">All correct ✓</span>' : `<span class="bad">${good} of ${tryable.length} correct.</span> Open the steps to see where it goes wrong.`;
  };
  reveal(0);
}
// the circuit is drawn once per question; later steps only switch on the node colours, the bubble and the phasor labels
function drawCkt() {
  const sol = curSol, upto = sol.steps.slice(0, shown), svg = $('#cktbox svg');
  svg.classList.toggle('colour', KIND === 'nodal' && upto.some(s => /name the nodes/i.test(s.title)));
  svg.classList.toggle('over', upto.some(s => /supernode|supermesh/i.test(s.title)));
  svg.classList.toggle('pd', upto.some(s => s.pd));
}
function reveal(n) {
  const li = $$('ol.steps>li'); shown = Math.max(0, Math.min(li.length, n));
  li.forEach((l, i) => { l.hidden = i >= shown; l.classList.toggle('new', i === shown - 1); });
  $('#cnt').textContent = `${shown} of ${li.length} steps shown`;
  $('#nx').disabled = shown >= li.length; $('#hide').disabled = shown === 0; $('#all').disabled = shown >= li.length;
  $('#ansbox').hidden = shown < li.length; const m = $('#mist'); if (m) m.hidden = shown < li.length;
  drawCkt();
  if (n > 0 && li[shown - 1] && n === shown && n !== li.length) li[shown - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---------------------------------------------------------------- views
function setView(v) {
  view = v; pinned = null;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const M = $('main');
  if (v === 'method') {
    M.innerHTML = `<div class="mgrid">${TOPIC.method.map((s, i) => `<div class="card scope"><h2>${s.title}</h2>${s.spec ? `<div class="mc" data-i="${i}"></div>` : ''}${s.html}</div>`).join('')}</div>`;
    $$('.mc').forEach(d => { const s = TOPIC.method[+d.dataset.i]; const net = buildNet({ ...s.spec, mesh: KIND === 'mesh' }); d.innerHTML = svgNet(net, KIND, overlays(net, KIND)); const svg = $('svg', d); if (KIND === 'nodal') svg.classList.add('colour'); if (s.over) svg.classList.add('over'); if (s.pd) svg.classList.add('pd'); });
  } else if (v === 'questions') {
    M.innerHTML = `<div class="card levels">${TOPIC.levels.map(l => `<div class="level"><div class="lname">${l.name}<small>${l.blurb}</small></div>${TOPIC.questions.map((q, i) => [q, i]).filter(([q]) => q.level === l.id).map(([q, i]) => `<button class="qbtn" data-i="${i}">Q${i + 1} · ${q.title}</button>`).join('')}</div>`).join('')}
      <p class="muted">Every question is open: start anywhere. They get harder from top to bottom.</p></div><div id="qbox"></div>`;
    $$('.qbtn').forEach(b => { b.onclick = () => openQ(+b.dataset.i); });
    openQ(TOPIC.questions.indexOf(curQ) >= 0 ? TOPIC.questions.indexOf(curQ) : 0, true);
  } else {
    M.innerHTML = `<div class="card gen"><b>Difficulty:</b> ${TOPIC.levels.map(l => `<button class="lvb" data-l="${l.id}">${l.name}</button>`).join('')}
      <label class="tdopt"><input type="checkbox" id="tdo"${genTd ? ' checked' : ''}> start in the time domain</label>
      <button class="primary" id="go">Generate question</button>
      <span class="code" id="code"></span>
      <span style="margin-left:auto"></span><input id="cin" placeholder="question code" aria-label="question code"><button id="cgo">Load</button></div>
      <p class="muted">Each question is new: the circuit is drawn from the chosen level and the values are picked so that the answers come out as friendly complex numbers. Tick "start in the time domain" to be given L in henries, C in farads and the sources as cosines. The solution is worked out step by step, the same way as in the question bank. Share the code to give a classmate the same question.</p><div id="qbox"></div>`;
    const mark = () => $$('.lvb').forEach(b => b.classList.toggle('on', b.dataset.l === genLevel));
    $$('.lvb').forEach(b => { b.onclick = () => { genLevel = b.dataset.l; mark(); }; });
    mark();
    $('#tdo').onchange = e => { genTd = e.target.checked; };
    $('#go').onclick = () => gen(genLevel, Math.floor(Math.random() * 90000) + 10000, genTd);
    $('#cgo').onclick = () => {
      const m = /^\s*([A-Za-z])(T?)-(\d+)\s*$/i.exec($('#cin').value); const lv = m && TOPIC.levels.find(l => l.code.toLowerCase() === m[1].toLowerCase());
      if (lv) { genLevel = lv.id; genTd = !!m[2]; $('#tdo').checked = genTd; mark(); gen(lv.id, +m[3], genTd); } else $('#code').textContent = 'Code not recognised (example: S-12345 or ST-12345)';
    };
  }
}
function openQ(i, quiet) {
  const q = TOPIC.questions[i];
  $$('.qbtn').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  renderQ($('#qbox'), q, `Question ${i + 1}: ${q.title}`);
  if (!quiet) $('#qbox').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function gen(level, seed, td) {
  const lv = TOPIC.levels.find(l => l.id === level);
  let q;
  try { q = generate(TOPIC, level, seed, td); } catch (e) { $('#qbox').innerHTML = '<p class="bad">Could not make a question this time. Click Generate again.</p>'; return; }
  $('#code').textContent = `Code: ${lv.code}${td ? 'T' : ''}-${seed}`;
  renderQ($('#qbox'), q, `Practice question (${lv.name}${td ? ', time domain' : ''})`);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !$('#nx')) return;
  if (e.key === 'ArrowRight') reveal(shown + 1); if (e.key === 'ArrowLeft') reveal(shown - 1);
});
$$('nav.tabs button').forEach(b => { b.onclick = () => setView(b.dataset.v); });
setView('questions');

</script>
</body>
</html>
